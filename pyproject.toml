[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "migrations",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "DTZ",  # Phase 277.B.026 — ban naive datetime
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "E722", # bare except (no bare except: in production)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR2004", # magic value used in comparison
    "TRY003", # avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["hub"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["PLR2004", "S101"]  # allow magic numbers and asserts in tests
"hub/apps/**/migrations/*.py" = ["ALL"]  # ignore migrations

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "drf_spectacular.*",
    "django_rq.*",
    "django_structlog.*",
    "django_prometheus.*",
    "strawberry.*",
    "boto3.*",
    "botocore.*",
    "redis.*",
    "rq.*",
    "psycopg2.*",
    "faker.*",
    "factory.*",
    "freezegun.*",
    "locust.*",
    "pytest.*",
    "pytest_django.*",
    "coverage.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hub.apps.*.migrations.*"
ignore_errors = true


# ---------------------------------------------------------------------------
# Phase 228.F2.13 — mutmut configuration for the lineage validator.
#
# Mutmut runs are slow (~15 min on a 100-LOC module) and the validator
# is the highest-value mutation target in F2: a pure-function module
# whose mutants are deterministically detected by the property-based
# test suite (test_lineage_validator.py).  We pin the targets and
# the test runner so a CI nightly job (.github/workflows/mutmut-
# lineage-validator.yml) can drive mutation testing without touching
# the rest of the codebase.
#
# Run locally:
#
#     pip install mutmut
#     mutmut run --paths-to-mutate=hub/apps/contracts/lineage_validator.py
#     mutmut results
#
# Why pin the runner: ``mutmut`` defaults to discovering pytest
# without django-setup.  Our validator imports nothing from Django,
# but ``test_lineage_validator.py`` lives under ``hub/apps/`` whose
# conftest does Django setup — slow on every mutant.  We re-target
# tests-only at the module level so each mutant runs the 18-test
# suite in isolation.
# ---------------------------------------------------------------------------

[tool.mutmut]
paths_to_mutate = "hub/apps/contracts/lineage_validator.py"
tests_dir = "hub/apps/contracts/tests"
runner = "python -m pytest hub/apps/contracts/tests/test_lineage_validator.py -x -q --no-header"
backup = false
# Skip lines that aren't logic-bearing (docstrings, type-hint imports)
# so mutmut doesn't waste cycles on no-op mutants.
also_copy = []
# Per-mutant timeout — the validator's worst-case run (the
# hypothesis property test on a max-size DAG) finishes in <30s
# even on a slow runner.
runner_timeout = 60


