# Marquez test container for OpenLineage round-trip integration tests.
# Uses the existing postgres-test from docker-compose.test.yml.
# Prerequisites: docker compose -f docker-compose.test.yml up -d (test stack already running)
#
# Usage:
#   docker compose -f docker-compose.test.marquez.yml up -d
#   MARQUEZ_INTEGRATION_TEST_URL=http://localhost:5000/api/v1/lineage \
#       python -m pytest hub/apps/integrations/openlineage/tests/test_openlineage_marquez_integration.py
#   docker compose -f docker-compose.test.marquez.yml down

services:
  marquez:
    image: marquezproject/marquez:0.46.0
    container_name: hub-test-marquez
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      MARQUEZ_CONFIG: /usr/src/marquez/marquez.test.yml
    volumes:
      - ./docker/marquez/marquez.test.yml:/usr/src/marquez/marquez.test.yml:ro
    ports:
      - "5000:5000"
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - marquez-net
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  marquez-net:
    name: datainteroperabilityhub_hub-test-net
    external: true
