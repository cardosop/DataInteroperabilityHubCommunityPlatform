name: Bug report
description: Report a bug in the core platform
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Core-only (HUB_CORE_ONLY=1)
        - Full self-hosted
        - Other
    validations:
      required: true
