name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly Monday — boundary + secrets regression sweep

jobs:
  boundary-and-secrets:
    name: GATE-29 + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GATE-29 — core never imports paid
        run: python scripts/check_core_boundary.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check hub/ scripts/
      - run: black --check hub/ scripts/
      - run: mypy --config-file pyproject.toml hub/apps/core hub/apps/tenants hub/apps/assets || true

  test-core:
    name: Core-only backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - name: Start core test stack
        run: docker compose -f docker-compose.test.yml -f docker-compose.test.core.yml up -d --build --wait
        timeout-minutes: 10
      - name: Run core-only tests
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.test.core.yml exec -T \
            -e HUB_CORE_ONLY=1 \
            -e DATABASE_URL=postgresql://hub_test:hub_test@postgres-test:5432/hub_test_test_shared \
            api-service-test \
            python -m pytest hub/apps/ hub/tests/ --reuse-db -x -q --timeout=300 \
              -m "not e2e and not integration and not requires_fuseki and not requires_prefect and not requires_stripe and not requires_services and not network and not benchmark and not performance"
        timeout-minutes: 20
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml -f docker-compose.test.core.yml down -v --remove-orphans

  docker-images:
    name: Build + publish core images (GHCR)
    runs-on: ubuntu-latest
    needs: [test-core]
    if: github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images built FROM THE PUBLIC TREE ONLY — paid code never enters
      # public image layers. The worker image uses the overlay-patched
      # Dockerfile (no compliance_engine COPY).
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api-core:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker-core:latest

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
