name: Release (SDK packages)

# Publishing SDK packages needs the npm/PyPI credentials secrets.
# Until they are configured, the workflow is manual-only — the
# tag push happens on every publish, and an unconfigured release
# job failing on each sync is noise (0.4 review round).
on:
  workflow_dispatch:

jobs:
  sdk-js:
    name: Publish @datahub/interoperability-sdk to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        working-directory: sdk/js
      - run: npm run build
        working-directory: sdk/js
      - run: npm publish
        working-directory: sdk/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sdk-python:
    name: Publish datahub-interoperability to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
        working-directory: sdk/python
      - run: twine upload dist/*
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
