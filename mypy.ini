# Mypy configuration file.
#
# THIS FILE IS AUTHORITATIVE. mypy's config discovery order is
# mypy.ini > .mypy.ini > pyproject.toml > setup.cfg, so as long as this file
# exists the ``[tool.mypy]`` section in pyproject.toml is NEVER read.
# (The previous header claimed the opposite; Phase 250.DoD.R10 then added the
# ``[mypy-requests.*]`` block here only, and pyproject.toml silently rotted.)
#
# The two are now kept equivalent — change BOTH or neither. Do not delete this
# file without also updating scripts/final_python312_verification.sh, which
# greps it for ``python_version = 3.12``.

[mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

exclude = ^(hub/apps/contracts/schemas/odps|tests/fixtures/odps)/v[0-9]+\.[0-9xX]+/|^docs/docs/|^frontend/|^sdk/|^[\w.-]*venv[\w.-]*/|^cli/build/|^services/|^infrastructure/staging/config-artifacts/
# Phase Q.1.1 (2026-08-21) — ODPS schema fixture dirs carry dotted version
# names (v1.x, v2.x, v4.1) that mypy reads as invalid package paths and
# crashes `mypy .` with exit 2 BEFORE any file is checked (the "all-green"
# CI step was unfalsifiable). MUST live in [mypy], not after the
# per-module sections (mypy attaches stray keys to the last section).

[mypy-django.*]
ignore_missing_imports = true

[mypy-rest_framework.*]
ignore_missing_imports = true

[mypy-drf_spectacular.*]
ignore_missing_imports = true

[mypy-django_rq.*]
ignore_missing_imports = true

