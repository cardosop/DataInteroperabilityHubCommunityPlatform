# Mypy configuration file
# This is a legacy location - pyproject.toml is preferred
# Keeping for backwards compatibility

[mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[mypy-django.*]
ignore_missing_imports = true

[mypy-rest_framework.*]
ignore_missing_imports = true

[mypy-drf_spectacular.*]
ignore_missing_imports = true

[mypy-django_rq.*]
ignore_missing_imports = true

[mypy-django_structlog.*]
ignore_missing_imports = true

[mypy-django_prometheus.*]
ignore_missing_imports = true

[mypy-strawberry.*]
ignore_missing_imports = true

[mypy-boto3.*]
ignore_missing_imports = true

[mypy-botocore.*]
ignore_missing_imports = true

[mypy-redis.*]
ignore_missing_imports = true

[mypy-rq.*]
ignore_missing_imports = true

[mypy-psycopg2.*]
ignore_missing_imports = true

[mypy-faker.*]
ignore_missing_imports = true

[mypy-factory.*]
ignore_missing_imports = true

[mypy-freezegun.*]
ignore_missing_imports = true

[mypy-locust.*]
ignore_missing_imports = true

[mypy-pytest.*]
ignore_missing_imports = true

[mypy-pytest_django.*]
ignore_missing_imports = true

[mypy-coverage.*]
ignore_missing_imports = true

[mypy-requests.*]
ignore_missing_imports = true

[mypy-hub.apps.*.migrations.*]
ignore_errors = true

