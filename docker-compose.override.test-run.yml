# Override to run Phase 7 (and other) tests when mock-server is unhealthy.
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.test-run.yml up -d api-service
# Then: docker compose exec -T api-service bash -c "cd /app && PYTHONPATH=/app python -m pytest <paths> -v --tb=short --reuse-db"
# This allows api-service to start with mock-server as "started" (not "healthy").
version: "3.8"
services:
  api-service:
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      mock-server:
        condition: service_started
