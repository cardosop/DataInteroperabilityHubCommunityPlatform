# Ruff configuration file
# This is a legacy location - pyproject.toml is preferred
# Keeping for backwards compatibility

line-length = 100
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "migrations",
    "node_modules",
    "backups",
    "cli/build",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR2004", # magic value used in comparison
    "TRY003", # avoid specifying long messages outside the exception class
    "PLC0415", # lazy imports inside functions (Django pattern to avoid circular imports)
    "E402",  # module-level imports after django.setup() (Django initialization pattern)
]

[lint.isort]
known-first-party = ["hub"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["PLR2004", "S101"]  # allow magic numbers and asserts in tests
"hub/apps/**/migrations/*.py" = ["ALL"]  # ignore migrations
"scripts/check_doc_journey_marker_sync.py" = ["PLR0912", "PLR0915"]  # CLI tool — multi-check runner
"scripts/check_doc_uc_marker_sync.py" = ["PLR0912", "PLR0915"]  # CLI tool — same pattern

