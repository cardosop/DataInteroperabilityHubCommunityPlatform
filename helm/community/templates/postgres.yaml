apiVersion: v1
kind: Service
metadata:
  name: {{ include "datahub-core.name" . }}-postgres
  labels: {{ include "datahub-core.labels" . | nindent 4 }}
spec:
  ports: [{ port: 5432 }]
  selector: { app: {{ include "datahub-core.name" . }}-postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datahub-core.name" . }}-postgres
  labels: {{ include "datahub-core.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "datahub-core.name" . }}-postgres }
  template:
    metadata:
      labels: { app: {{ include "datahub-core.name" . }}-postgres }
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "datahub-core.name" . }}-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "datahub-core.name" . }}-postgres
  labels: {{ include "datahub-core.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
