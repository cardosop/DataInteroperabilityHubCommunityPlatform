apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "datahub-core.name" . }}-migrate
  labels: {{ include "datahub-core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels: {{ include "datahub-core.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.images.api }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "hub/manage.py", "migrate", "--noinput"]
          env:
            - name: HUB_CORE_ONLY
              value: "1"
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "datahub-core.name" . }}-postgres:5432/hub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: JWT_SECRET_KEY
