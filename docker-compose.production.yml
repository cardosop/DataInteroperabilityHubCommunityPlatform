# Docker Compose Production Template
#
# This is a template for production Docker Compose deployments.
# In production, consider using Kubernetes instead for better scalability and management.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# IMPORTANT: Update all environment variables and secrets before deployment!
#
# =============================================================================
# Kubernetes Parity (Phase 62)
# =============================================================================
#
# Services WITH Helm templates (helm/templates/):
#   api-service, worker, worker-heavy, frontend, pgbouncer,
#   semantic-service, compliance-service, dq-service,
#   datacontract-service, prefect-integration, prefect-worker, fuseki
#
# Services managed OUTSIDE this Helm chart in Kubernetes:
#   postgres        → AWS RDS (Aurora PostgreSQL)
#   redis-cache     → AWS ElastiCache or Bitnami Redis Helm chart
#   redis-queue     → AWS ElastiCache or Bitnami Redis Helm chart
#   redis-events    → AWS ElastiCache or Bitnami Redis Helm chart
#   (vault removed — Phase 211: secrets via AWS Secrets Manager)
#   prometheus      → kube-prometheus-stack Helm chart
#   grafana         → kube-prometheus-stack or Grafana Helm chart
#   loki            → Grafana Loki Helm chart (grafana/loki)
#   promtail        → Grafana Promtail Helm chart (grafana/promtail)
#   tempo           → Grafana Tempo Helm chart (grafana/tempo)
#   alertmanager    → kube-prometheus-stack Helm chart
#   traefik         → Traefik Helm chart or AWS ALB Ingress Controller
#   minio           → AWS S3 (no MinIO needed in production)
#   prefect-server  → Official prefecthq/prefect-server Helm chart
#
# Services that are DEV/TEST only (not deployed to production):
#   odh-inference-scheduler, odh-training-operator
# =============================================================================

version: '3.8'

services:
  # PostgreSQL Database (Production)
  # SSL enabled via command-line args. Certs are copied from the mounted read-only
  # directory into PGDATA by 04-ssl-copy.sh (runs as the postgres user, ensuring
  # correct file ownership). Run infrastructure/postgres/ssl-setup.sh first.
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres-production
    # -c ssl=on            — enable TLS listener
    # -c ssl_cert_file=... — relative to PGDATA (copied by 04-ssl-copy.sh)
    # -c ssl_key_file=...  — chmod 600, owned by postgres user
    # -c ssl_ca_file=...   — internal CA cert for optional client cert verification
    # -c max_connections   — sized for PgBouncer (54 pool) + admin + headroom
    command: >-
      postgres
      -c ssl=on
      -c ssl_cert_file=server.crt
      -c ssl_key_file=server.key
      -c ssl_ca_file=root.crt
      -c max_connections=200
      -c log_connections=off
      -c log_disconnections=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      # Passed to 03-pgbouncer-user.sh to create pgbouncer roles
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
    # ports: intentionally omitted — production access is via pgbouncer (ClusterIP).
    # Break-glass pg_dump access: exec into container or use kubectl port-forward.
    volumes:
      - pgdata-production:/var/lib/postgresql/data
      # SQL schema / initial data (renamed to 01- for predictable ordering)
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # pg_hba.conf: add hostssl rule (require TLS for all TCP connections)
      - ./infrastructure/postgres/02-pg-hba-host.sh:/docker-entrypoint-initdb.d/02-pg-hba-host.sh:ro
      # Creates pgbouncer + pgbouncer_admin roles and public.pgbouncer_lookup()
      - ./infrastructure/postgres/03-pgbouncer-user.sh:/docker-entrypoint-initdb.d/03-pgbouncer-user.sh:ro
      # Copies TLS certs from /etc/postgresql/tls/ into PGDATA with correct perms
      - ./infrastructure/postgres/04-ssl-copy.sh:/docker-entrypoint-initdb.d/04-ssl-copy.sh:ro
      # TLS certificates (read-only source; 04-ssl-copy.sh copies them to PGDATA)
      - ./infrastructure/postgres/certs:/etc/postgresql/tls:ro
    healthcheck:
      # pg_isready uses a unix socket (local), bypassing the hostssl pg_hba rule.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ---------------------------------------------------------------------------
  # PostgreSQL Read Replica — Production (Phase 17.5)
  # In production, prefer the AWS RDS Multi-AZ read-replica endpoint instead
  # of running a local replica container.  This service is provided for
  # non-AWS deployments (self-hosted / on-prem).
  # Enable with: docker compose -f docker-compose.production.yml --profile replica up
  #
  # NOTE: The primary postgres service must have wal_level=replica and
  # max_wal_senders >= 1 (add to its 'command' block if self-hosted).
  postgres-replica:
    image: bitnami/postgresql:16
    container_name: hub-postgres-replica-production
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: ${POSTGRES_DIRECT_HOST:-postgres}
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    profiles:
      - replica

  # ---------------------------------------------------------------------------
  # PgBouncer — PostgreSQL connection pooler (Production)
  #
  # pool_mode=transaction: connections returned to pool after each transaction.
  # INCOMPATIBLE with: advisory locks, LISTEN/NOTIFY, named cursors.
  # The codebase has been audited — zero named cursors found.
  #
  # Auth: SCRAM-SHA-256 + auth_query via public.pgbouncer_lookup().
  # TLS: client_tls_sslmode=require + server_tls_sslmode=require (internal CA).
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: hub-pgbouncer-production
    # Generate userlist.txt from env vars at startup, then exec pgbouncer.
    # Userlist contains only the pgbouncer auth user and admin user.
    # Application users (hub, etc.) are resolved via auth_query at connect time.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        USERLIST=/etc/pgbouncer/userlist.txt
        printf '"pgbouncer" "%s"\n"pgbouncer_admin" "%s"\n' \
          "${PGBOUNCER_AUTH_PASSWORD}" \
          "${PGBOUNCER_ADMIN_PASSWORD}" \
          > "${USERLIST}"
        chmod 600 "${USERLIST}"
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
    # ports: intentionally omitted — app services reach pgbouncer via Docker
    # internal hostname 'pgbouncer:5432'; no host-level port needed in production.
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Internal CA + PgBouncer server cert/key (generated by ssl-setup.sh)
      - ./infrastructure/postgres/certs:/etc/pgbouncer/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # nc -z: TCP connect-only probe; edoburu/pgbouncer is Alpine-based and
      # does NOT include postgresql-client (no psql/pg_isready). BusyBox nc is
      # always present and sufficient — if pgbouncer is listening it is alive.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hub-net-production
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Redis Cache Instance - Response caching, contract caching, lineage caching (Production)
  redis-cache:
    image: redis:7-alpine
    container_name: hub-redis-cache-production
    # --requirepass enforces authentication on all connections.
    # REDIS_CACHE_PASSWORD must be set in .env.production (sourced from AWS Secrets Manager).
    command: >
      redis-server
      --requirepass ${REDIS_CACHE_PASSWORD}
      --save 900 1 --save 300 10 --save 60 10000
      --maxmemory 4gb --maxmemory-policy allkeys-lru
    # ports: intentionally omitted — reached internally via redis-cache:6379.
    volumes:
      - redis-cache-data-production:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Queue Instance - Job queues (RQ) (Production)
  redis-queue:
    image: redis:7-alpine
    container_name: hub-redis-queue-production
    # --requirepass enforces authentication. REDIS_QUEUE_PASSWORD from AWS Secrets Manager.
    command: >
      redis-server
      --requirepass ${REDIS_QUEUE_PASSWORD}
      --appendonly yes --appendfsync everysec
      --maxmemory 2gb --maxmemory-policy noeviction
    # ports: intentionally omitted — reached internally via redis-queue:6379.
    volumes:
      - redis-queue-data-production:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_QUEUE_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Redis Events Instance - Event bus (Pub/Sub, Streams) (Production)
  redis-events:
    image: redis:7-alpine
    container_name: hub-redis-events-production
    # --requirepass enforces authentication. REDIS_EVENTS_PASSWORD from AWS Secrets Manager.
    command: >
      redis-server
      --requirepass ${REDIS_EVENTS_PASSWORD}
      --appendonly yes --appendfsync everysec
      --maxmemory 2gb --maxmemory-policy allkeys-lru
    # ports: intentionally omitted — reached internally via redis-events:6379.
    volumes:
      - redis-events-data-production:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_EVENTS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Redis Channels Instance - WebSocket channels (Django Channels) (Production)
  redis-channels:
    image: redis:7-alpine
    container_name: hub-redis-channels-production
    # --requirepass enforces authentication. REDIS_CHANNELS_PASSWORD from AWS Secrets Manager.
    command: >
      redis-server
      --requirepass ${REDIS_CHANNELS_PASSWORD}
      --maxmemory 1gb --maxmemory-policy allkeys-lru
    # ports: intentionally omitted — reached internally via redis-channels:6379.
    volumes:
      - redis-channels-data-production:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CHANNELS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # MinIO (S3-compatible storage) (Production)
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-minio-production
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # ports: intentionally omitted — reached internally; console access via kubectl port-forward.
    volumes:
      - minio-data-production:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Apache Jena Fuseki (Triple Store) (Production)
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-fuseki-production
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      # Phase 18.5: reduce heap — FTS migrated to PostgreSQL, Fuseki is ODPS-only now
      JVM_ARGS: "-Xmx2g -Xms512m -XX:+UseG1GC"
    # ports: intentionally omitted — reached internally via fuseki:3030.
    volumes:
      - fuseki-data-production:/fuseki
      # Phase 21: named-graph dataset config (ja:unionDefaultGraph false)
      - ./infrastructure/fuseki/config.ttl:/fuseki/configuration/hub.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping | grep -q '\"status\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # API Service (Django) (Production)
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-api-production
    command: sh -c "python hub/manage.py validate_config && exec gunicorn hub.asgi:application --config gunicorn.conf.py"
    volumes:
      - ./static:/app/staticfiles
      - ./media:/app/media
    # ports: intentionally omitted — traffic enters via Traefik reverse proxy only.
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=hub.settings
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-5}
      - POSTGRES_HOST=pgbouncer
      - PGBOUNCER_ENABLED=true
      # Phase 26: Supported spec versions
      - ODCS_VERSIONS_SUPPORTED=2.2.2,3.0.0,3.0.1,3.0.2,3.1.0
      - ODPS_VERSIONS_SUPPORTED=1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0
      - HUBCONTRACT_BACKFILL_BATCH_SIZE=200
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hub-net-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ---------------------------------------------------------------------------
  # worker-heavy — processes job_critical queue only (Phase 16.5)
  #
  # Heavy workers handle long-running, memory-intensive jobs:
  #   - DQ scans (DQ_RUN): up to 1 800 s, may load large DataFrames
  #   - Compliance runs (COMPLIANCE_RUN): multi-step, CPU-bound
  #   - Scheduled ingestion / ODPS export: large data volumes
  #
  # Kept separate from light workers so a surge of DQ jobs cannot starve
  # webhook deliveries or cache invalidations, and so each pod has the
  # memory headroom needed for pandas operations on large datasets.
  # ---------------------------------------------------------------------------
  worker-heavy:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hub-worker-heavy-production
    # WORKER_TYPE drives queue selection in services/worker/main.py (16.4).
    # No explicit queue args — main.py reads WORKER_TYPE=heavy → job_critical.
    command: python services/worker/main.py
    # ports: intentionally omitted — worker health endpoint is internal only.
    volumes:
      - ./services/worker:/app:ro
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - WORKER_TYPE=heavy
      - WORKER_HEALTH_PORT=${WORKER_HEAVY_HEALTH_PORT:-8081}
      - WORKER_MAX_CONCURRENCY=${WORKER_HEAVY_MAX_CONCURRENCY:-4}
      - POSTGRES_HOST=pgbouncer
      - PGBOUNCER_ENABLED=true
      # Phase 26: backfill batch size for renormalize_contracts_v310 task
      - HUBCONTRACT_BACKFILL_BATCH_SIZE=200
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      api-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    networks:
      - hub-net-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 1G

  # ---------------------------------------------------------------------------
  # worker-light — processes job_default + job_low queues (Phase 16.5)
  #
  # Light workers handle short-lived, I/O-bound jobs:
  #   - Webhook delivery (job_default): HTTP POST, < 10 s
  #   - Cache invalidation (job_low): Redis writes, < 1 s
  #   - Search index updates (job_default): Elasticsearch bulk, < 30 s
  #   - Contract validation (job_low): schema check, < 5 s
  #
  # Renamed from worker-service.  Does NOT join job_critical so that
  # light-worker slots are never blocked by long DQ / compliance scans.
  # ---------------------------------------------------------------------------
  worker-light:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hub-worker-light-production
    command: python services/worker/main.py
    # ports: intentionally omitted — worker health endpoint is internal only.
    volumes:
      - ./services/worker:/app:ro
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - WORKER_TYPE=light
      - WORKER_HEALTH_PORT=${WORKER_LIGHT_HEALTH_PORT:-8080}
      - WORKER_MAX_CONCURRENCY=${WORKER_LIGHT_MAX_CONCURRENCY:-16}
      - POSTGRES_HOST=pgbouncer
      - PGBOUNCER_ENABLED=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      api-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    networks:
      - hub-net-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Compliance Service (Production)
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance-production
    # ports: intentionally omitted — reached internally via compliance-service:8082.
    networks:
      - hub-net-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LOG_LEVEL=INFO
      # shared/auth.py raises ValueError at startup if this is absent.
      # Injected from .env.production or the production secret store.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Phase 19.14.1 — async scan worker configuration
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - COMPLIANCE_SCANNER_WORKERS=8
    depends_on:
      redis-queue:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Compliance RQ Worker — Phase 19.14.1
  # Processes async scan jobs from the 'compliance-scan' Redis queue.
  compliance-rq-worker:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance-rq-worker-production
    command: ["rq", "worker", "compliance-scan", "--url", "redis://redis-queue:6379/0"]
    networks:
      - hub-net-production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - COMPLIANCE_WORKER_THREADS=8
    depends_on:
      redis-queue:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Traefik Reverse Proxy (Production)
  # Renders routes.yml.tmpl → routes.yml via envsubst before starting Traefik.
  # Required env vars: ALLOWED_ORIGINS_REGEX, TRAEFIK_DASHBOARD_USERS,
  #                    TRAEFIK_DASHBOARD_IP_ALLOWLIST, TRAEFIK_DASHBOARD_HOST
  traefik:
    image: traefik:v3.0
    container_name: hub-traefik-production
    # Render the dynamic config template before starting Traefik.
    # envsubst is part of gettext (not bundled in the Traefik Alpine image by default).
    # We install it via apk on first run; apk is available in Traefik's Alpine base.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if ! command -v envsubst >/dev/null 2>&1; then
          apk add --no-cache gettext >/dev/null 2>&1 || {
            echo "ERROR: envsubst not found and apk install failed — cannot render routes template." >&2
            exit 1
          }
        fi
        envsubst < /etc/traefik/dynamic/routes.yml.tmpl > /etc/traefik/dynamic/routes.yml
        exec traefik
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ALLOWED_ORIGINS_REGEX=${ALLOWED_ORIGINS_REGEX}
      - TRAEFIK_DASHBOARD_USERS=${TRAEFIK_DASHBOARD_USERS}
      - TRAEFIK_DASHBOARD_IP_ALLOWLIST=${TRAEFIK_DASHBOARD_IP_ALLOWLIST}
      - TRAEFIK_DASHBOARD_HOST=${TRAEFIK_DASHBOARD_HOST}
      # 20.7: ACME certificate email — set in .env.production, never committed.
      - TRAEFIK_ACME_EMAIL=${TRAEFIK_ACME_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic/routes.yml.tmpl:/etc/traefik/dynamic/routes.yml.tmpl:ro
      # routes.yml is written at runtime by envsubst; use a named volume so it persists
      - traefik-dynamic-production:/etc/traefik/dynamic
      - traefik-certs-production:/letsencrypt
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # HashiCorp Vault — REMOVED (Phase 211: Vault → AWS Secrets Manager)
  # Secrets are now stored in AWS Secrets Manager and synced to K8s via
  # External Secrets Operator. See openspec/changes/preprod01/specs/
  # vault-to-aws-secrets-manager/spec.md for migration details.
  # ---------------------------------------------------------------------------

  # NOTE: Other services (semantic, datacontract, dq, prefect, search, observability, webhook)
  # should follow the same pattern with production-appropriate configurations.
  # For brevity, this template shows the core services pattern.

  # ===========================================================================
  # Phase 4 — Observability Stack
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # Receives OTLP traces + metrics from all application services; applies
  # tail-based sampling (100 % errors, 10 % success); exports:
  #   - Traces  → Tempo (OTLP gRPC)
  #   - Metrics → Prometheus pull endpoint (:8889)
  # Uses the contrib image for tail_sampling + resourcedetection processors.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: hub-otel-collector-production
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
      # Docker socket mount removed: resourcedetection uses [env] detector only.
      # The docker detector requires root/docker-group but the container runs as
      # UID 10001 — mounting the socket would silently produce empty attributes.
    ports:
      # OTLP gRPC — applications send traces/metrics here
      - "${OTEL_GRPC_PORT:-4317}:4317"
      # OTLP HTTP
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      - GOGC=80    # tune GC aggressiveness for collector workloads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/health/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Grafana Tempo — distributed tracing backend
  # Storage: S3 bucket hub-traces
  # Retention: 14 days
  # Receives traces from OTel Collector; serves trace queries to Grafana.
  # metrics_generator writes service-graph + span-metrics to Prometheus.
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    container_name: hub-tempo-production
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
      # Required for ${VAR} env-var interpolation in tempo.yaml
      - "-config.expand-env=true"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data-production:/var/tempo
    environment:
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - TEMPO_S3_ENDPOINT=${TEMPO_S3_ENDPOINT:-s3.amazonaws.com}
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Grafana Loki — log aggregation backend
  # Storage: S3 bucket hub-logs
  # Retention: 30 days
  # Ingester replication factor: 2; query parallelism: 4
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: hub-loki-production
    command:
      - "-config.file=/etc/loki/loki.yaml"
      # Required for ${VAR} env-var interpolation in loki.yaml
      - "-config.expand-env=true"
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data-production:/loki
    environment:
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - LOKI_S3_ENDPOINT=${LOKI_S3_ENDPOINT:-s3.amazonaws.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Grafana Promtail — log collection agent
  # Tails Docker container logs via Docker socket, parses structlog JSON,
  # and ships to Loki with labels: job, service, level, tenant_id.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: hub-promtail-production
    # 20.4: Run as non-root UID/GID 10001 — no Docker socket, no root required.
    # Log collection uses static file-based targets (see monitoring/promtail/promtail.yaml).
    # The host must write container log files to /var/log/containers/ (or symlink them
    # there — e.g. via Docker daemon log-opts logPath, or a systemd dropin that symlinks
    # /var/lib/docker/containers/<id>/*-json.log → /var/log/containers/<name>.log).
    user: "10001:10001"
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./monitoring/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      # Container log files — read-only; NO docker.sock mount
      - /var/log/containers:/var/log/containers:ro
      # Named volume for position tracking (survives container restarts)
      - promtail_positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection and alerting
  # Scrapes: OTel Collector pull endpoint, all services, Redis, Postgres exporters.
  # Receives: remote_write from Tempo metrics_generator (service-graph metrics).
  # Retention: 15 days (--storage.tsdb.retention.time=15d via CLI flag).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hub-prometheus-production
    command:
      - "--config.file=/etc/prometheus/prometheus.production.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=50GB"
      # Enable remote_write receiver — Tempo metrics_generator pushes here
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
    volumes:
      - ./monitoring/prometheus/prometheus.production.yml:/etc/prometheus/prometheus.production.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data-production:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 1G

  # ---------------------------------------------------------------------------
  # AlertManager — alert routing and deduplication
  # Routes P1 alerts to on-call; P2 to ops team.
  # See monitoring/alertmanager/alertmanager.yml for receiver configuration.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hub-alertmanager-production
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.advertise-address=0.0.0.0:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data-production:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ---------------------------------------------------------------------------
  # Grafana — dashboards and observability UI
  # Datasources: Prometheus (metrics), Tempo (traces), Loki (logs)
  # Provisioned automatically from monitoring/grafana/{datasources,dashboards}.
  # Default credentials: set GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
  # in .env.production (sourced from AWS Secrets Manager).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hub-grafana-production
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Disable sign-up; only admin can create users
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
      # Render images in alerts (requires renderer plugin)
      - GF_RENDERING_SERVER_URL=${GF_RENDERING_SERVER_URL:-}
      # Unified alerting (Grafana 8+ native alerting)
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Anonymous access disabled
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Structured logging
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      # Plugin auto-install (none required; tempo + loki are built-in)
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data-production:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hub-net-production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  hub-net-production:
    driver: bridge

volumes:
  pgdata-production:
  redis-cache-data-production:
  redis-queue-data-production:
  redis-events-data-production:
  redis-channels-data-production:
  minio-data-production:
  fuseki-data-production:
  traefik-dynamic-production:
  traefik-certs-production:
  tempo-data-production:
  loki-data-production:
  prometheus-data-production:
  alertmanager-data-production:
  grafana-data-production:
  # 20.4: Promtail position tracking — survives container restarts without
  # needing /tmp (world-writable) or a host-path bind mount.
  promtail_positions:

