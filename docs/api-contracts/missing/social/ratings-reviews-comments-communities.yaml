        **Infrastructure Dependencies:**

        - postgresql: Primary database for all data persistence

        - redis: Job queue, caching, and event bus


        **Authentication**: Required (JWT, API Key)


        **Authorization**: Required role(s): Any authenticated; Required scope(s): social:community


        **Rate Limiting**: 10 requests per 60 seconds per user (burst: 5 per 10 seconds) (daily: 100 per day)


        **Input Validation**: All request fields validated (types, formats, lengths, patterns, enums). See request schema
        for details.


        **Database Requirements:**

        - Community model: write operations - Create or join community

        - User model: read operations - Get user information

        **Event Publishing:**

        - Publishes `social.community.created` event: Community creation event (Required)

        - Publishes `social.community.joined` event: Community join event (Required)

        **Infrastructure Dependencies:**

        - postgresql: Primary database for all data persistence

        - redis: Job queue, caching, and event bus'
