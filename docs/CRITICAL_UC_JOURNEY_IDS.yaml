# Critical Use Case and User Journey IDs for Traceability CI Gate
#
# This file defines which UC-* and JOURNEY-* IDs are considered critical for the
# traceability report CI gate. The script report_uc_journey_test_coverage.py uses
# this list in --ci-mode to fail when any critical ID has zero tests or when
# coverage falls below threshold.
#
# Domains: auth, contracts, assets, marketplace, DQ, compliance, governance, billing.
# Source: docs/USE_CASES.md, docs/USER_JOURNEYS.md.
# Update this file when adding or retiring critical capabilities.
#
# See: openspec/changes/testsfix1 (Traceability CI Gate), docs/TEST_EXECUTION_PLAN.md,
#      docs/RUNBOOKS.md (Use case and journey test coverage report).

version: "1.0"
description: "Critical UC and Journey IDs for CI traceability gate"

# Critical use case IDs (must have at least one test each in CI mode)
critical_use_cases:
