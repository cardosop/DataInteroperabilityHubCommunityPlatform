      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-test-net

  # ODH Training Operator Service for Testing
  odh-training-operator-test:
    build:
      context: .
      dockerfile: services/odh-training-operator/Dockerfile
    container_name: hub-test-odh-training-operator
    ports:
      - "${ODH_TRAINING_OPERATOR_TEST_PORT:-8096}:8080"
    networks:
      - hub-test-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ODH Inference Scheduler Service for Testing
  odh-inference-scheduler-test:
    build:
      context: .
      dockerfile: services/odh-inference-scheduler/Dockerfile
    container_name: hub-test-odh-inference-scheduler
    ports:
      - "${ODH_INFERENCE_SCHEDULER_TEST_PORT:-8097}:8080"
    networks:
      - hub-test-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Traefik API Gateway for Testing
  traefik-test:
    image: traefik:v3.0
    container_name: hub-test-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_TEST_PORT:-8080}:80"
      - "${TRAEFIK_SECURE_TEST_PORT:-8443}:443"
      - "${TRAEFIK_DASHBOARD_TEST_PORT:-8099}:8080"
    volumes:
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - hub-test-net
    depends_on:
      - jaeger-test
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/rawdata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
