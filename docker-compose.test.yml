# Docker Compose configuration for comprehensive test infrastructure
# This file provides a complete test environment with all services from main compose
# Usage: docker compose -f docker-compose.test.yml up -d
# Or with test env: docker compose -f docker-compose.test.yml --env-file .env.test up -d
#
# NOTE: Uses POSTGRES_TEST_* vars so .env (POSTGRES_USER=hub) does not override test credentials.
# Default: hub_test/hub_test/hub_test. Set POSTGRES_TEST_USER etc. in .env.test to override.
# If postgres was previously initialized with hub/hub from .env, reset: docker compose -f docker-compose.test.yml down -v
# Frontend is under --profile frontend (has build TS errors; use when fixed)
#
# Features:
# - Isolated test database (hub_test)
# - All microservices matching docker-compose.yml
# - Real services (no mocks/stubs)
# - Health checks for all services
# - Test-specific configuration
# Note: version is obsolete in Compose V2 and is ignored.

# Single source of truth for the paid/commercial layer of the TEST stack
# (compose x- extension — ignored by the engine, read by the overlay parity
# test and by docker-compose.test.core.yml's design contract). Every service
# listed here MUST carry `profiles: ["paid-excluded"]` in
# docker-compose.test.core.yml — the parity test fails loudly otherwise.
x-paid-services:
  - postgres-baas-test
  - redis-baas-test
  - clamav-test
  - fuseki-test
  - datacontract-service-test
  - dq-service-test
  - compliance-service-test
  - compliance-rq-worker-test
  - semantic-service-test
  - prefect-server-test
  - prefect-db-test
  - ensure-prefect-work-pool
  - prefect-worker-test
  - prefect-integration-service-test
  - ckan-test
  - ckan-test-db-test
  - ckan-test-solr-test
  - ckan-test-redis-test
  - odh-training-operator-test
  - odh-inference-scheduler-test
  - traefik-test

services:
  # PostgreSQL Database for Testing
  # Kept stable for full batch run. Exit 137 = OOM kill; reduce shared_buffers/work_mem or
  # raise deploy.resources.limits.memory if host has RAM. Resilient healthcheck for heavy batches.
  postgres-test:
    image: postgres:16-alpine
    container_name: hub-test-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-hub_test}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready returns 0 when Postgres accepts connections; -d verifies hub_test DB is ready.
      # start_period 900s: crash recovery + fsync can take 10-12min on slow disk; 600s was too short.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-hub_test} -d ${POSTGRES_TEST_DB:-hub_test} -t 5"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - hub-test-net
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c max_connections=500
      -c statement_timeout=300s
      -c idle_in_transaction_session_timeout=300s
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off

  # One-off: ensure hub_test database exists (handles volumes created without POSTGRES_DB=hub_test)
  ensure-test-db:
    image: postgres:16-alpine
    container_name: hub-test-ensure-db
    environment:
      PGHOST: postgres-test
      PGUSER: ${POSTGRES_TEST_USER:-hub_test}
      PGPASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      PGDATABASE: template1
    # hub_test_test_shared is created by migrate-test-db (from hub_test template), not here.
    # phase13: isolation DB for compliance/security, E2E, and dataset-creation-flow tests
    #          (TEST_DB_SUFFIX=phase13 and TEST_DB_SUFFIX=phase68 both resolve to this DB;
    #           do not run those test suites concurrently).
    command: ["sh", "-c", "psql -c \"CREATE DATABASE hub_test;\" 2>/dev/null || true && psql -c \"CREATE DATABASE hub_test_test_phase13;\" 2>/dev/null || true"]
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - hub-test-net
    restart: "no"

  # One-off: run Django migrations for hub_test and hub_test_test_shared.
  # Runs once before api/workflow-engine; they start runserver/main directly (no migrate).
  # Speeds up restarts: migrate is fast when already applied; api becomes healthy sooner.
  migrate-test-db:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-test-migrate
    command: ["sh", "-c", "exec ./scripts/migrate-test-dbs.sh"]
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-hub_test}
      REDIS_URL: redis://redis-cache-test:6379/0
      # Split Redis URLs — settings falls back to localhost for each missing
      # var, which is unreachable from this container at seed time.
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      REDIS_EVENTS_URL: redis://redis-events-test:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels-test:6379/0
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: hub.settings
      # Without this, settings falls back to .env.dev's ENVIRONMENT=staging
      # and the paid-config validation (STRIPE/BAAS/ODH guards) fails the
      # migrate+seed manage.py runs.
      ENVIRONMENT: test
    depends_on:
      redis-cache-test:
        condition: service_healthy
      ensure-test-db:
        condition: service_completed_successfully
      postgres-test:
        condition: service_healthy
    networks:
      - hub-test-net
    restart: "no"

  # Redis Cache Instance for Testing - Response caching, contract caching, lineage caching
  redis-cache-test:
    image: redis:7-alpine
    container_name: hub-test-redis-cache
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory ${REDIS_CACHE_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CACHE_TEST_PORT:-6479}:6379"
    volumes:
      - redis-cache-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CACHE_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Queue Instance for Testing - Job queues (RQ)
  redis-queue-test:
    image: redis:7-alpine
    container_name: hub-test-redis-queue
    # Phase T.4 (W16 infra prerequisite) — AOF removed: the appendonly
    # file corrupted once under I/O load on this host (the two Redis
    # services WITHOUT the flag were unaffected). RDB-only persistence
    # is the durable-enough posture for the test stack.
    command: >
      redis-server
      --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-512mb}
      --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_QUEUE_TEST_PORT:-6480}:6379"
    volumes:
      - redis-queue-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_QUEUE_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=noeviction
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Events Instance for Testing - Event bus (Pub/Sub, Streams)
  redis-events-test:
    image: redis:7-alpine
    container_name: hub-test-redis-events
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_EVENTS_TEST_PORT:-6481}:6379"
    volumes:
      - redis-events-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_EVENTS_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Channels Instance for Testing - WebSocket channels (Django Channels)
  redis-channels-test:
    image: redis:7-alpine
    container_name: hub-test-redis-channels
    command: >
      redis-server
      --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CHANNELS_TEST_PORT:-6482}:6379"
    volumes:
      - redis-channels-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CHANNELS_MAX_MEMORY:-256mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # BaaS dedicated Postgres for Testing (optional; set BAAS_DATABASE_URL to use)
  postgres-baas-test:
    image: postgres:16-alpine
    container_name: hub-test-postgres-baas
    environment:
      POSTGRES_USER: ${BAAS_POSTGRES_USER:-hub_baas}
      POSTGRES_PASSWORD: ${BAAS_POSTGRES_PASSWORD:-hub_baas}
      POSTGRES_DB: ${BAAS_POSTGRES_DB:-baas}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${BAAS_POSTGRES_TEST_PORT:-5435}:5432"
    volumes:
      - postgres-baas-test-data:/var/lib/postgresql/data
    command: postgres -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BAAS_POSTGRES_USER:-hub_baas} -d ${BAAS_POSTGRES_DB:-baas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hub-test-net

  # BaaS dedicated Redis for Testing (optional; set BAAS_REDIS_URL to use)
  redis-baas-test:
    image: redis:7-alpine
    container_name: hub-test-redis-baas
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${BAAS_REDIS_TEST_PORT:-6384}:6379"
    volumes:
      - redis-baas-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hub-test-net

  # Redis Exporters for Testing
  redis-exporter-cache-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-cache
    command:
      - '--redis.addr=redis://redis-cache-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CACHE_TEST_PORT:-9121}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-cache-test:
        condition: service_healthy

  redis-exporter-queue-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-queue
    command:
      - '--redis.addr=redis://redis-queue-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_QUEUE_TEST_PORT:-9122}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-queue-test:
        condition: service_healthy

  redis-exporter-events-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-events
    command:
      - '--redis.addr=redis://redis-events-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_EVENTS_TEST_PORT:-9123}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-events-test:
        condition: service_healthy

  redis-exporter-channels-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-channels
    command:
      - '--redis.addr=redis://redis-channels-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CHANNELS_TEST_PORT:-9124}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-channels-test:
        condition: service_healthy

  # MinIO (S3-compatible storage) for Testing
  minio-test:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      # Allow browser uploads from E2E frontend (localhost:5173, 5184, etc.)
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_TEST_API_PORT:-9010}:9000"
      - "${MINIO_TEST_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - hub-test-net

  # ClamAV (Phase 203) — optional; not started unless profile clamav-test is enabled.
  # Example: docker compose -f docker-compose.test.yml --profile clamav-test up -d clamav-test
  # Then set CLAMAV_ENABLED=true for api-service-test / worker-service-test (or in .env.test).
  clamav-test:
    profiles:
      - clamav-test
    image: clamav/clamav:1.5
    container_name: hub-test-clamav
    ports:
      - "127.0.0.1:${CLAMAV_TEST_PORT:-13310}:3310"
    volumes: []
    # Signature DB in RAM: loading ~950MB from the slow local HDD stalls
    # clamd for minutes on every start (the host disk is the known
    # bottleneck — see jbd2 stall notes). tmpfs makes DB loads and
    # self-checks RAM-fast; the cost is a freshclam re-download (~2-5 min)
    # after each container recreate.
    tmpfs:
      - /var/lib/clamav:size=2g
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo PING | nc -w2 127.0.0.1 3310 | grep -q PONG",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - hub-test-net

  # Apache Jena Fuseki (Triple Store) for Testing
  # Image has curl; $$ so compose passes literal $ to container for $/ping.
  # start_period 120s: fresh volume init can be slow; avoids "unhealthy" before dependent services start.
  fuseki-test:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-test-fuseki
    user: root
    # Phase P.1: the upstream entrypoint writes shiro.ini ONLY when the
    # persisted file does not exist — the first password on a named volume
    # wins forever. The prefix re-syncs it to the current ADMIN_PASSWORD on
    # every start (idempotent; no-op on fresh volumes). Without it, every
    # authenticated write 401s after a password rotation (measured: 40
    # semantic test failures). See scripts/fuseki_password_sync.sh.
    # Note: the trailing fuseki-server argument re-supplies the image CMD,
    # which an entrypoint override replaces (the upstream entrypoint forks
    # `exec "$@" &` — with an empty $@ the server never starts).
    entrypoint:
      ["sh", "-c", "/scripts/fuseki_password_sync.sh && exec /docker-entrypoint.sh /jena-fuseki/fuseki-server"]
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      # MUST be started with the same env-file as semantic-service-test
      # (canonical: `--env-file .env.test`, see Makefile.core CORE_COMPOSE).
      # Recreating one service without it auto-loads `.env` (random
      # FUSEKI_ADMIN_PASSWORD) → the sync script converges shiro.ini to the
      # wrong password → semantic writes 401 → mappings DEGRADED → 19 test
      # skips (batch 10-2i, 2026-10-02). .env.test pins the value explicitly.
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      # Phase 18.5: reduce heap — FTS migrated to PostgreSQL, Fuseki is ODPS-only
      # Batch 10-2i incident (2026-10-02): after ~3 days uptime the JVM
      # (Temurin 17.0.7) recovered from a SIGSEGV in JIT-compiled code and
      # every RDF parse then failed with "a fault occurred in a recent
      # unsafe memory access operation in compiled Java code" (semantic
      # mappings DEGRADED → 19 test skips). The container's 4G cgroup also
      # charges the 1G /fuseki tmpfs, so cap native memory explicitly so
      # exhaustion fails cleanly (OOM) instead of faulting in compiled code.
      JVM_ARGS: "-Xmx2g -Xms512m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m"
    ports:
      - "${FUSEKI_TEST_PORT:-3031}:3030"
    volumes:
      # Phase 21: named-graph dataset config (ja:unionDefaultGraph false)
      - ./infrastructure/fuseki/config.ttl:/fuseki/configuration/hub.ttl
      - ./scripts/fuseki_password_sync.sh:/scripts/fuseki_password_sync.sh:ro
    # Test Fuseki data is ephemeral — keep it on tmpfs so SPARQL UPDATE
    # fsyncs don't hit the host HDD (measured 7–30s per single-triple
    # insert on this host, breaking sync perf tests). The dataset is
    # re-created on demand by the semantic service's ensure_dataset_exists.
    tmpfs:
      - /fuseki:size=1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null --connect-timeout 5 'http://127.0.0.1:3030/$$/ping' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 120s
    networks:
      - hub-test-net
    # Fuseki was unbounded and grew to 3+ GiB, triggering OOM kills during E2E batch runs
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  # Jaeger (all-in-one) for Testing
  jaeger-test:
    image: jaegertracing/all-in-one:1.58.0
    container_name: hub-test-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "${JAEGER_UI_TEST_PORT:-16686}:16686"
      - "${JAEGER_HTTP_TEST_PORT:-14268}:14268"
      - "${JAEGER_UDP_TEST_PORT:-6831}:6831/udp"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Server for Testing marketplace connectors
  mock-server-test:
    image: mockserver/mockserver:5.15.0
    container_name: hub-test-mock-server
    command: -serverPort 8080 -logLevel INFO
    ports:
      - "${MOCK_SERVER_TEST_PORT:-8095}:8080"
    networks:
      - hub-test-net

  # MailHog for Testing (local email capture)
  mailhog-test:
    image: mailhog/mailhog:v1.0.1
    container_name: hub-test-mailhog
    ports:
      - "${MAILHOG_TEST_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_TEST_PORT:-1025}:1025"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DataContract Service for Testing
  datacontract-service-test:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-test-datacontract
    # Hardened runtime: read-only rootfs; only /tmp (tmpfs) and the
    # bind-mounted /app volume are writable.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${DATACONTRACT_TEST_PORT:-8093}:8080"
    volumes:
      # Live-mount all local source files so Phase 9+ changes are picked up
      # without image rebuilds.  shared/metrics.py is deliberately excluded —
      # mounting it would re-register Prometheus counters that are already baked
      # into the image, causing duplicate registration errors.
      - ./services/datacontract-service/main.py:/app/main.py:ro
      - ./services/datacontract-service/cache.py:/app/cache.py:ro
      - ./services/datacontract-service/normalize.py:/app/normalize.py:ro
      - ./services/datacontract-service/hub_contract.py:/app/hub_contract.py:ro
      - ./services/datacontract-service/normalize_endpoint.py:/app/normalize_endpoint.py:ro
      - ./services/shared/auth.py:/app/shared/auth.py:ro
      - ./services/shared/middleware.py:/app/shared/middleware.py:ro
      - ./services/shared/__init__.py:/app/shared/__init__.py:ro
      - ./services/datacontract-service/tests:/app/tests:ro
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      ODCS_VERSIONS_SUPPORTED: "2.2.2,3.0.0,3.0.1,3.0.2,3.1.0"
      ODPS_VERSIONS_SUPPORTED: "1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0"
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # DQ Service for Testing
