# Docker Compose configuration for comprehensive test infrastructure
# This file provides a complete test environment with all services from main compose
# Usage: docker compose -f docker-compose.test.yml up -d
# Or with test env: docker compose -f docker-compose.test.yml --env-file .env.test up -d
#
# NOTE: Uses POSTGRES_TEST_* vars so .env (POSTGRES_USER=hub) does not override test credentials.
# Default: hub_test/hub_test/hub_test. Set POSTGRES_TEST_USER etc. in .env.test to override.
# If postgres was previously initialized with hub/hub from .env, reset: docker compose -f docker-compose.test.yml down -v
# Frontend is under --profile frontend (has build TS errors; use when fixed)
#
# Features:
# - Isolated test database (hub_test)
# - All microservices matching docker-compose.yml
# - Real services (no mocks/stubs)
# - Health checks for all services
# - Test-specific configuration
# Note: version is obsolete in Compose V2 and is ignored.

services:
  # PostgreSQL Database for Testing
  # Kept stable for full batch run. Exit 137 = OOM kill; reduce shared_buffers/work_mem or
  # raise deploy.resources.limits.memory if host has RAM. Resilient healthcheck for heavy batches.
  postgres-test:
    image: postgres:16-alpine
    container_name: hub-test-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-hub_test}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready returns 0 when Postgres accepts connections; -d verifies hub_test DB is ready.
      # start_period 900s: crash recovery + fsync can take 10-12min on slow disk; 600s was too short.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-hub_test} -d ${POSTGRES_TEST_DB:-hub_test} -t 5"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - hub-test-net
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c max_connections=500
      -c statement_timeout=120s
      -c idle_in_transaction_session_timeout=300s

  # One-off: ensure hub_test database exists (handles volumes created without POSTGRES_DB=hub_test)
  ensure-test-db:
    image: postgres:16-alpine
    container_name: hub-test-ensure-db
    environment:
      PGHOST: postgres-test
      PGUSER: ${POSTGRES_TEST_USER:-hub_test}
      PGPASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      PGDATABASE: template1
    # hub_test_test_shared is created by migrate-test-db (from hub_test template), not here.
    # phase13: isolation DB for compliance/security, E2E, and dataset-creation-flow tests
    #          (TEST_DB_SUFFIX=phase13 and TEST_DB_SUFFIX=phase68 both resolve to this DB;
    #           do not run those test suites concurrently).
    command: ["sh", "-c", "psql -c \"CREATE DATABASE hub_test;\" 2>/dev/null || true && psql -c \"CREATE DATABASE hub_test_test_phase13;\" 2>/dev/null || true"]
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - hub-test-net
    restart: "no"

  # One-off: run Django migrations for hub_test and hub_test_test_shared.
  # Runs once before api/workflow-engine; they start runserver/main directly (no migrate).
  # Speeds up restarts: migrate is fast when already applied; api becomes healthy sooner.
  migrate-test-db:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-test-migrate
    command: ["sh", "-c", "exec ./scripts/migrate-test-dbs.sh"]
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-hub_test}
      REDIS_URL: redis://redis-cache-test:6379/0
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: hub.settings
    depends_on:
      redis-cache-test:
        condition: service_healthy
      ensure-test-db:
        condition: service_completed_successfully
      postgres-test:
        condition: service_healthy
    networks:
      - hub-test-net
    restart: "no"

  # Redis Cache Instance for Testing - Response caching, contract caching, lineage caching
  redis-cache-test:
    image: redis:7-alpine
    container_name: hub-test-redis-cache
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory ${REDIS_CACHE_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CACHE_TEST_PORT:-6379}:6379"
    volumes:
      - redis-cache-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CACHE_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Queue Instance for Testing - Job queues (RQ)
  redis-queue-test:
    image: redis:7-alpine
    container_name: hub-test-redis-queue
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-512mb}
      --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_QUEUE_TEST_PORT:-6380}:6379"
    volumes:
      - redis-queue-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_QUEUE_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=noeviction
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Events Instance for Testing - Event bus (Pub/Sub, Streams)
  redis-events-test:
    image: redis:7-alpine
    container_name: hub-test-redis-events
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_EVENTS_TEST_PORT:-6381}:6379"
    volumes:
      - redis-events-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_EVENTS_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # Redis Channels Instance for Testing - WebSocket channels (Django Channels)
  redis-channels-test:
    image: redis:7-alpine
    container_name: hub-test-redis-channels
    command: >
      redis-server
      --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CHANNELS_TEST_PORT:-6382}:6379"
    volumes:
      - redis-channels-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CHANNELS_MAX_MEMORY:-256mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # BaaS dedicated Postgres for Testing (optional; set BAAS_DATABASE_URL to use)
  postgres-baas-test:
    image: postgres:16-alpine
    container_name: hub-test-postgres-baas
    environment:
      POSTGRES_USER: ${BAAS_POSTGRES_USER:-hub_baas}
      POSTGRES_PASSWORD: ${BAAS_POSTGRES_PASSWORD:-hub_baas}
      POSTGRES_DB: ${BAAS_POSTGRES_DB:-baas}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${BAAS_POSTGRES_TEST_PORT:-5435}:5432"
    volumes:
      - postgres-baas-test-data:/var/lib/postgresql/data
    command: postgres -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BAAS_POSTGRES_USER:-hub_baas} -d ${BAAS_POSTGRES_DB:-baas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hub-test-net

  # BaaS dedicated Redis for Testing (optional; set BAAS_REDIS_URL to use)
  redis-baas-test:
    image: redis:7-alpine
    container_name: hub-test-redis-baas
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${BAAS_REDIS_TEST_PORT:-6384}:6379"
    volumes:
      - redis-baas-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hub-test-net

  # Redis Exporters for Testing
  redis-exporter-cache-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-cache
    command:
      - '--redis.addr=redis://redis-cache-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CACHE_TEST_PORT:-9121}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-cache-test:
        condition: service_healthy

  redis-exporter-queue-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-queue
    command:
      - '--redis.addr=redis://redis-queue-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_QUEUE_TEST_PORT:-9122}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-queue-test:
        condition: service_healthy

  redis-exporter-events-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-events
    command:
      - '--redis.addr=redis://redis-events-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_EVENTS_TEST_PORT:-9123}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-events-test:
        condition: service_healthy

  redis-exporter-channels-test:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-test-redis-exporter-channels
    command:
      - '--redis.addr=redis://redis-channels-test:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CHANNELS_TEST_PORT:-9124}:9121"
    networks:
      - hub-test-net
    depends_on:
      redis-channels-test:
        condition: service_healthy

  # MinIO (S3-compatible storage) for Testing
  minio-test:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      # Allow browser uploads from E2E frontend (localhost:5173, 5184, etc.)
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_TEST_API_PORT:-9010}:9000"
      - "${MINIO_TEST_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - hub-test-net

  # ClamAV (Phase 203) — optional; not started unless profile clamav-test is enabled.
  # Example: docker compose -f docker-compose.test.yml --profile clamav-test up -d clamav-test
  # Then set CLAMAV_ENABLED=true for api-service-test / worker-service-test (or in .env.test).
  clamav-test:
    profiles:
      - clamav-test
    image: clamav/clamav:1.3
    container_name: hub-test-clamav
    ports:
      - "127.0.0.1:${CLAMAV_TEST_PORT:-13310}:3310"
    volumes:
      - clamav-test-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',3310)); s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - hub-test-net

  # Apache Jena Fuseki (Triple Store) for Testing
  # Image has curl; $$ so compose passes literal $ to container for $/ping.
  # start_period 120s: fresh volume init can be slow; avoids "unhealthy" before dependent services start.
  fuseki-test:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-test-fuseki
    user: root
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      # Phase 18.5: reduce heap — FTS migrated to PostgreSQL, Fuseki is ODPS-only
      JVM_ARGS: "-Xmx2g -Xms512m -XX:+UseG1GC"
    ports:
      - "${FUSEKI_TEST_PORT:-3031}:3030"
    volumes:
      - fuseki-test-data:/fuseki
      # Phase 21: named-graph dataset config (ja:unionDefaultGraph false)
      - ./infrastructure/fuseki/config.ttl:/fuseki/configuration/hub.ttl
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null --connect-timeout 5 'http://127.0.0.1:3030/$$/ping' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 120s
    networks:
      - hub-test-net
    # Fuseki was unbounded and grew to 3+ GiB, triggering OOM kills during E2E batch runs
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  # Jaeger (all-in-one) for Testing
  jaeger-test:
    image: jaegertracing/all-in-one:1.58.0
    container_name: hub-test-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "${JAEGER_UI_TEST_PORT:-16686}:16686"
      - "${JAEGER_HTTP_TEST_PORT:-14268}:14268"
      - "${JAEGER_UDP_TEST_PORT:-6831}:6831/udp"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Server for Testing marketplace connectors
  mock-server-test:
    image: mockserver/mockserver:5.15.0
    container_name: hub-test-mock-server
    command: -serverPort 8080 -logLevel INFO
    ports:
      - "${MOCK_SERVER_TEST_PORT:-8095}:8080"
    networks:
      - hub-test-net

  # MailHog for Testing (local email capture)
  mailhog-test:
    image: mailhog/mailhog:v1.0.1
    container_name: hub-test-mailhog
    ports:
      - "${MAILHOG_TEST_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_TEST_PORT:-1025}:1025"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DataContract Service for Testing
  datacontract-service-test:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-test-datacontract
    ports:
      - "${DATACONTRACT_TEST_PORT:-8093}:8080"
    volumes:
      # Live-mount all local source files so Phase 9+ changes are picked up
      # without image rebuilds.  shared/metrics.py is deliberately excluded —
      # mounting it would re-register Prometheus counters that are already baked
      # into the image, causing duplicate registration errors.
      - ./services/datacontract-service/main.py:/app/main.py:ro
      - ./services/datacontract-service/cache.py:/app/cache.py:ro
      - ./services/datacontract-service/normalize.py:/app/normalize.py:ro
      - ./services/datacontract-service/hub_contract.py:/app/hub_contract.py:ro
      - ./services/datacontract-service/normalize_endpoint.py:/app/normalize_endpoint.py:ro
      - ./services/shared/auth.py:/app/shared/auth.py:ro
      - ./services/shared/middleware.py:/app/shared/middleware.py:ro
      - ./services/shared/__init__.py:/app/shared/__init__.py:ro
      - ./services/datacontract-service/tests:/app/tests:ro
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      ODCS_VERSIONS_SUPPORTED: "2.2.2,3.0.0,3.0.1,3.0.2,3.1.0"
      ODPS_VERSIONS_SUPPORTED: "1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0"
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # DQ Service for Testing
  # Heavy imports (pandas, numpy, great_expectations) can delay startup under resource contention
  dq-service-test:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-test-dq
    ports:
      - "${DQ_TEST_PORT:-8084}:8083"
    volumes:
      - ./services/dq-service/main.py:/app/main.py:ro
      - ./services/shared/auth.py:/app/shared/auth.py:ro
      - ./services/shared/middleware.py:/app/shared/middleware.py:ro
      - ./services/shared/__init__.py:/app/shared/__init__.py:ro
      - ./services/dq-service/tests:/app/tests:ro
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 16
      start_period: 150s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Compliance Service for Testing
  compliance-service-test:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-test-compliance
    ports:
      - "${COMPLIANCE_TEST_PORT:-8085}:8082"
    volumes:
      - ./services/compliance-service/main.py:/app/main.py:ro
      - ./services/shared/auth.py:/app/shared/auth.py:ro
      - ./services/shared/middleware.py:/app/shared/middleware.py:ro
      - ./services/shared/__init__.py:/app/shared/__init__.py:ro
      - ./services/compliance-service/tests:/app/tests:ro
      # Canonical ManualTest CSV (outside /app/tests — tests volume is :ro)
      - ./ManualTest/Front/05-SUPPORT-MATERIAL/data/sample-upload.csv:/app/manual-test-sample-upload.csv:ro
      # Mount monitoring configs so test_19_13_observability.py can read alerts.yml
      # and promtail.yaml; _resolve_project_root() resolves to "/" in-container and
      # checks for /monitoring/prometheus/alerts.yml
      - ./monitoring:/monitoring:ro
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      COMPLIANCE_WORKER_THREADS: "4"
      COMPLIANCE_SCANNER_WORKERS: "4"
    depends_on:
      redis-queue-test:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # RQ worker for compliance-scan queue (processes async scan jobs)
  compliance-rq-worker-test:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-test-compliance-rq-worker
    command: ["rq", "worker", "compliance-scan", "--url", "redis://redis-queue-test:6379/0"]
    networks:
      - hub-test-net
    environment:
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      COMPLIANCE_WORKER_THREADS: "4"
    depends_on:
      redis-queue-test:
        condition: service_healthy
      compliance-service-test:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # Semantic Service for Testing
  semantic-service-test:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-test-semantic
    ports:
      - "${SEMANTIC_TEST_PORT:-8086}:8081"
    volumes:
      # Live-mount all local source files so Phase 9+ changes are picked up
      # without image rebuilds.  shared/metrics.py is NOT mounted — it is baked
      # into the image so sparql_query_optimization_total is registered only once
      # (re-mounting causes duplicate Prometheus counter registration errors).
      - ./services/semantic-service/main.py:/app/main.py:ro
      - ./services/semantic-service/fuseki_client.py:/app/fuseki_client.py:ro
      - ./services/semantic-service/cache.py:/app/cache.py:ro
      - ./services/semantic-service/mapper.py:/app/mapper.py:ro
      - ./services/semantic-service/ontology.py:/app/ontology.py:ro
      - ./services/semantic-service/ontology.ttl:/app/ontology.ttl:ro
      - ./services/semantic-service/generate_ontology.py:/app/generate_ontology.py:ro
      - ./services/semantic-service/vocabulary_mappings.py:/app/vocabulary_mappings.py:ro
      - ./services/semantic-service/uri_generator.py:/app/uri_generator.py:ro
      - ./services/semantic-service/sparql_utils.py:/app/sparql_utils.py:ro
      - ./services/semantic-service/odps_query_builder.py:/app/odps_query_builder.py:ro
      - ./services/semantic-service/shapes:/app/shapes:ro
      - ./services/shared/auth.py:/app/shared/auth.py:ro
      - ./services/shared/middleware.py:/app/shared/middleware.py:ro
      - ./services/shared/__init__.py:/app/shared/__init__.py:ro
      - ./services/semantic-service/tests:/app/tests:ro
      - ./services/semantic-service/pytest.ini:/app/pytest.ini:ro
    environment:
      FUSEKI_URL: http://fuseki-test:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      HUB_DOMAIN: ${HUB_DOMAIN:-test.hub.example.com}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      fuseki-test:
        condition: service_healthy
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # API Service for Testing
  api-service-test:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-test-api
    init: true  # Reap zombies and forward signals; avoids "PID is zombie and can not be killed" on restart
    restart: on-failure
    # gunicorn + UvicornWorker: GUNICORN_WORKERS=5 workers handle concurrent E2E batch load (each batch
    # now runs with --workers=2, giving max 6 concurrent requests at once). Reduced from 9 to 5 to cut
    # idle RSS by ~1.2GiB and prevent OOM kills between tests 150-200 during batch5 runs.
    # 5 workers = 2 CPUs × 2 + 1; sufficient for batches that each use --workers=2.
    command: ["gunicorn", "hub.asgi:application", "--config", "gunicorn.conf.py"]
    volumes:
      - .:/app
    ports:
      - "${API_TEST_PORT:-8001}:8000"
    environment:
      # Force Python to always read .py source instead of stale .pyc bytecode.
      # Without this, root-owned .pyc files in __pycache__ persist across runs
      # and prevent source changes on the host from taking effect in the container.
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      # Use hub_test_test_shared so gunicorn sees same data as pytest (TEST_DB_SUFFIX=shared)
      # and Prefect worker API calls (get_export_config, patch_export_run) update the same run the test polls
      POSTGRES_DB: hub_test_test_shared
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8001}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailhog-test}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@test.hub.example.com}
      REDIS_URL: redis://redis-cache-test:6379/0
      REDIS_HOST: redis-cache-test
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      REDIS_EVENTS_URL: redis://redis-events-test:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels-test:6379/0
      BAAS_DATABASE_URL: ${BAAS_DATABASE_URL:-}
      BAAS_REDIS_URL: ${BAAS_REDIS_URL:-}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      AWS_S3_ENDPOINT_URL: http://minio-test:9000
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-hub-files}
      DATACONTRACT_SERVICE_URL: http://datacontract-service-test:8080
      DQ_SERVICE_URL: http://dq-service-test:8083
      COMPLIANCE_SERVICE_URL: http://compliance-service-test:8082
      # Phase 26: Supported spec versions
      ODCS_VERSIONS_SUPPORTED: "2.2.2,3.0.0,3.0.1,3.0.2,3.1.0"
      ODPS_VERSIONS_SUPPORTED: "1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0"
      HUBCONTRACT_BACKFILL_BATCH_SIZE: "200"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      SEMANTIC_SERVICE_URL: http://semantic-service-test:8081
      SEMANTIC_SERVICE_TIMEOUT: "60"
      FUSEKI_URL: http://fuseki-test:3030
      PREFECT_INTEGRATION_SERVICE_URL: http://prefect-integration-service-test:8084
      PREFECT_API_URL: http://prefect-server-test:4200/api
      MOCK_SERVER_URL: http://mock-server-test:8080
      # Worker service URL for E2E tests (test_worker_service.py) - reachable from api-service-test container
      WORKER_SERVICE_URL: http://worker-service-test:8080
      ODH_INFERENCE_SCHEDULER_URL: http://odh-inference-scheduler-test:8080
      ODH_TRAINING_OPERATOR_URL: http://odh-training-operator-test:8080
      JAEGER_AGENT_HOST: jaeger-test
      JAEGER_AGENT_PORT: 6831
      # Monitoring URLs for integration tests (batch 7, 8) - reachable from api-service-test
      PROMETHEUS_URL: http://prometheus-test:9090
      GRAFANA_URL: http://grafana-test:3000
      JAEGER_URL: http://jaeger-test:16686
      API_BASE_URL: http://localhost:8000
      REDIS_EXPORTER_CACHE_URL: http://redis-exporter-cache-test:9121
      REDIS_EXPORTER_QUEUE_URL: http://redis-exporter-queue-test:9121
      REDIS_EXPORTER_EVENTS_URL: http://redis-exporter-events-test:9121
      REDIS_EXPORTER_CHANNELS_URL: http://redis-exporter-channels-test:9121
      ALERTMANAGER_URL: http://alertmanager-test:9093
      MINIO_HOST: minio-test
      MINIO_PORT: "9000"
      # Phase 203: default off in test stack (no clamav-test unless --profile clamav-test).
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav-test}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      ENVIRONMENT: test
      APP_VERSION: ${APP_VERSION:-1.0.0-test}
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      USE_PRODUCTION_DB_FOR_SDK_TESTS: "0"
      # Shared DB for E2E tests that need prefect-integration to see test data
      TEST_DB_SUFFIX: "shared"
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: hub.settings
      ALLOWED_HOSTS: localhost,127.0.0.1,api-service,api-service-test,testserver
      # E2E: relax auth rate limit for parallel Playwright workers (no mocks)
      RATE_LIMIT_E2E_RELAX: ${RATE_LIMIT_E2E_RELAX:-true}
      # Reduced from 9→5: each batch now uses --workers=2 (max 6 concurrent requests); 5 workers
      # avoids ~1.2GiB excess RSS that caused OOM kills during batch5 runs on a 61GiB host.
      # Override via env if running multiple batches in parallel: GUNICORN_WORKERS=9 docker compose up
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-5}
      # Real scheduled ingestion/export E2E: uses MinIO (S3-compatible) already in this stack
      REAL_SCHEDULED_E2E: ${REAL_SCHEDULED_E2E:-1}
      # Optional: set STRIPE_SECRET_KEY (e.g. sk_test_...) to run billing Stripe-dependent tests (no mocks)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_51T412N79Dw5TG33rjI38jWadxupQAkI38O1kW1O6s3H1NFxdFFHwSCc30kZVRoOdEPV2Gvm6o852cJZ15Kkoydkh004dBPAwWK}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51T412N79Dw5TG33rxbm9F3zSZ1rPxI5En7Tb2n8OL65Cd9wwCdpuiPsIcmi5qQATGzx7pMrGNKKj1pQiwB7w45Hw004ICHrRJe}
      # Optional: set STRIPE_WEBHOOK_SECRET (e.g. whsec_...) so webhook signature test runs (test_stripe_webhook_invalid_signature)
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test}
      STRIPE_MARKETPLACE_WEBHOOK_SECRET: ${STRIPE_MARKETPLACE_WEBHOOK_SECRET:-whsec_test_marketplace}
      # --- Marketplace connector credentials (from .env.test) ---
      # CKAN: local instance in this compose stack
      CKAN_TEST_URL: http://ckan-test:5000
      CKAN_TEST_API_KEY: ${CKAN_TEST_API_KEY:-}
      # DadosGovBr (Swagger API)
      DADOS_GOV_BR_API_KEY: ${DADOS_GOV_BR_API_KEY:-}
      CKAN_DADOS_GOV_BR_API_KEY: ${CKAN_DADOS_GOV_BR_API_KEY:-}
      # AWS Data Exchange (separate from MinIO S3 creds above)
      AWS_DATA_EXCHANGE_ACCESS_KEY_ID: ${AWS_DATA_EXCHANGE_ACCESS_KEY_ID:-}
      AWS_DATA_EXCHANGE_SECRET_ACCESS_KEY: ${AWS_DATA_EXCHANGE_SECRET_ACCESS_KEY:-}
      AWS_DATA_EXCHANGE_TEST_DATASET_ID: ${AWS_DATA_EXCHANGE_TEST_DATASET_ID:-}
      # Snowflake
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_TOKEN: ${SNOWFLAKE_TOKEN:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      # GCP Analytics Hub
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_CREDENTIALS_JSON: ${GCP_CREDENTIALS_JSON:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-}
      GCP_LOCATION: ${GCP_LOCATION:-US}
      # Azure / Databricks
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      # Suppress test env validation warning; dev default is fine for test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-test-jwt-secret-key-for-pytest-32b}
      # Use HS256 in the test container (no RSA key pair available); RS256 is for production.
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # Worker API key for scheduled export/ingestion internal endpoints (E2E test default)
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-e2e-test-worker-key-scheduled-export}
    depends_on:
      migrate-test-db:
        condition: service_completed_successfully
      ensure-test-db:
        condition: service_completed_successfully
      postgres-test:
        condition: service_healthy
      redis-cache-test:
        condition: service_healthy
      redis-queue-test:
        condition: service_healthy
      redis-events-test:
        condition: service_healthy
      redis-channels-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      datacontract-service-test:
        condition: service_healthy
      dq-service-test:
        condition: service_healthy
      compliance-service-test:
        condition: service_healthy
      semantic-service-test:
        condition: service_healthy
      jaeger-test:
        condition: service_healthy
      mock-server-test:
        condition: service_started
      mailhog-test:
        condition: service_started
      ckan-test:
        condition: service_healthy
      # worker-service-test: not in depends_on to avoid cycle (worker depends on api); API enqueues to Redis, worker polls when ready
      odh-inference-scheduler-test:
        condition: service_healthy
      odh-training-operator-test:
        condition: service_healthy
      prefect-integration-service-test:
        condition: service_healthy
    networks:
      hub-test-net:
        aliases:
          - api-service
    # Liveness: /health/live/ always 200 if process is up; /health/ checks DB+Redis and can 503 under load.
    # gunicorn spawns GUNICORN_WORKERS=5 worker processes; each worker starts Django app + loads settings,
    # so startup is slower than runserver but the liveness endpoint is served by whichever worker is free.
    # start_period 180s: gunicorn with 5 UvicornWorkers under full-stack load needs ~60–90s for all workers
    # to finish Django app loading. retries 20 × interval 15s = 5min grace after start_period.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/', timeout=10).read()\" || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 180s
    # 8G limit: parallel E2E batch runs (batches 1+3+4 simultaneously) exhaust 4G under load.
    # Host has 61GiB RAM; 8G is safe. Increased CPUs from 2→4 to handle concurrent requests.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Phase 216.0.8 — MVP-mode API backend.
  # Identical to api-service-test but with MVP_MODE=true so post-MVP
  # API namespaces return 404. Used by `pytest -m mvp` and the CI
  # mvp-test-suite job.
  # Default port 8003 avoids collision with api-service-test (8001).
  api-service-test-mvp:
    extends:
      service: api-service-test
    container_name: hub-test-api-mvp
    ports:
      - "${API_TEST_MVP_PORT:-8003}:8000"
    environment:
      MVP_MODE: "true"

  # Phase 216.0.8 — Full-mode API backend.
  # Identical to api-service-test with MVP_MODE explicitly false.
  # Used by post-MVP integration tests that exercise gated endpoints.
  # Default port 8004 avoids collision with api-service-test (8001).
  api-service-test-full:
    extends:
      service: api-service-test
    container_name: hub-test-api-full
    ports:
      - "${API_TEST_FULL_PORT:-8004}:8000"
    environment:
      MVP_MODE: "false"

  # Worker Service for Testing
  worker-service-test:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hub-test-worker
    # Include 'default' to drain legacy jobs enqueued before compliance fix (job_critical routing)
    command: python services/worker/main.py job_critical job_default job_low default
    ports:
      - "${WORKER_TEST_HEALTH_PORT:-8087}:8080"
    volumes:
      - .:/app
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8001}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailhog-test}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@test.hub.example.com}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_RESERVED_SLOTS_RATIO: ${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      WORKER_STARVATION_THRESHOLD_SECONDS: ${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      # Use hub_test_test_shared so worker sees same data as api-service-test (password reset, etc.)
      POSTGRES_DB: hub_test_test_shared
      TEST_DB_SUFFIX: "shared"
      REDIS_URL: redis://redis-cache-test:6379/0
      REDIS_HOST: redis-cache-test
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      REDIS_EVENTS_URL: redis://redis-events-test:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels-test:6379/0
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      AWS_S3_ENDPOINT_URL: http://minio-test:9000
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-hub-files}
      COMPLIANCE_SERVICE_URL: http://compliance-service-test:8082
      DQ_SERVICE_URL: http://dq-service-test:8083
      MOCK_SERVER_URL: http://mock-server-test:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      JAEGER_AGENT_HOST: jaeger-test
      JAEGER_AGENT_PORT: 6831
      ENVIRONMENT: test
      APP_VERSION: ${APP_VERSION:-1.0.0-test}
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      DJANGO_SETTINGS_MODULE: hub.settings
      # JWT settings must match api-service-test so tests that generate
      # tokens (isolation, concurrency) use the same algorithm/key.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-test-jwt-secret-key-for-pytest-32b}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PYTHONPATH: /app:/app/compliance_engine
      ALLOWED_HOSTS: localhost,127.0.0.1,api-service,api-service-test,testserver
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav-test}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-cache-test:
        condition: service_healthy
      redis-queue-test:
        condition: service_healthy
      redis-events-test:
        condition: service_healthy
      redis-channels-test:
        condition: service_healthy
      api-service-test:
        condition: service_started
      jaeger-test:
        condition: service_healthy
      mock-server-test:
        condition: service_started
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Prefect Server for Testing (pin to explicit 3.x so client/server major versions match)
  # Waits for prefect-db, runs migrations explicitly (avoids TimeoutError in server lifespan), then starts server.
  prefect-server-test:
    image: prefecthq/prefect:3-python3.12
    container_name: hub-test-prefect-server
    restart: on-failure
    command: ["sh", "-c", "pip install --quiet asyncpg && python /wait_for_prefect_db.py && sleep 15 && prefect server database upgrade -y && exec prefect server start --host 0.0.0.0"]
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-db-test:5432/prefect
      PREFECT_SERVER_DATABASE_MIGRATE_ON_START: "false"
      PREFECT_SERVER_DATABASE_SQLALCHEMY_POOL_TIMEOUT: "120"
      PREFECT_LOGGING_LEVEL: DEBUG
      ENVIRONMENT: test
    ports:
      - "${PREFECT_SERVER_TEST_PORT:-4202}:4200"
      - "${PREFECT_UI_TEST_PORT:-4203}:4201"
    volumes:
      - prefect-server-test-data:/root/.prefect
      - ./scripts/wait_for_prefect_db.py:/wait_for_prefect_db.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 240s
    depends_on:
      prefect-db-test:
        condition: service_healthy
    networks:
      - hub-test-net

  # Prefect Database (PostgreSQL) for Testing
  # Bounded memory and low shared_buffers so it does not compete with postgres-test or OOM.
  # Use postgres:16 (non-alpine) to avoid pg_ctl shutdown timeout during init (alpine can hang).
  prefect-db-test:
    image: postgres:16
    container_name: hub-test-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
      ENVIRONMENT: test
    # Port not published: services use prefect-db-test:5432 on the Docker network. Omit ports to avoid host port conflicts (5435/5436/5437).
    volumes:
      - prefect-db-test-data:/var/lib/postgresql/data
      - ./infrastructure/prefect-db/01-pgcrypto.sql:/docker-entrypoint-initdb.d/01-pgcrypto.sql:ro
      - ./infrastructure/prefect-db/02-pg-hba-host.sh:/docker-entrypoint-initdb.d/02-pg-hba-host.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -t 5"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - hub-test-net
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=50
      -c checkpoint_timeout=60

  # One-off: create default docker work pool so deployments succeed before worker is fully up
  # Worker creates pool on start, but there can be a race; this ensures pool exists.
  ensure-prefect-work-pool:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile.worker-docker
    image: hub-test-prefect-worker-docker:latest
    container_name: hub-test-ensure-prefect-work-pool
    command: ["sh", "-c", "prefect work-pool create default --type docker 2>/dev/null || true"]
    environment:
      PREFECT_API_URL: http://prefect-server-test:4200/api
    depends_on:
      prefect-server-test:
        condition: service_healthy
    networks:
      - hub-test-net
    restart: "no"

  # Prefect Worker for Testing (Docker work pool - required for deployments with custom images)
  # Process work pool does not support image=; use Docker worker so flow.deploy(image=...) works
  prefect-worker-test:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile.worker-docker
    image: hub-test-prefect-worker-docker:latest
    container_name: hub-test-prefect-worker
    command: prefect worker start --pool default --type docker
    environment:
      PREFECT_API_URL: http://prefect-server-test:4200/api
      PREFECT_LOGGING_LEVEL: DEBUG
      # Hub API configuration for scheduled ingestion/export worker API (E2E profile)
      HUB_BASE_URL: ${HUB_BASE_URL:-http://api-service-test:8000}
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-e2e-test-worker-key-scheduled-export}
      ENVIRONMENT: test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server-test:
        condition: service_healthy
      # Note: api-service-test removed to avoid circular dep; worker creates work pool for deployment sync
    networks:
      - hub-test-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; procs = [d for d in os.listdir('/proc') if d.isdigit()]; found = any(os.path.exists(f'/proc/{p}/cmdline') and b'prefect' in open(f'/proc/{p}/cmdline', 'rb').read() for p in procs); exit(0 if found else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend Service for Testing
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Meshant}
        VITE_FEATURE_TOAST_ENABLED: ${VITE_FEATURE_TOAST_ENABLED:-}
        VITE_FEATURE_BREADCRUMBS_ENABLED: ${VITE_FEATURE_BREADCRUMBS_ENABLED:-}
        VITE_FEATURE_RESOURCE_PICKERS_ENABLED: ${VITE_FEATURE_RESOURCE_PICKERS_ENABLED:-}
        # Empty by default: app uses relative /api/v1 paths proxied by nginx.
        # Set to an absolute URL only for non-nginx deployments (e.g. CDN-hosted SPA).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_USE_PUBLIC_DNS: ${NPM_USE_PUBLIC_DNS:-0}
    container_name: hub-test-frontend
    ports:
      - "${FRONTEND_TEST_PORT:-3010}:80"
    volumes:
      - ./frontend/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_ENV=${ENV:-development}
    networks:
      - hub-test-net
    depends_on:
      api-service-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  # Prefect Integration Service for Testing
  prefect-integration-service-test:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile
    image: hub-test-prefect-integration:latest
    container_name: hub-test-prefect-integration
    user: root
    command: sh -c "pip install --quiet sentry-sdk duckdb polars pyarrow pytest pytest-django pytest-asyncio pytest-mock && cd /app/services/prefect-integration && PYTHONPATH=/app python -m uvicorn main:app --host 0.0.0.0 --port 8084"
    ports:
      - "${PREFECT_INTEGRATION_TEST_PORT:-8114}:8084"
    volumes:
      - .:/app
    environment:
      # PYTHONPATH must be set at container level (not just in the command)
      # so that `docker compose exec ... pytest` can import hub.settings
      # before pytest-django's early plugin initialization.
      PYTHONPATH: /app
      # Reduce Redis connect timeout from default 5s to 0.5s so that
      # django.setup() AppConfig.ready() event subscriptions fail fast
      # when Redis is unreachable, instead of hanging 5s per subscription.
      EVENT_BUS_REDIS_SOCKET_CONNECT_TIMEOUT: "0.5"
      EVENT_BUS_REDIS_SOCKET_TIMEOUT: "1"
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_TEST_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-hub_test}
      # Use shared test DB so prefect-integration sees data created by api-service-test pytest
      POSTGRES_DB: hub_test_test_shared
      PREFECT_API_URL: http://prefect-server-test:4200/api
      PREFECT_DEPLOYMENT_IMAGE: ${PREFECT_DEPLOYMENT_IMAGE:-hub-test-prefect-integration:latest}
      # Docker network for flow containers (project_hub-test-net; set if compose project name differs)
      DOCKER_NETWORK_NAME: ${DOCKER_NETWORK_NAME:-datainteroperabilityhub_hub-test-net}
      DJANGO_SETTINGS_MODULE: hub.settings
      REDIS_CACHE_URL: redis://redis-cache-test:6379/0
      REDIS_QUEUE_URL: redis://redis-queue-test:6379/0
      REDIS_EVENTS_URL: redis://redis-events-test:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels-test:6379/0
      REDIS_URL: redis://redis-cache-test:6379/0
      HUB_BASE_URL: http://api-service-test:8000
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-e2e-test-worker-key-scheduled-export}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test-internal-api-key-for-test-env}
      ENVIRONMENT: test
      DEBUG: "True"
    depends_on:
      prefect-server-test:
        condition: service_healthy
      ensure-prefect-work-pool:
        condition: service_completed_successfully
      prefect-worker-test:
        condition: service_started
      postgres-test:
        condition: service_healthy
      redis-cache-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      # NOTE: api-service-test is NOT listed here because it depends
      # on prefect-integration-service-test (circular).  The 3
      # scheduled-export hub-API integration tests skip gracefully
      # when api-service-test is not running.  They pass when the
      # full test stack is up (api-service-test starts after us).
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  # Prometheus for Testing
  prometheus-test:
    image: prom/prometheus:v2.53.0
    container_name: hub-test-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_TEST_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-test-data:/prometheus
    networks:
      - hub-test-net
    depends_on:
      - api-service-test
      - worker-service-test
      - semantic-service-test
      - dq-service-test
      - compliance-service-test
      - datacontract-service-test
      - prefect-integration-service-test
      - redis-exporter-cache-test
      - redis-exporter-queue-test
      - redis-exporter-events-test
      - redis-exporter-channels-test
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for Testing
  # Official image has no curl/wget; use nc to check port 3000 and start_period for slow boot.
  grafana-test:
    image: grafana/grafana:11.1.0
    container_name: hub-test-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_TEST_PORT:-3011}:3000"
    volumes:
      - grafana-test-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hub-test-net
    depends_on:
      - prometheus-test
    healthcheck:
      # Official image may lack curl/wget; try nc then wget; after start_period avoid unhealthy.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 2>/dev/null || wget -q -O /dev/null http://127.0.0.1:3000/api/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Alertmanager for Testing
  alertmanager-test:
    image: prom/alertmanager:v0.27.0
    container_name: hub-test-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_TEST_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-test-data:/alertmanager
    networks:
      - hub-test-net
    depends_on:
      - prometheus-test
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CKAN Web Application for Testing
  # Provides a local CKAN API at http://ckan-test:5000 for integration tests
  # Uses the CKAN backing services below (DB, Solr, Redis)
  ckan-test:
    image: ckan/ckan-dev:2.10
    container_name: hub-test-ckan-app
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Write DB/Solr/Redis URLs into ckan.ini (prerun.py does this but fails on db upgrade)
        INI=/srv/app/ckan.ini
        sed -i 's|^sqlalchemy.url = .*|sqlalchemy.url = postgresql://ckan:ckan@ckan-test-db-test:5432/ckan_test|' $$INI
        sed -i 's|^solr_url = .*|solr_url = http://ckan-test-solr-test:8983/solr/ckan|' $$INI
        sed -i 's|^ckan.redis.url = .*|ckan.redis.url = redis://ckan-test-redis-test:6379/0|' $$INI
        sed -i 's|^ckan.site_url = .*|ckan.site_url = http://ckan-test:5000|' $$INI
        sed -i 's|^beaker.session.secret =.*|beaker.session.secret = ckan-test-secret|' $$INI
        # Disable datastore plugin (needs separate DB; not needed for CKAN API tests)
        sed -i 's|ckan.plugins = .*|ckan.plugins = image_view text_view envvars|' $$INI
        # Also set sqlalchemy.url in [app:main] if the key uses whitespace
        python3 -c "
        import re
        with open('$$INI') as f: c = f.read()
        c = re.sub(r'sqlalchemy\.url\s*=\s*[^\n]+', 'sqlalchemy.url = postgresql://ckan:ckan@ckan-test-db-test:5432/ckan_test', c)
        with open('$$INI', 'w') as f: f.write(c)
        "
        # Verify the config was written
        echo "[ckan-test] Config:" && grep -E "(sqlalchemy.url|solr_url|ckan.redis.url|ckan.plugins)" $$INI
        # Wait for DB
        for i in $$(seq 1 30); do
          pg_isready -h ckan-test-db-test -U ckan -d ckan_test -q && break
          echo "[ckan-test] Waiting for DB... $$i/30"
          sleep 2
        done
        # Init DB
        ckan -c $$INI db init 2>&1 || ckan -c $$INI db upgrade 2>&1
        # Create sysadmin (ignore if exists)
        ckan -c $$INI user add admin email=admin@test.local password=admin1234 2>&1 || true
        ckan -c $$INI sysadmin add admin 2>&1 || true
        # Seed test data (org + dataset with resource) — idempotent
        ckan -c $$INI run --host 0.0.0.0 --port 5000 &
        CKAN_PID=$$!
        # Wait for CKAN to accept requests
        for i in $$(seq 1 30); do
          curl -sf http://localhost:5000/api/3/action/status_show >/dev/null 2>&1 && break
          sleep 2
        done
        # Create org + dataset if missing
        python3 -c "
        import httpx, os, sys
        token = os.getenv('CKAN_SEED_TOKEN', '')
        if not token:
            # Generate a token via CLI
            import subprocess
            r = subprocess.run(['ckan', '-c', '$$INI', 'user', 'token', 'add', 'admin', 'seed_token'],
                               capture_output=True, text=True)
            for line in r.stdout.splitlines():
                line = line.strip()
                if line.startswith('eyJ'):
                    token = line
                    break
        if not token:
            print('[ckan-seed] No token, skipping seed'); sys.exit(0)
        h = {'Authorization': token, 'Content-Type': 'application/json'}
        base = 'http://localhost:5000'
        # Check if dataset exists
        r = httpx.get(f'{base}/api/3/action/package_show?id=meshant-test-dataset', headers=h, timeout=10)
        if r.status_code == 200 and r.json().get('success'):
            print('[ckan-seed] Test dataset already exists'); sys.exit(0)
        # Create org
        httpx.post(f'{base}/api/3/action/organization_create', headers=h, timeout=10,
                   json={'name': 'meshant-test-org', 'title': 'Meshant Test Org'})
        # Create dataset
        r = httpx.post(f'{base}/api/3/action/package_create', headers=h, timeout=10,
                   json={'name': 'meshant-test-dataset', 'title': 'Meshant Test Dataset',
                         'notes': 'Sample dataset for integration testing', 'owner_org': 'meshant-test-org',
                         'resources': [{'name': 'sample.csv', 'url': 'http://example.com/sample.csv',
                                        'format': 'CSV', 'description': 'Sample CSV resource'}]})
        print(f'[ckan-seed] Created test dataset: {r.json().get(\"success\")}')
        " 2>&1
        # Wait for foreground CKAN process
        wait $$CKAN_PID
    environment:
      CKAN_SQLALCHEMY_URL: postgresql://ckan:ckan@ckan-test-db-test:5432/ckan_test
      CKAN_SOLR_URL: http://ckan-test-solr-test:8983/solr/ckan
      CKAN__REDIS__URL: redis://ckan-test-redis-test:6379/0
      CKAN_SITE_URL: http://ckan-test:5000
      CKAN_SITE_ID: default
      CKAN___BEAKER__SESSION__SECRET: ckan-test-secret
    ports:
      - "${CKAN_TEST_PORT:-5100}:5000"
    depends_on:
      ckan-test-db-test:
        condition: service_healthy
      ckan-test-solr-test:
        condition: service_healthy
      ckan-test-redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/3/action/status_show || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - hub-test-net

  # CKAN Test Database for Testing
  # start_period + retries: recovery after unclean shutdown can fsync for many minutes on slow disks;
  # without this, Compose marks the service unhealthy before pg_isready succeeds (blocks ckan-test).
  ckan-test-db-test:
    image: postgres:16-alpine
    container_name: hub-test-ckan-test-db
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ckan
      POSTGRES_DB: ckan_test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${CKAN_TEST_DB_TEST_PORT:-5436}:5432"
    volumes:
      - ckan-test-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan -d ckan_test -t 5"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 600s
    networks:
      - hub-test-net

  # CKAN Test Solr for Testing (uses CKAN's custom Solr image with correct schema)
  ckan-test-solr-test:
    image: ckan/ckan-solr:2.10-solr9
    container_name: hub-test-ckan-test-solr
    ports:
      - "${CKAN_TEST_SOLR_TEST_PORT:-8983}:8983"
    volumes:
      - ckan-test-solr-test-data:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/ckan/admin/ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - hub-test-net

  # CKAN Test Redis for Testing
  ckan-test-redis-test:
    image: redis:7-alpine
    container_name: hub-test-ckan-test-redis
    command: redis-server --appendonly yes
    ports:
      - "${CKAN_TEST_REDIS_TEST_PORT:-6383}:6379"
    volumes:
      - ckan-test-redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-test-net

  # ODH Training Operator Service for Testing
  odh-training-operator-test:
    build:
      context: .
      dockerfile: services/odh-training-operator/Dockerfile
    container_name: hub-test-odh-training-operator
    ports:
      - "${ODH_TRAINING_OPERATOR_TEST_PORT:-8096}:8080"
    networks:
      - hub-test-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ODH Inference Scheduler Service for Testing
  odh-inference-scheduler-test:
    build:
      context: .
      dockerfile: services/odh-inference-scheduler/Dockerfile
    container_name: hub-test-odh-inference-scheduler
    ports:
      - "${ODH_INFERENCE_SCHEDULER_TEST_PORT:-8097}:8080"
    networks:
      - hub-test-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Traefik API Gateway for Testing
  traefik-test:
    image: traefik:v3.0
    container_name: hub-test-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_TEST_PORT:-8080}:80"
      - "${TRAEFIK_SECURE_TEST_PORT:-8443}:443"
      - "${TRAEFIK_DASHBOARD_TEST_PORT:-8099}:8080"
    volumes:
      - ./infrastructure/traefik/traefik-test.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - hub-test-net
    depends_on:
      - jaeger-test
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/rawdata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres-test-data:
    driver: local
  redis-cache-test-data:
    driver: local
  redis-queue-test-data:
    driver: local
  redis-events-test-data:
    driver: local
  redis-channels-test-data:
    driver: local
  postgres-baas-test-data:
    driver: local
  redis-baas-test-data:
    driver: local
  minio-test-data:
    driver: local
  clamav-test-db:
    driver: local
  fuseki-test-data:
    driver: local
  prefect-server-test-data:
    driver: local
  prefect-db-test-data:
    driver: local
  prometheus-test-data:
    driver: local
  grafana-test-data:
    driver: local
  alertmanager-test-data:
    driver: local
  ckan-test-db-test-data:
    driver: local
  ckan-test-solr-test-data:
    driver: local
  ckan-test-redis-test-data:
    driver: local

networks:
  hub-test-net:
    driver: bridge
