# Docker Compose configuration for comprehensive test infrastructure
# This file provides a complete test environment with all required services
# Usage: docker-compose -f docker-compose.test.yml up -d
#
# Features:
# - Isolated test database (hub_test)
# - All microservices configured for testing
# - Real services (no mocks/stubs)
# - Health checks for all services
# - Test-specific configuration

version: "3.8"

services:
  # PostgreSQL Database for Testing
  postgres-test:
    image: postgres:16-alpine
    container_name: hub-test-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_DB:-hub_test}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hub-test-net
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

  # Redis for Testing (Job Queue and Event Bus)
  redis-test:
    image: redis:7-alpine
    container_name: hub-test-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-1gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_TEST_PORT:-6380}:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hub-test-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_MAX_MEMORY:-1gb}
      - REDIS_MAXMEMORY_POLICY=${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - ENVIRONMENT=test
      - DEBUG=True
      - LOG_LEVEL=DEBUG

  # MinIO (S3-compatible storage) for Testing
  minio-test:
    image: minio/minio:latest
    container_name: hub-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "${MINIO_TEST_API_PORT:-9010}:9000"
      - "${MINIO_TEST_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - hub-test-net

  # Apache Jena Fuseki (Triple Store) for Testing
  fuseki-test:
    image: stain/jena-fuseki:latest
    container_name: hub-test-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub_test}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "${FUSEKI_TEST_PORT:-3031}:3030"
    volumes:
      - fuseki-test-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - hub-test-net

  # DataContract Service for Testing
  datacontract-service-test:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-test-datacontract
    ports:
      - "${DATACONTRACT_TEST_PORT:-8093}:8080"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # DQ Service for Testing
  dq-service-test:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-test-dq
    ports:
      - "${DQ_TEST_PORT:-8084}:8083"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Compliance Service for Testing
  compliance-service-test:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-test-compliance
    ports:
      - "${COMPLIANCE_TEST_PORT:-8085}:8082"
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Semantic Service for Testing
  semantic-service-test:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-test-semantic
    ports:
      - "${SEMANTIC_TEST_PORT:-8086}:8081"
    environment:
      FUSEKI_URL: http://fuseki-test:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub_test}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      HUB_DOMAIN: ${HUB_DOMAIN:-test.hub.example.com}
      ENVIRONMENT: test
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/semantic-service:/app:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      fuseki-test:
        condition: service_healthy
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # API Service for Testing
  api-service-test:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-test-api
    command: python hub/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${API_TEST_PORT:-8001}:8000"
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8001}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_DB:-hub_test}
      REDIS_URL: redis://redis-test:6379/0
      REDIS_HOST: redis-test
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_S3_ENDPOINT_URL: http://minio-test:9000
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-hub-test}
      DATACONTRACT_SERVICE_URL: http://datacontract-service-test:8080
      DQ_SERVICE_URL: http://dq-service-test:8083
      COMPLIANCE_SERVICE_URL: http://compliance-service-test:8082
      SEMANTIC_SERVICE_URL: http://semantic-service-test:8081
      FUSEKI_URL: http://fuseki-test:3030
      ENVIRONMENT: test
      APP_VERSION: ${APP_VERSION:-1.0.0-test}
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      USE_PRODUCTION_DB_FOR_SDK_TESTS: "0"
      DJANGO_SETTINGS_MODULE: hub.settings
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      datacontract-service-test:
        condition: service_healthy
      dq-service-test:
        condition: service_healthy
      compliance-service-test:
        condition: service_healthy
      semantic-service-test:
        condition: service_healthy
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Worker Service for Testing
  worker-service-test:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hub-test-worker
    command: python services/worker/main.py job_critical job_default job_low
    ports:
      - "${WORKER_TEST_HEALTH_PORT:-8087}:8080"
    volumes:
      - .:/app
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8001}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_RESERVED_SLOTS_RATIO: ${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      WORKER_STARVATION_THRESHOLD_SECONDS: ${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-hub_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_test}
      POSTGRES_DB: ${POSTGRES_DB:-hub_test}
      REDIS_URL: redis://redis-test:6379/0
      REDIS_HOST: redis-test
      ENVIRONMENT: test
      APP_VERSION: ${APP_VERSION:-1.0.0-test}
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      DJANGO_SETTINGS_MODULE: hub.settings
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      api-service-test:
        condition: service_healthy
    networks:
      - hub-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Prefect Server for Testing Scheduled Ingestion
  prefect-server-test:
    image: prefecthq/prefect:2-python3.12
    container_name: hub-test-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql://prefect:prefect@prefect-db-test:5432/prefect
      PREFECT_LOGGING_LEVEL: DEBUG
      ENVIRONMENT: test
    ports:
      - "${PREFECT_SERVER_TEST_PORT:-4202}:4200"
      - "${PREFECT_UI_TEST_PORT:-4203}:4201"
    volumes:
      - prefect-server-test-data:/root/.prefect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      prefect-db-test:
        condition: service_healthy
    networks:
      - hub-test-net

  # Prefect Database (PostgreSQL) for Testing
  prefect-db-test:
    image: postgres:16-alpine
    container_name: hub-test-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
      ENVIRONMENT: test
    ports:
      - "${PREFECT_DB_TEST_PORT:-5435}:5432"
    volumes:
      - prefect-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hub-test-net

  # Prefect Worker for Testing
  prefect-worker-test:
    image: prefecthq/prefect:2-python3.12
    container_name: hub-test-prefect-worker
    command: prefect worker start --pool default --type process
    environment:
      PREFECT_API_URL: http://prefect-server-test:4200/api
      PREFECT_LOGGING_LEVEL: DEBUG
      ENVIRONMENT: test
    volumes:
      - ./services/prefect-integration:/app:ro
    depends_on:
      prefect-server-test:
        condition: service_healthy
    networks:
      - hub-test-net

volumes:
  postgres-test-data:
    driver: local
  redis-test-data:
    driver: local
  minio-test-data:
    driver: local
  fuseki-test-data:
    driver: local
  prefect-server-test-data:
    driver: local
  prefect-db-test-data:
    driver: local

networks:
  hub-test-net:
    driver: bridge
