[pytest]
DJANGO_SETTINGS_MODULE = hub.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    --asyncio-mode=auto
testpaths = hub/apps tests
# Timeout applies only to test function body, not fixture setup (e.g. django_db_setup/migrations)
timeout_func_only = true
timeout = 300
markers =
    unit: Unit tests
    integration: Integration tests (require services to be running)
    e2e: End-to-end tests
    slow: Slow running tests
    performance: Performance tests (can be skipped for faster runs)
    requires_services: Tests that require external services to be running
    e2e_batch1: E2E Batch 1 - Core API, Contracts, Assets
    e2e_batch2: E2E Batch 2 - Worker Service, Jobs, DQ, Compliance
    e2e_batch3: E2E Batch 3 - Email, Notifications, Rate Limiting
    e2e_batch4: E2E Batch 4 - Tenant Config, Personas, CLI
    e2e_batch5: E2E Batch 5 - Marketplace, Semantic, Monitoring, Edge Cases
    asyncio: Async tests (pytest-asyncio marker)
    requires_test_env: Tests that require test environment validation
    requires_database: Tests that require database connectivity
    requires_redis: Tests that require Redis connectivity
    requires_services_connectivity: Tests that require service connectivity validation
    isolation: Tests that require isolation (run separately to avoid cache/db pollution)
    docker_compose_runtime: Tests that require Docker Compose services (set PYTEST_DOCKER_COMPOSE_RUNTIME=1)
    security: Security-related tests (secrets, CORS, auth)
    scheduled_export: Scheduled export feature tests
    saas_platform: SaaS platform feature tests
    cli_sdk: CLI and SDK tests
    regression: Regression tests

