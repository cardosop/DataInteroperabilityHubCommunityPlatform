[pytest]
DJANGO_SETTINGS_MODULE = hub.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=hub
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --create-db
    --asyncio-mode=auto
testpaths = hub/apps tests
markers =
    unit: Unit tests
    integration: Integration tests (require services to be running)
    e2e: End-to-end tests
    slow: Slow running tests
    requires_services: Tests that require external services to be running
    e2e_batch1: E2E Batch 1 - Core API, Contracts, Assets
    e2e_batch2: E2E Batch 2 - Worker Service, Jobs, DQ, Compliance
    e2e_batch3: E2E Batch 3 - Email, Notifications, Rate Limiting
    e2e_batch4: E2E Batch 4 - Tenant Config, Personas, CLI
    e2e_batch5: E2E Batch 5 - Marketplace, Semantic, Monitoring, Edge Cases
    asyncio: Async tests (pytest-asyncio marker)

