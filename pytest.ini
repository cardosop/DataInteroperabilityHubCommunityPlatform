[pytest]
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --asyncio-mode=auto
filterwarnings =
    ignore::DeprecationWarning:pyparsing
    ignore::DeprecationWarning:rdflib
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google.protobuf
    ignore::DeprecationWarning:strawberry.django.views
    ignore::DeprecationWarning:jsonschema
    ignore::PendingDeprecationWarning
    ignore:Overriding setting DATABASES:UserWarning:django.test.utils
asyncio_default_fixture_loop_scope = function
testpaths = hub/apps tests
# Timeout applies only to test function body, not fixture setup (e.g. django_db_setup/migrations)
timeout_func_only = true
timeout = 300
markers =
    unit: Unit tests
    integration: Integration tests (require services to be running)
    e2e: End-to-end tests
    slow: Slow running tests
    performance: Performance tests (can be skipped for faster runs)
    requires_services: Tests that require external services to be running
    e2e_batch1: E2E Batch 1 - Core API, Contracts, Assets
    e2e_batch2: E2E Batch 2 - Worker Service, Jobs, DQ, Compliance
    e2e_batch3: E2E Batch 3 - Email, Notifications, Rate Limiting
    e2e_batch4: E2E Batch 4 - Tenant Config, Personas, CLI
    e2e_batch5: E2E Batch 5 - Marketplace, Semantic, Monitoring, Edge Cases
    asyncio: Async tests (pytest-asyncio marker)
    requires_test_env: Tests that require test environment validation
    requires_database: Tests that require database connectivity
    requires_redis: Tests that require Redis connectivity
    requires_services_connectivity: Tests that require service connectivity validation
    isolation: Tests that require isolation (run separately to avoid cache/db pollution)
    docker_compose_runtime: Tests that require Docker Compose services (set PYTEST_DOCKER_COMPOSE_RUNTIME=1)
    spec: Spec traceability marker (format: spec:requirement:scenario)
    security: Security-related tests (secrets, CORS, auth)
    scheduled_export: Scheduled export feature tests
    saas_platform: SaaS platform feature tests
    cli_sdk: CLI and SDK tests
    regression: Regression tests
    odh_inference: Tests that require ODH Inference Scheduler (skip at runtime if not available)
    requires_minio: Tests that require MinIO/S3 for file uploads (skip when MinIO unavailable; Phase 7.2.3)
    requires_prefect: Tests that require Prefect (scheduled ingestion/export); fail when unreachable (Phase 7.4.3, 7.6.2)
    requires_mailhog: Tests that require MailHog for password reset E2E; skip when unavailable (Phase 7.4.4, 7.6.2)
    requires_aws_role_arn: AWS integration tests that require AWS_ROLE_ARN (skip when unset)
    requires_aws_session_token: AWS integration tests that require AWS_SESSION_TOKEN (skip when unset)
    requires_aws_test_dataset: AWS integration tests that require a test dataset ID (skip when none available)
    requires_gcp_service_account: GCP integration tests that require valid GCP_SERVICE_ACCOUNT_JSON (skip when unset or invalid)
    snowflake_e2e: Snowflake Data Marketplace E2E tests (require SNOWFLAKE_ACCOUNT/USER/TOKEN; exclude with -m 'not snowflake_e2e')
    snowflake_integration: Snowflake connector integration tests (require SNOWFLAKE_ACCOUNT/USER/TOKEN; deselect when unset)
    aws_integration: AWS Data Exchange connector integration tests (require AWS credentials; deselect when unset)
    gcp_integration: GCP Marketplace connector integration tests (require GCP_PROJECT_ID/credentials; deselect when unset)
    real_scheduled_e2e: Real scheduled ingestion/export E2E (require REAL_SCHEDULED_E2E=1; no mocks; see docs/runbooks/REAL_SCHEDULED_INGESTION_EXPORT_E2E.md)
    real_virtualization_e2e: Real virtualization E2E (PostgreSQL, Fuseki, REST, federated asset/CKAN; no mocks; see docs/runbooks/REAL_VIRTUALIZATION_E2E.md)
    scheduled_ingestion_integration: Scheduled ingestion job tests requiring real S3/Prefect (exclude from default batch; run with REAL_SCHEDULED_E2E=1 or real infra)
    requires_stripe: Stripe-dependent tests (require STRIPE_SECRET_KEY; deselect when unset for 0 skips)
    uc: Use case ID from USE_CASES.md (e.g. UC-AUTH-001)
    journey: User journey ID from USER_JOURNEYS.md (e.g. JOURNEY-DPO-001)
    persona: Persona name (e.g. Data Product Owner, Data Engineer)
    uc_journey_persona: UC/journey/persona E2E tests (use -m "uc or journey or persona" to run)
    e2e1: E2E sub-batch 1 - Core API, Contracts, Assets, Datasets, Files, Schema
    e2e2: E2E sub-batch 2 - Worker, Jobs, DQ, Compliance
    e2e3: E2E sub-batch 3 - Email, Rate Limiting
    e2e4: E2E sub-batch 4 - Auth, Personas, Tenants, CLI
    e2e5: E2E sub-batch 5 - Marketplace, Semantic, Monitoring, Edge Cases, Journeys
    workflow_e2e: Workflow engine E2E tests (business rules, error recovery, observability)
    marketplace: Marketplace-specific tests (trust signals, listings, orders)
    serial: Tests that must run sequentially (avoid deadlocks)
    mvp: Tests for MVP features (release/mvp-v1 CI subset)

