<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inter font (Phase 28.7.3 Meshant typography): preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Meshant</title>
    <!--
      Phase 224.4 — pre-hydration theme application.
      Synchronous, blocking: runs before any CSS parses so the page paints
      with the correct theme on first frame (no flash-of-light for dark users).
      Must stay in lockstep with useTheme.ts: storage key, media query,
      data-theme values.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('meshant.theme');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var systemDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (systemDark ? 'dark' : 'light') : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
