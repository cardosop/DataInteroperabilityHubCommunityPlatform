# Nginx config for test stack (docker-compose.test.yml).
# Uses api-service-test (test stack service name); api-service is used in main compose.
#
# NOTE: This file is volume-mounted directly to /etc/nginx/conf.d/default.conf
# (not processed by the envsubst template mechanism used in production).
# Variables like ${API_HOST} cannot be used here — CSP uses same-origin only,
# which is correct for the test deployment where /api is proxied through nginx.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security: suppress nginx version from Server header and error pages.
    server_tokens off;

    # Disable ETag for all responses.
    # Static assets use content-hashed filenames (Vite fingerprinting), so
    # ETags are redundant.
    etag off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # -------------------------------------------------------------------------
    # SPA routing — serve index.html for all frontend routes.
    #
    # index.html must not be cached so browsers always fetch the latest entry
    # point (which references content-hashed JS/CSS bundles).
    #
    # IMPORTANT — nginx add_header inheritance:
    #   Child location blocks that define any add_header directive of their own
    #   do NOT inherit add_header directives from the parent server block.
    #   Security headers are therefore repeated in every location block that
    #   serves content directly (/, static assets).
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;

        # Prevent this page being loaded inside a frame on any origin.
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing; forces the browser to respect Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Send origin only to same-origin requests; strip on cross-origin navigation.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Opt out of unused powerful features to shrink the attack surface.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # HSTS: instruct browsers to enforce HTTPS for this origin for 1 year.
        # Harmless in test (HTTP), present so tests exercise the header path.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy — enforced in test to match production.
        # style-src: fonts.googleapis.com for Google Fonts loaded in index.html.
        # font-src: fonts.gstatic.com for actual font file downloads.
        # connect-src: localhost:9010 for MinIO presigned file uploads in test env.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:9010 https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; report-uri /api/csp-report/" always;
    }

    # Health endpoint proxy - use /health/live/ for fast response (liveness; no DB/Redis check)
    # /health/ does full readiness and can be slow under load
    location = /health {
        proxy_pass http://api-service-test:8000/health/live/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location /health/ {
        proxy_pass http://api-service-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # API proxy (includes /api/v1/openapi.json, /api/v1/..., /api-docs)
    location /api {
        proxy_pass http://api-service-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API docs (Swagger, ReDoc) - Django serves at /api-docs/
    location /api-docs {
        proxy_pass http://api-service-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://api-service-test:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # Cache static assets — Vite content-hashed filenames make 1-year caching safe.
    # X-Content-Type-Options prevents browsers sniffing the MIME type of scripts
    # and stylesheets served from this origin.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
