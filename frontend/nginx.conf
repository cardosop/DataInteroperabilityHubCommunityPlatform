# -------------------------------------------------------------------------
# Custom log format for WebSocket connections (defense-in-depth).
#
# Logs $uri instead of the default $request_uri so query-string parameters
# (which may contain tokens during the deprecated ?token= transition) are
# never written to disk.  Used by the /ws location block below.
#
# Defined at file level (http context) because nginx log_format is only
# valid in the http block, not inside server or location blocks.
# -------------------------------------------------------------------------
log_format ws_no_args '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri HTTP/$server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security: suppress nginx version from Server header and error pages.
    server_tokens off;

    # Disable ETag for all responses.
    # Static assets use content-hashed filenames (Vite fingerprinting), so
    # ETags are redundant.  Disabling also prevents potential inode
    # information leakage present in some nginx builds.
    etag off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # -------------------------------------------------------------------------
    # SPA routing — serve index.html for all frontend routes.
    #
    # index.html MUST NOT be cached so browsers always fetch the latest entry
    # point (which in turn references content-hashed JS/CSS bundles).
    #
    # IMPORTANT — nginx add_header inheritance:
    #   Child location blocks that define any add_header directive of their own
    #   do NOT inherit add_header directives from the parent server block.
    #   Security headers are therefore repeated in every location block that
    #   serves content directly (/, static assets).  Proxy locations receive
    #   their security headers from Django's SecurityMiddleware to avoid
    #   duplicate headers on proxied responses.
    #
    # ROOT-CAUSE NOTE: try_files previously included $uri/ which caused nginx
    # to attempt directory listing for SPA routes that collide with Vite's
    # output directory names (e.g. /assets/ matches /usr/share/nginx/html/assets/
    # which is the dist/assets/ bundle directory). With autoindex off (default)
    # nginx returns 403 instead of falling through to /index.html. Removing
    # $uri/ forces unmatched paths to render the SPA shell as intended.
    # -------------------------------------------------------------------------
    location / {
        # Phase 221.1 defense-in-depth: use the ws_no_args log format (logs
        # $uri instead of $request_uri) so that legacy ?token= query strings
        # from in-flight password-reset emails are never written to disk.
        # Can be reverted to the default format once all ?token= emails have
        # expired (1 hour TTL).
        access_log /var/log/nginx/access.log ws_no_args;

        try_files $uri /index.html;

        # Cache-control: never cache the HTML entry point.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;

        # Prevent this page being loaded inside a frame on any origin.
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing; forces the browser to respect Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Phase 221.1.1: "no-referrer" prevents the browser from sending any
        # Referer header when navigating away.  This is critical for pages
        # that carry sensitive tokens in the URL (e.g. password-reset confirm
        # links with ?token= or #token=).  The previous value
        # "strict-origin-when-cross-origin" would still leak the full URL
        # (including tokens) on same-origin navigations.
        add_header Referrer-Policy "no-referrer" always;

        # Opt out of unused powerful features to shrink the attack surface.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # HSTS: instruct browsers to enforce HTTPS for this origin for 1 year.
        # Requires TLS termination upstream (Traefik in this deployment).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy — ENFORCE mode (task 7.7).
        #
        # Violations are POSTed to /api/csp-report/ (Django endpoint) and
        # recorded in Prometheus as hub_csp_violations_total.
        # Enforced after 2-week report-only observation period confirmed
        # hub_csp_violations_total rate near-zero in staging (2026-03-18).
        #
        # ${API_HOST} is substituted by envsubst at container startup.
        # Default (API_HOST="") uses same-origin only, which is correct for
        # the standard deployment where /api is proxied through this nginx.
        # Set API_HOST="https://api.example.com" in docker-compose environment
        # when the API is served from a separate domain.
        # connect-src includes *.s3.amazonaws.com for browser-direct presigned
        # PUT uploads (FileUpload component → S3 via XHR). Without this, CSP
        # blocks the connection before the browser even sends the request,
        # producing xhr.onerror with no HTTP response — the exact "Upload
        # failed: network error (no HTTP response from object store)" symptom
        # that JOURNEY-DPO-001 hit for 5+ consecutive runs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${API_HOST} https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; report-uri /api/csp-report/" always;
    }

    # -------------------------------------------------------------------------
    # Phase 221.2.2 — Django admin block REMOVED (glittery-dreaming-micali A2).
    #
    # The `location ^~ /admin { return 404; }` rule intercepted /admin* before
    # the SPA catch-all, killing the React admin page (/admin → UserListPage).
    # The Django admin is disabled at the URL-conf level in production
    # (221.2.1) and never proxied through the frontend nginx (only /api/* is
    # proxied), so this block was unnecessary and actively harmful.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Health endpoint proxy (Django /health/ and /health/live/)
    # Security headers come from Django's SecurityMiddleware.
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # API proxy — /api/v1/*, /api/csp-report/, /api-docs
    # Security headers come from Django's SecurityMiddleware.
    # -------------------------------------------------------------------------
    location /api {
        # Phase 219.6: allow contract POSTs up to 10 MB. Default (1 MB)
        # silently rejects large ODPS documents and validate-draft
        # requests with 413 before they reach the Django backend.
        # 10 MB provides headroom over the frontend's 5 MB file limit
        # (ContractFileReader.tsx) while still protecting against abuse.
        client_max_body_size 10m;

        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Must match or exceed gunicorn --timeout (120s in deployment.yaml).
        # A lower value (e.g. 30s) causes nginx to kill the connection before
        # the upstream finishes — the browser receives a TCP RST instead of an
        # HTTP error, breaking waitForResponse-based E2E assertions and making
        # failures undiagnosable. Endpoints like POST /contracts/products/ do
        # synchronous DB writes (workflow instance creation) that can exceed 30s
        # under staging DB contention before returning HTTP 202.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API docs (Swagger, ReDoc) — Django serves at /api-docs/
    location /api-docs {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # WebSocket proxy
    #
    # Defense-in-depth: suppress query parameters from access logs during
    # the deprecation period where clients may still send ?token=... in the
    # URL.  The ws_no_args log_format (defined above at http level) logs
    # $uri instead of $request_uri, stripping query parameters so tokens
    # are never written to disk.
    #
    # Once the deprecated query-param auth path is removed
    # (WEBSOCKET_QUERY_PARAM_AUTH_DISABLED=True), this can be simplified
    # back to the default log format.
    # -------------------------------------------------------------------------
    location /ws {
        access_log /var/log/nginx/access.log ws_no_args;

        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # Static assets — Vite emits content-hashed filenames so 1-year immutable
    # caching is safe.  X-Content-Type-Options prevents browsers sniffing the
    # MIME type of scripts and stylesheets served from this origin.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
