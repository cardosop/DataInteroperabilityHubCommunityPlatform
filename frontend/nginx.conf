server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security: suppress nginx version from Server header and error pages.
    server_tokens off;

    # Disable ETag for all responses.
    # Static assets use content-hashed filenames (Vite fingerprinting), so
    # ETags are redundant.  Disabling also prevents potential inode
    # information leakage present in some nginx builds.
    etag off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # -------------------------------------------------------------------------
    # SPA routing — serve index.html for all frontend routes.
    #
    # index.html MUST NOT be cached so browsers always fetch the latest entry
    # point (which in turn references content-hashed JS/CSS bundles).
    #
    # IMPORTANT — nginx add_header inheritance:
    #   Child location blocks that define any add_header directive of their own
    #   do NOT inherit add_header directives from the parent server block.
    #   Security headers are therefore repeated in every location block that
    #   serves content directly (/, static assets).  Proxy locations receive
    #   their security headers from Django's SecurityMiddleware to avoid
    #   duplicate headers on proxied responses.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache-control: never cache the HTML entry point.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;

        # Prevent this page being loaded inside a frame on any origin.
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing; forces the browser to respect Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Send origin only to same-origin requests; strip on cross-origin navigation.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Opt out of unused powerful features to shrink the attack surface.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # HSTS: instruct browsers to enforce HTTPS for this origin for 1 year.
        # Requires TLS termination upstream (Traefik in this deployment).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy — ENFORCE mode (task 7.7).
        #
        # Violations are POSTed to /api/csp-report/ (Django endpoint) and
        # recorded in Prometheus as hub_csp_violations_total.
        # Enforced after 2-week report-only observation period confirmed
        # hub_csp_violations_total rate near-zero in staging (2026-03-18).
        #
        # ${API_HOST} is substituted by envsubst at container startup.
        # Default (API_HOST="") uses same-origin only, which is correct for
        # the standard deployment where /api is proxied through this nginx.
        # Set API_HOST="https://api.example.com" in docker-compose environment
        # when the API is served from a separate domain.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${API_HOST}; report-uri /api/csp-report/" always;
    }

    # -------------------------------------------------------------------------
    # Health endpoint proxy (Django /health/ and /health/live/)
    # Security headers come from Django's SecurityMiddleware.
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # API proxy — /api/v1/*, /api/csp-report/, /api-docs
    # Security headers come from Django's SecurityMiddleware.
    # -------------------------------------------------------------------------
    location /api {
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # API docs (Swagger, ReDoc) — Django serves at /api-docs/
    location /api-docs {
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # WebSocket proxy
    # -------------------------------------------------------------------------
    location /ws {
        proxy_pass http://api-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # Static assets — Vite emits content-hashed filenames so 1-year immutable
    # caching is safe.  X-Content-Type-Options prevents browsers sniffing the
    # MIME type of scripts and stylesheets served from this origin.
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
