# pytest-markdown-docs configuration — Phase 217.5.8
# Extracts and executes fenced Python/bash code blocks from docs.
#
# Usage: pytest --markdown-docs docs/mvpdocs/
#
# Skip blocks with: <!-- skip-test --> before the fenced block.
#
# Requires:
#   pip install pytest-markdown-docs
#
# Note: bash blocks require a running sandbox backend.
# Python blocks are executed in an isolated namespace.

[pytest]
markdown_docs = docs/mvpdocs/
markdown_docs_report = short
