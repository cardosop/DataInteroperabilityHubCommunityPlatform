services:
  postgres:
    image: postgres:16-alpine
    container_name: hub-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_INITDB_ARGS: -E UTF8
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - pgdata-dev:/var/lib/postgresql/data
    - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c checkpoint_timeout=300
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c shared_buffers=256MB
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-hub}
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    networks:
    - hub-net-dev
  # Redis Cache Instance - Response caching, contract caching, lineage caching
  redis-cache:
    image: redis:7-alpine
    container_name: hub-dev-redis-cache
    command: 'redis-server --save 900 1 --save 300 10 --save 60 10000 --maxmemory ${REDIS_CACHE_MAX_MEMORY:-2gb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_CACHE_PORT:-6379}:6379
    volumes:
    - redis-cache-data-dev:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
    - hub-net-dev
    environment:
      REDIS_MAX_MEMORY: ${REDIS_CACHE_MAX_MEMORY:-2gb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG

  # Redis Queue Instance - Job queues (RQ)
  redis-queue:
    image: redis:7-alpine
    container_name: hub-dev-redis-queue
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-1gb} --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_QUEUE_PORT:-6380}:6379
    volumes:
    - redis-queue-data-dev:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
    - hub-net-dev
    environment:
      REDIS_MAX_MEMORY: ${REDIS_QUEUE_MAX_MEMORY:-1gb}
      REDIS_MAXMEMORY_POLICY: noeviction
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG

  # Redis Events Instance - Event bus (Pub/Sub, Streams)
  redis-events:
    image: redis:7-alpine
    container_name: hub-dev-redis-events
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-1gb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_EVENTS_PORT:-6381}:6379
    volumes:
    - redis-events-data-dev:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
    - hub-net-dev
    environment:
      REDIS_MAX_MEMORY: ${REDIS_EVENTS_MAX_MEMORY:-1gb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG

  # Redis Channels Instance - WebSocket channels (Django Channels)
  redis-channels:
    image: redis:7-alpine
    container_name: hub-dev-redis-channels
    command: 'redis-server --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-512mb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_CHANNELS_PORT:-6382}:6379
    volumes:
    - redis-channels-data-dev:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
    - hub-net-dev
    environment:
      REDIS_MAX_MEMORY: ${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${MINIO_API_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data-dev:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
    - hub-net-dev
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hub-dev-mailhog
    ports:
    - "8025:8025"
    - "1025:1025"
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD-SHELL
      - "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-dev-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${FUSEKI_PORT:-3030}:3030
    volumes:
    - fuseki-data-dev:/fuseki
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3030/$/ping
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - hub-net-dev
  mock-server:
    image: mockserver/mockserver:5.15.0
    container_name: hub-dev-mock-server
    command: -serverPort 8080 -logLevel INFO
    ports:
    - ${MOCK_SERVER_PORT:-8095}:8080
    networks:
    - hub-net-dev
  semantic-service:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-dev-semantic
    ports:
    - ${SEMANTIC_PORT:-8081}:8081
    environment:
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      HUB_DOMAIN: ${HUB_DOMAIN:-dev.hub.example.com}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    volumes:
    - ./services/semantic-service:/app:ro
    dns:
    - 8.8.8.8
    - 1.1.1.1
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/health
      interval: 30s
      timeout: 10s
      retries: 3
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-dev-api
    working_dir: /app/hub
    # Run migrations once before runserver so workflow-engine and other services do not run migrate (avoids DuplicateTable races).
    # When E2E_ENSURE_USER_ROLES=true, ensure E2E test users exist with DATA_PROVIDER (for Playwright scheduled-ingestion etc.)
    # Ensure prefect is available for trigger (run_deployment); image may have been built before prefect was in requirements.txt
    command: sh -c "pip install -q 'prefect>=2.14.0,<3' 2>/dev/null || true; python manage.py migrate --noinput; python manage.py seed_default_plans; if [ \"$${E2E_ENSURE_USER_ROLES:-false}\" = true ]; then python manage.py ensure_e2e_user_roles; fi; exec python manage.py runserver 0.0.0.0:8000 --noreload"
    volumes:
    - .:/app
    ports:
    - ${API_PORT:-8000}:8000
    env_file:
    - .env.dev
    environment:
      APP_NAME: ${APP_NAME:-Meshant}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:3000}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      # Default to MailHog in dev for E2E JOURNEY-AUTH-003 (password reset)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      OPENTELEMETRY_ENABLED: ${OPENTELEMETRY_ENABLED:-true}
      OPENTELEMETRY_METRICS_ENABLED: ${OPENTELEMETRY_METRICS_ENABLED:-true}
      JAEGER_AGENT_HOST: ${JAEGER_AGENT_HOST:-jaeger}
      JAEGER_AGENT_PORT: ${JAEGER_AGENT_PORT:-6831}
      ENVIRONMENT: development
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
      MOCK_SERVER_URL: ${MOCK_SERVER_URL:-http://mock-server:8080}
      # Set to true to ensure E2E test users (e2e_test@example.com, e2e_consumer@example.com) have DATA_PROVIDER before runserver
      E2E_ENSURE_USER_ROLES: ${E2E_ENSURE_USER_ROLES:-false}
      # Prefer prefect-integration-service for deployment sync (flow + connectors live there); trigger then finds deployment
      PREFECT_INTEGRATION_SERVICE_URL: ${PREFECT_INTEGRATION_SERVICE_URL:-http://prefect-integration-service:8084}
      # Prefect API for run_deployment (trigger); must be reachable from api-service (use service name)
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      # Prefect deployment image for scheduled exports (required for deployment creation)
      PREFECT_DEPLOYMENT_IMAGE: hub-dev-prefect-integration:latest
      # Relax auth rate limit for E2E (Playwright) so login/retries do not hit 429
      RATE_LIMIT_E2E_RELAX: ${RATE_LIMIT_E2E_RELAX:-true}
      # Stripe billing (test keys for non-prod)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51T412N79Dw5TG33rxbm9F3zSZ1rPxI5En7Tb2n8OL65Cd9wwCdpuiPsIcmi5qQATGzx7pMrGNKKj1pQiwB7w45Hw004ICHrRJe}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MARKETPLACE_WEBHOOK_SECRET: ${STRIPE_MARKETPLACE_WEBHOOK_SECRET:-}
      # Phase 271.2 — Stripe Connect webhook signing secret (optional; falls back to STRIPE_WEBHOOK_SECRET)
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      SEARCH_RATE_LIMIT_PER_MIN: ${SEARCH_RATE_LIMIT_PER_MIN:-60/min}
      SUGGESTIONS_RATE_LIMIT_PER_MIN: ${SUGGESTIONS_RATE_LIMIT_PER_MIN:-120/min}
      SPARQL_RATE_LIMIT_PER_MIN: ${SPARQL_RATE_LIMIT_PER_MIN:-10/min}
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      mock-server:
        condition: service_started
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD-SHELL
      - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()\" || exit 1"
      interval: 30s
      timeout: 20s
      retries: 8
      start_period: 180s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Meshant}
        VITE_FEATURE_TOAST_ENABLED: ${VITE_FEATURE_TOAST_ENABLED:-}
        VITE_FEATURE_BREADCRUMBS_ENABLED: ${VITE_FEATURE_BREADCRUMBS_ENABLED:-}
        VITE_FEATURE_RESOURCE_PICKERS_ENABLED: ${VITE_FEATURE_RESOURCE_PICKERS_ENABLED:-}
        # Empty by default: app uses relative /api/v1 paths proxied by nginx.
        # Set to an absolute URL only for non-nginx deployments (e.g. CDN-hosted SPA).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_USE_PUBLIC_DNS: ${NPM_USE_PUBLIC_DNS:-0}
    container_name: hub-dev-frontend
    ports:
    - ${FRONTEND_PORT:-3000}:80
    environment:
    - VITE_APP_NAME=${APP_NAME:-Meshant}
    - VITE_ENV=${ENV:-development}
    networks:
    - hub-net-dev
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  worker-service:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Meshant}
      # Redis: must match api-service so worker consumes from same queue (password reset, etc.)
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      REDIS_EVENTS_URL: redis://redis-events:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels:6379/0
      REDIS_URL: redis://redis-cache:6379/0
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:3000}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      # Default to MailHog in dev for E2E JOURNEY-AUTH-003 (password reset)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_RESERVED_SLOTS_RATIO: ${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      WORKER_STARVATION_THRESHOLD_SECONDS: ${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      OPENTELEMETRY_ENABLED: ${OPENTELEMETRY_ENABLED:-true}
      OPENTELEMETRY_METRICS_ENABLED: ${OPENTELEMETRY_METRICS_ENABLED:-true}
      JAEGER_AGENT_HOST: ${JAEGER_AGENT_HOST:-jaeger}
      JAEGER_AGENT_PORT: ${JAEGER_AGENT_PORT:-6831}
      ENVIRONMENT: development
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
      MOCK_SERVER_URL: ${MOCK_SERVER_URL:-http://mock-server:8080}
    container_name: hub-dev-worker
    working_dir: /app
    # Include 'default' to drain legacy jobs enqueued before compliance fix (job_critical routing)
    command: python services/worker/main.py job_critical job_default job_low default
    ports:
    - ${WORKER_HEALTH_PORT:-8093}:8080
    volumes:
    - .:/app
    env_file:
    - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      mock-server:
        condition: service_started
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  datacontract-service:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-dev-datacontract
    working_dir: /app/services/datacontract-service
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    ports:
    - ${DATACONTRACT_PORT:-8080}:8080
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - .:/app
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-dev-compliance
    working_dir: /app/services/compliance-service
    command: uvicorn main:app --host 0.0.0.0 --port 8082 --reload
    ports:
    - ${COMPLIANCE_PORT:-8082}:8082
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8082/health
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - .:/app
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  dq-service:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-dev-dq
    working_dir: /app/services/dq-service
    command: uvicorn main:app --host 0.0.0.0 --port 8083 --reload
    ports:
    - ${DQ_PORT:-8083}:8083
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8083/health
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - .:/app
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: hub-dev-prefect-server
    command: sh -c "pip install --quiet asyncpg && prefect server start --host 0.0.0.0"
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect}@prefect-db:5432/prefect
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${PREFECT_SERVER_PORT:-4200}:4200
    - ${PREFECT_UI_PORT:-4201}:4201
    volumes:
    - prefect-server-data-dev:/root/.prefect
    healthcheck:
      test:
      - CMD-SHELL
      - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health').read()\" || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
    - hub-net-dev
  prefect-db:
    image: postgres:16-alpine
    container_name: hub-dev-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect}
      POSTGRES_DB: prefect
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${PREFECT_DB_PORT:-5433}:5432
    volumes:
    - prefect-db-data-dev:/var/lib/postgresql/data
    command: >
      postgres
      -c checkpoint_timeout=300
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c shared_buffers=256MB
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U prefect
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    networks:
    - hub-net-dev
  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: hub-dev-prefect-worker
    command: prefect worker start --pool ${PREFECT_WORKER_POOL:-default} --type process
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      # Hub API configuration for scheduled ingestion worker API
      HUB_BASE_URL: ${HUB_BASE_URL:-http://api-service:8000}
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    volumes:
    - ./services/prefect-integration:/app:ro
    depends_on:
      prefect-server:
        condition: service_healthy
      api-service:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD-SHELL
      - "python -c \"import os; procs = [d for d in os.listdir('/proc') if d.isdigit()]; found = any(os.path.exists(f'/proc/{p}/cmdline') and b'prefect' in open(f'/proc/{p}/cmdline', 'rb').read() for p in procs); exit(0 if found else 1)\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  # Docker work pool worker: runs flow.deploy(image=...) deployments; create pool if missing
  prefect-worker-docker:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile.worker-docker
    image: hub-dev-prefect-worker-docker:latest
    container_name: hub-dev-prefect-worker-docker
    command: sh -c "prefect work-pool create --type docker docker-pool 2>/dev/null || true; exec prefect worker start --pool docker-pool --type docker"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD-SHELL
      - "python -c \"import os; procs = [d for d in os.listdir('/proc') if d.isdigit()]; found = any(os.path.exists(f'/proc/{p}/cmdline') and b'prefect' in open(f'/proc/{p}/cmdline', 'rb').read() for p in procs); exit(0 if found else 1)\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  prefect-integration-service:
    image: hub-dev-prefect-integration:latest
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile
    container_name: hub-dev-prefect-integration
    working_dir: /app/services/prefect-integration
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8084 --reload
    user: "0:0"
    ports:
    - ${PREFECT_INTEGRATION_PORT:-8084}:8084
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      PREFECT_WORK_POOL_NAME: ${PREFECT_WORK_POOL_NAME:-docker-pool}
      PREFECT_DEPLOYMENT_IMAGE: ${PREFECT_DEPLOYMENT_IMAGE:-hub-dev-prefect-integration:latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      DEBUG: 'True'
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8084/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - .:/app
  observability-service:
    build:
      context: .
      dockerfile: services/observability-service/Dockerfile
    container_name: hub-dev-observability
    working_dir: /app/services/observability-service
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8086 --reload
    user: "0:0"
    ports:
    - ${OBSERVABILITY_PORT:-8086}:8086
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      PROMETHEUS_URL: http://prometheus:9090
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      METRICS_UPDATE_INTERVAL_SECONDS: ${METRICS_UPDATE_INTERVAL_SECONDS:-60}
      FRESHNESS_CHECK_INTERVAL_SECONDS: ${FRESHNESS_CHECK_INTERVAL_SECONDS:-300}
      DEBUG: 'True'
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8086/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - .:/app
  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: hub-dev-webhook
    working_dir: /app/services/webhook-service
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8087 --reload
    user: "0:0"
    ports:
    - ${WEBHOOK_PORT:-8087}:8087
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      WEBHOOK_RETRY_MAX_ATTEMPTS: ${WEBHOOK_RETRY_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF_SECONDS: ${WEBHOOK_RETRY_BACKOFF_SECONDS:-1,5,30,300,1800}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-30}
      DEBUG: 'True'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8087/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - .:/app
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hub-dev-prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    ports:
    - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
    - prometheus-data-dev:/prometheus
    networks:
    - hub-net-dev
    depends_on:
    - api-service
    - worker-service
    - semantic-service
    - dq-service
    - compliance-service
    - datacontract-service
    - prefect-integration-service
    - webhook-service
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hub-dev-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ''
      GF_DATABASE_LOCK_RETRY_TIMEOUT: 30s
      GF_DATABASE_MAX_RETRIES: 10
      GF_PROVISIONING_DATASOURCES_AUTO_RELOAD: 'false'
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${GRAFANA_PORT:-3001}:3000
    volumes:
    - grafana-data-dev:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
    - hub-net-dev
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD-SHELL
      - "wget -q -T 10 -O /dev/null http://localhost:3000/api/health 2>&1 || wget -q -T 10 -O /dev/null http://localhost:3000/ 2>&1 || exit 1"
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    container_name: hub-dev-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
    ports:
    - ${JAEGER_UI_PORT:-16686}:16686
    - ${JAEGER_HTTP_PORT:-14268}:14268
    - ${JAEGER_UDP_PORT:-6831}:6831/udp
    networks:
    - hub-net-dev
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:16686/
      interval: 30s
      timeout: 10s
      retries: 3
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hub-dev-alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    ports:
    - ${ALERTMANAGER_PORT:-9093}:9093
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager-data-dev:/alertmanager
    networks:
    - hub-net-dev
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9093/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
  ckan-test-db:
    image: postgres:16-alpine
    container_name: hub-dev-ckan-test-db
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ckan
      POSTGRES_DB: ckan_test
      POSTGRES_INITDB_ARGS: -E UTF8
    ports:
    - ${CKAN_TEST_DB_PORT:-5434}:5432
    volumes:
    - ckan-test-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - "pg_isready -U ckan -d ckan_test"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - hub-net-dev
  ckan-test-solr:
    image: solr:9
    container_name: hub-dev-ckan-test-solr
    command:
    - solr-precreate
    - ckan
    ports:
    - ${CKAN_TEST_SOLR_PORT:-8983}:8983
    volumes:
    - ckan-test-solr-data-dev:/var/solr
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8983/api/node/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - hub-net-dev
  ckan-test-redis:
    image: redis:7-alpine
    container_name: hub-dev-ckan-test-redis
    command: redis-server --appendonly yes
    ports:
    - ${CKAN_TEST_REDIS_PORT:-6383}:6379
    volumes:
    - ckan-test-redis-data-dev:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
    - hub-net-dev
  odh-training-operator:
    build:
      context: .
      dockerfile: services/odh-training-operator/Dockerfile
    container_name: hub-dev-odh-training-operator
    ports:
    - ${ODH_TRAINING_OPERATOR_PORT:-8096}:8080
    networks:
    - hub-net-dev
    environment:
    - PORT=8080
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  odh-inference-scheduler:
    build:
      context: .
      dockerfile: services/odh-inference-scheduler/Dockerfile
    container_name: hub-dev-odh-inference-scheduler
    ports:
    - ${ODH_INFERENCE_SCHEDULER_PORT:-8097}:8080
    networks:
    - hub-net-dev
    environment:
    - PORT=8080
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  traefik:
    image: traefik:v3.1.0
    container_name: hub-dev-traefik
    command:
    - --api.dashboard=true
    - --api.insecure=true
    # Docker provider disabled: Traefik's Docker client API (1.24) is older than host daemon minimum (1.44).
    # Use file-based routing in ./infrastructure/traefik/dynamic/ instead.
    - --providers.docker=false
    - --providers.file.directory=/etc/traefik/dynamic
    - --providers.file.watch=true
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --certificatesresolvers.letsencrypt.acme.email=admin@hub.example.com
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --log.level=INFO
    - --log.format=json
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    ports:
    - ${TRAEFIK_PORT:-80}:80
    - ${TRAEFIK_SECURE_PORT:-443}:443
    - ${TRAEFIK_DASHBOARD_PORT:-8099}:8080
    volumes:
    # Socket not mounted: Docker provider disabled (API version mismatch with host daemon)
    - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    - traefik-letsencrypt-dev:/letsencrypt
    networks:
    - hub-net-dev
    depends_on:
    - jaeger
    healthcheck:
      test:
      - CMD-SHELL
      - "wget -q -T 10 -O /dev/null http://localhost:8080/api/overview || exit 1"
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    labels:
    - traefik.enable=true
    - traefik.http.routers.traefik.rule=Host(`traefik.hub.local`)
    - traefik.http.routers.traefik.service=api@internal
    environment:
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: DEBUG
networks:
  hub-net-dev:
    driver: bridge
volumes:
  pgdata-dev: {}
  redis-cache-data-dev: {}
  redis-queue-data-dev: {}
  redis-events-data-dev: {}
  redis-channels-data-dev: {}
  minio-data-dev: {}
  fuseki-data-dev: {}
  prometheus-data-dev: {}
  grafana-data-dev: {}
  alertmanager-data-dev: {}
  prefect-server-data-dev: {}
  prefect-db-data-dev: {}
  traefik-letsencrypt-dev: {}
  ckan-test-db-data-dev: {}
  ckan-test-solr-data-dev: {}
  ckan-test-redis-data-dev: {}
