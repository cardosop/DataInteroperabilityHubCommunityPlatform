# Pre-commit hooks configuration
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.12
        args: ['--line-length=100']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs, types-redis, types-requests]
        args: ['--ignore-missing-imports', '--show-error-codes']
        exclude: ^(migrations/|tests/|venv/|\.venv/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', '.bandit', '-r', 'hub/', 'services/']
        exclude: ^(migrations/|tests/|venv/|\.venv/)

  - repo: local
    hooks:
      - id: validate-transformation-schemas
        name: Validate Transformation Pipeline Schemas
        entry: python -c "import json, sys; [json.load(open(f)) for f in sys.argv[1:]]" --
        language: system
        types: [file]
        files: ^hub/apps/transformation/.*\.json$
        pass_filenames: true
        description: "Validate JSON schema files for transformation pipelines"

  - repo: local
    hooks:
      - id: validate-odps-schemas
        name: Validate ODPS Schema Files
        entry: python scripts/validate_odps_schemas.py --strict
        language: system
        types: [file]
        files: ^hub/apps/contracts/schemas/odps/.*\.json$
        pass_filenames: false
        always_run: true

      - id: lint-odps
        name: Lint ODPS Files
        entry: python scripts/lint_odps.py --strict
        language: system
        types: [file]
        files: ^(tests/fixtures/odps/|examples/contracts/).*\.(json|yaml|yml)$
        pass_filenames: true

      - id: format-check-odps
        name: Check ODPS Formatting
        entry: python scripts/format_odps.py
        language: system
        types: [file]
        files: ^(tests/fixtures/odps/|examples/contracts/).*\.(json|yaml|yml)$
        pass_filenames: true

      - id: validate-url-patterns
        name: Validate URL Patterns
        entry: python scripts/validate_url_patterns.py --strict
        language: system
        types: [file]
        files: ^(hub/apps/.*/urls\.py|hub/urls\.py)$
        pass_filenames: false
        always_run: false
        description: "Validate Django URL patterns against API naming standards"

      - id: check-dq-log-extras
        name: 240.5.F.4 — DQ logger extras PII gate
        entry: python scripts/check_dq_log_extras.py
        language: system
        # Run on ANY change to the canonical DQ Hub-side files so the
        # check fires whenever a log call is added/edited.  Pass no
        # filenames — the script defaults to scanning the canonical
        # five files per Phase 240.5.F.1 (views/services/service_client/
        # alerting/tasks) PLUS the alert-delivery client subtree
        # (hub/apps/dq/clients/{base,email_client,webhook_client,
        # slack_client,pagerduty_client}.py — extension scope from
        # 240.5.F audit pass).  Globally-scoped (always_run when files
        # match) so a refactor that splits a log call across two
        # files is still caught.
        files: ^hub/apps/dq/((views|services|service_client|alerting|tasks)\.py|clients/[^/]+\.py)$
        pass_filenames: false
        description: "Phase 240.5.F.4 — bans raw redacted-key payloads in DQ logger.* extra= args. Wrap the dict in _redact() from hub.apps.dq.log_helpers."

      - id: lint-marketplace-code
        name: Lint Marketplace Integration Code
        entry: bash -c 'ruff check --select I,F,E,W --ignore E501 "$@"' --
        language: system
        types: [python]
        files: ^hub/apps/integrations/.*\.py$
        pass_filenames: true
        description: "Lint marketplace integration code with ruff"

      - id: format-check-marketplace-code
        name: Check Marketplace Code Formatting
        entry: bash -c 'black --check --line-length=100 "$@"' --
        language: system
        types: [python]
        files: ^hub/apps/integrations/.*\.py$
        pass_filenames: true
        description: "Check marketplace integration code formatting with black"

      - id: type-check-marketplace-code
        name: Type Check Marketplace Integration Code
        entry: bash -c 'mypy --ignore-missing-imports --show-error-codes "$@"' --
        language: system
        types: [python]
        files: ^hub/apps/integrations/.*\.py$
        pass_filenames: true
        additional_dependencies: [django-stubs, types-redis, types-requests]
        description: "Type check marketplace integration code with mypy"

      # ── Documentation sync hooks (Phase 312.5) ─────────────────────
      - id: check-journey-doc-sync
        name: Check journey documentation sync
        entry: python scripts/check_doc_journey_marker_sync.py
        language: system
        files: (docs/USER_JOURNEYS\.md|tests/.*\.py|frontend/e2e/journeys/.*\.spec\.ts|hub/apps/.*/tests/.*\.py)
        pass_filenames: false
        description: "Verify bidirectional consistency between journey docs and test markers"

      - id: check-uc-doc-sync
        name: Check use case documentation sync
        entry: python scripts/check_doc_uc_marker_sync.py
        language: system
        files: (docs/USE_CASES\.md|tests/.*\.py|frontend/e2e/use-cases/.*\.spec\.ts|hub/apps/.*/tests/.*\.py)
        pass_filenames: false
        description: "Verify bidirectional consistency between UC docs and test markers"

