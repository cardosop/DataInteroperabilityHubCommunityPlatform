# Phase 313.4 — core-only DEV stack overlay (docker-compose.yml base).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.core.yml up -d --build
#   make quickstart   # convenience wrapper (Makefile.core)
#
# Same overlay design as docker-compose.test.core.yml: paid + optional
# services get a non-default profile so default `up` excludes them, and the
# core services pin their depends_on to core-only targets via `!reset`
# (compose deep-merges maps, so a plain list would merge instead of replace).

services:
  api-service:
    # Fresh-volume postgres initdb can outrun the settings startup probe —
    # retry until the database accepts connections (idempotent).
    restart: unless-stopped
    environment:
      HUB_CORE_ONLY: "1"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis-cache:6379/0
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_STORAGE_BUCKET_NAME: hub-files
    depends_on: !reset
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
  worker-service:
    restart: unless-stopped
    environment:
      HUB_CORE_ONLY: "1"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis-cache:6379/0
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_STORAGE_BUCKET_NAME: hub-files
    depends_on: !reset
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy

  traefik:
    depends_on: !reset
      api-service:
        condition: service_started
      frontend:
        condition: service_started

  # Paid-layer services (excluded from core)
  postgres-baas:
    profiles: ["core-excluded"]
  redis-baas:
    profiles: ["core-excluded"]
  clamav:
    profiles: ["core-excluded"]
  fuseki:
    profiles: ["core-excluded"]
  semantic-service:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  datacontract-service:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  dq-service:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  compliance-service:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  compliance-rq-worker:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  prefect-server:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  prefect-db:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  prefect-worker:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  prefect-integration-service:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  odh-training-operator:
    profiles: ["core-excluded"]
    image: busybox:latest
    build: !reset null
  odh-inference-scheduler:
    profiles: ["core-excluded"]
    image: busybox:latest
