[pytest]
# E2E test configuration
markers =
    e2e: End-to-end tests that require full stack
    slow: Tests that take a long time to run
    integration: Integration tests
    unit: Unit tests
    workflow_e2e: Workflow E2E tests (Phase 6): business rules, observability, security, error recovery, user journey, use case

# Test discovery
# testpaths removed to allow discovery from any directory
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage (if enabled)
# --cov=hub
# --cov-report=html
# --cov-report=term-missing

