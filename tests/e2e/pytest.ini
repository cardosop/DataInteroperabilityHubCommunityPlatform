[pytest]
# E2E test configuration
markers =
    e2e: End-to-end tests that require full stack
    slow: Tests that take a long time to run
    integration: Integration tests
    unit: Unit tests
    workflow_e2e: Workflow E2E tests (Phase 6): business rules, observability, security, error recovery, user journey, use case
    uc: Use case ID from USE_CASES.md (e.g. UC-AUTH-001)
    uc_journey_persona: Combined UC journey + persona marker for comprehensive persona tests
    journey: User journey ID from USER_JOURNEYS.md (e.g. JOURNEY-DPO-001)
    persona: Persona name (e.g. Data Product Owner, Data Engineer)
    e2e1: Phase 1 end-to-end tests (core operations: contracts, assets, datasets, files)
    e2e2: Phase 2 end-to-end tests (DQ, compliance, job orchestration)
    e2e3: Phase 3 end-to-end tests (email service, notifications)
    e2e4: Phase 4 end-to-end persona tests
    e2e5: Phase 5 end-to-end use-case and journey tests
    scheduled_export: Scheduled export tests
    requires_prefect: Tests requiring Prefect integration service
    requires_database: Tests requiring a live database connection
    requires_db: Tests that require database connectivity (Phase 7.2.3 replacement for requires_database)
    requires_redis: Tests requiring a live Redis connection
    docker_compose_runtime: Tests that require Docker Compose runtime (run on host, not inside container)
    saas_platform: SaaS platform tests (billing, GDPR erasure, tenant onboarding)
    allow_server_errors: Opt-out for the captured_server_errors guard (PR 4). Tests decorated with this marker may legitimately trigger Django ERROR logs — e.g. failure-path tests that assert on 500 responses.

# Test discovery
# testpaths removed to allow discovery from any directory
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-timeout: timeout applies only to test body, NOT setUp/tearDown/fixtures.
# CRITICAL: must be a direct ini key, not -o override — pytest-timeout ignores -o.
# Without this, LiveServerTestCase tests fail because the 60s timeout includes
# setUp (tenant/user creation + transaction.commit) + tearDown (TRUNCATE CASCADE),
# leaving no time for the actual test body.
timeout_func_only = true

# Output options
# --reuse-db: when TEST_DB_SUFFIX=shared, reuse hub_test_test_shared (avoids create/drop which fails when prefect-integration holds connections)
addopts =
    -v
    --tb=short
    --strict-markers
    --reuse-db

# Suppress known-harmless warnings to keep output clean.
# Real DeprecationWarning/FutureWarning from project code will still surface.
filterwarnings =
    ignore::DeprecationWarning:faker
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore:.*django\.utils\.encoding.*:DeprecationWarning
    ignore:.*DateTimeField.*naive datetime:RuntimeWarning
    # ``pyparsing.PyparsingDeprecationWarning`` was removed in pyparsing 3.x;
    # the modern equivalent is the standard ``DeprecationWarning`` class
    # filtered by the ``rdflib`` module path. Stale-class form crashed
    # pytest config parsing on Python 3.14 / pyparsing >=3.0.
    ignore::DeprecationWarning:rdflib
    ignore:.*lia.*has been renamed.*cross_web:DeprecationWarning:strawberry

# Coverage (if enabled)
# --cov=hub
# --cov-report=html
# --cov-report=term-missing

