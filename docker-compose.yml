services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub-net

  # Redis for Job Queue
  redis:
    image: redis:7-alpine
    container_name: hub-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: hub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hub-net

  # Apache Jena Fuseki (Triple Store)
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: hub-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hub-net

  # Semantic Service
  semantic-service:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-semantic
    ports:
      - "${SEMANTIC_PORT:-8081}:8081"
    environment:
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      HUB_DOMAIN: ${HUB_DOMAIN:-hub.example.com}
    volumes:
      - ./services/semantic-service:/app:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Service (Django)
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # Email Service Configuration (can be overridden in .env.dev)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:8000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Interoperability Hub}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-Data Interoperability Hub}
      # SMTP (if EMAIL_BACKEND=smtp)
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Data Interoperability Hub}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service
  worker-service:
    build:
      context: .
    environment:
      # Email Service Configuration (inherited from api-service)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:8000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Interoperability Hub}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-Data Interoperability Hub}
      # SMTP (if EMAIL_BACKEND=smtp)
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Data Interoperability Hub}
      dockerfile: services/worker/Dockerfile
    container_name: hub-worker
    # Process all priority queues: job_critical (HIGH) → job_default (NORMAL) → job_low (LOW)
    # Worker polls queues in priority order with reserved slots for HIGH priority
    # Uses services/worker/main.py which includes health check HTTP server on port 8080
    command: python services/worker/main.py job_critical job_default job_low
    ports:
      - "${WORKER_HEALTH_PORT:-8080}:8080"  # Health check endpoints (/healthz, /ready, /metrics)
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_RESERVED_SLOTS_RATIO: ${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      WORKER_STARVATION_THRESHOLD_SECONDS: ${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DataContract CLI Service
  datacontract-service:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-datacontract
    ports:
      - "${DATACONTRACT_PORT:-8080}:8080"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compliance Service
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance
    ports:
      - "${COMPLIANCE_PORT:-8082}:8082"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DQ Service
  dq-service:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-dq
    ports:
      - "${DQ_PORT:-8083}:8083"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hub-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - hub-net
    depends_on:
      - api-service
      - worker-service
      - semantic-service
      - dq-service
      - compliance-service
      - datacontract-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hub-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger (all-in-one)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # UI
      - "${JAEGER_HTTP_PORT:-14268}:14268"  # HTTP collector
      - "${JAEGER_UDP_PORT:-6831}:6831/udp"  # UDP collector
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: hub-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hub-net:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  minio-data:
  fuseki-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

