services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub-net

  # Redis Cache Instance - Response caching, contract caching, lineage caching
  redis-cache:
    image: redis:7-alpine
    container_name: hub-redis-cache
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory ${REDIS_CACHE_MAX_MEMORY:-2gb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CACHE_PORT:-6379}:6379"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CACHE_MAX_MEMORY:-2gb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # Redis Queue Instance - Job queues (RQ)
  redis-queue:
    image: redis:7-alpine
    container_name: hub-redis-queue
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-1gb}
      --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_QUEUE_PORT:-6380}:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_QUEUE_MAX_MEMORY:-1gb}
      - REDIS_MAXMEMORY_POLICY=noeviction

  # Redis Events Instance - Event bus (Pub/Sub, Streams)
  redis-events:
    image: redis:7-alpine
    container_name: hub-redis-events
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_EVENTS_PORT:-6381}:6379"
    volumes:
      - redis-events-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_EVENTS_MAX_MEMORY:-1gb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # Redis Channels Instance - WebSocket channels (Django Channels)
  redis-channels:
    image: redis:7-alpine
    container_name: hub-redis-channels
    command: >
      redis-server
      --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "${REDIS_CHANNELS_PORT:-6382}:6379"
    volumes:
      - redis-channels-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # Redis Exporter for Cache Instance
  redis-exporter-cache:
    image: oliver006/redis_exporter:latest
    container_name: hub-redis-exporter-cache
    command:
      - '--redis.addr=redis://redis-cache:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CACHE_PORT:-9121}:9121"
    networks:
      - hub-net
    depends_on:
      redis-cache:
        condition: service_healthy
    # Health check disabled - redis exporter is a minimal image without standard tools
    # Metrics endpoint verified working at http://localhost:9121/metrics
    # healthcheck:
    #   test: ["CMD", "true"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Redis Exporter for Queue Instance
  redis-exporter-queue:
    image: oliver006/redis_exporter:latest
    container_name: hub-redis-exporter-queue
    command:
      - '--redis.addr=redis://redis-queue:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_QUEUE_PORT:-9122}:9121"
    networks:
      - hub-net
    depends_on:
      redis-queue:
        condition: service_healthy
    # Health check disabled - redis exporter is a minimal image without standard tools
    # Metrics endpoint verified working at http://localhost:9121/metrics
    # healthcheck:
    #   test: ["CMD", "true"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Redis Exporter for Events Instance
  redis-exporter-events:
    image: oliver006/redis_exporter:latest
    container_name: hub-redis-exporter-events
    command:
      - '--redis.addr=redis://redis-events:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_EVENTS_PORT:-9123}:9121"
    networks:
      - hub-net
    depends_on:
      redis-events:
        condition: service_healthy
    # Health check disabled - redis exporter is a minimal image without standard tools
    # Metrics endpoint verified working at http://localhost:9121/metrics
    # healthcheck:
    #   test: ["CMD", "true"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Redis Exporter for Channels Instance
  redis-exporter-channels:
    image: oliver006/redis_exporter:latest
    container_name: hub-redis-exporter-channels
    command:
      - '--redis.addr=redis://redis-channels:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CHANNELS_PORT:-9124}:9121"
    networks:
      - hub-net
    depends_on:
      redis-channels:
        condition: service_healthy
    # Health check disabled - redis exporter is a minimal image without standard tools
    # Metrics endpoint verified working at http://localhost:9121/metrics
    # healthcheck:
    #   test: ["CMD", "true"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: hub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hub-net

  # Apache Jena Fuseki (Triple Store)
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: hub-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      FUSEKI_ENABLE_UPDATE: "true"
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hub-net

  # Semantic Service
  semantic-service:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-semantic
    ports:
      - "${SEMANTIC_PORT:-8094}:8081"
    environment:
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      HUB_DOMAIN: ${HUB_DOMAIN:-hub.example.com}
    volumes:
      - ./services/semantic-service:/app:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Service (Django)
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-api
    command: python hub/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # Email Service Configuration (can be overridden in .env.dev)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:8000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Interoperability Hub}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-Data Interoperability Hub}
      # SMTP (if EMAIL_BACKEND=smtp)
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Data Interoperability Hub}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - OPENTELEMETRY_METRICS_ENABLED=${OPENTELEMETRY_METRICS_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Marketplace Connector Configuration (can be overridden in .env.dev)
      # dados.gov.br Swagger API (NOT CKAN) - uses DADOS_GOV_BR_API_KEY
      - DADOS_GOV_BR_API_KEY=${DADOS_GOV_BR_API_KEY:-}
      # CKAN instances (demo.ckan.org, data.gov) - use CKAN_TEST_URL and CKAN_TEST_API_KEY
      # Default to demo.ckan.org if CKAN_TEST_URL not set (local CKAN instance setup is optional)
      # Note: If CKAN_TEST_URL is set to empty string in .env.dev, it will be empty here too
      - CKAN_TEST_URL=${CKAN_TEST_URL:-https://demo.ckan.org}
      - CKAN_TEST_API_KEY=${CKAN_TEST_API_KEY:-}
      # Backward compatibility (deprecated - will be removed in future version)
      - CKAN_DADOS_GOV_BR_API_KEY=${CKAN_DADOS_GOV_BR_API_KEY:-${DADOS_GOV_BR_API_KEY:-}}
      # Snowflake Data Marketplace connector configuration
      # Account identifier in orgname-accountname format (e.g., 'WCGKMGD-XC16102')
      # See: https://docs.snowflake.com/user-guide/gen-conn-config
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:-}
      - SNOWFLAKE_TOKEN=${SNOWFLAKE_TOKEN:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-}
      # Mock server for testing marketplace connectors
      - MOCK_SERVER_URL=${MOCK_SERVER_URL:-http://mock-server:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      # Test marketplace instances (optional - for testing marketplace connectors)
      mock-server:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service
  worker-service:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      # Email Service Configuration (inherited from api-service)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:8000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Interoperability Hub}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-Data Interoperability Hub}
      # SMTP (if EMAIL_BACKEND=smtp)
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Data Interoperability Hub}
      # Worker-specific configuration
      - WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT:-8080}
      - WORKER_MAX_CONCURRENCY=${WORKER_MAX_CONCURRENCY:-4}
      - WORKER_RESERVED_SLOTS_RATIO=${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      - WORKER_STARVATION_THRESHOLD_SECONDS=${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - OPENTELEMETRY_METRICS_ENABLED=${OPENTELEMETRY_METRICS_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Marketplace Connector Configuration (inherited from api-service)
      # dados.gov.br Swagger API (NOT CKAN) - uses DADOS_GOV_BR_API_KEY
      - DADOS_GOV_BR_API_KEY=${DADOS_GOV_BR_API_KEY:-}
      # CKAN instances (demo.ckan.org, data.gov) - use CKAN_TEST_URL and CKAN_TEST_API_KEY
      # Default to demo.ckan.org if CKAN_TEST_URL not set (local CKAN instance setup is optional)
      # Note: If CKAN_TEST_URL is set to empty string in .env.dev, it will be empty here too
      - CKAN_TEST_URL=${CKAN_TEST_URL:-https://demo.ckan.org}
      - CKAN_TEST_API_KEY=${CKAN_TEST_API_KEY:-}
      # Backward compatibility (deprecated - will be removed in future version)
      - CKAN_DADOS_GOV_BR_API_KEY=${CKAN_DADOS_GOV_BR_API_KEY:-${DADOS_GOV_BR_API_KEY:-}}
      # Snowflake Data Marketplace connector configuration
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:-}
      - SNOWFLAKE_TOKEN=${SNOWFLAKE_TOKEN:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-}
      # Mock server for testing marketplace connectors
      - MOCK_SERVER_URL=${MOCK_SERVER_URL:-http://mock-server:8080}
    container_name: hub-worker
    # Process all priority queues: job_critical (HIGH) → job_default (NORMAL) → job_low (LOW)
    # Worker polls queues in priority order with reserved slots for HIGH priority
    # Uses services/worker/main.py which includes health check HTTP server on port 8080
    command: python services/worker/main.py job_critical job_default job_low
    ports:
      - "${WORKER_HEALTH_PORT:-8092}:8080"  # Health check endpoints (/healthz, /ready, /metrics) - Changed from 8080 to avoid conflict with traefik
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      # Test marketplace instances (optional - for testing marketplace connectors)
      mock-server:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Workflow Engine Service
  workflow-engine-service:
    build:
      context: .
      dockerfile: services/workflow-engine/Dockerfile
    environment:
      # Database configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
      # Redis configuration
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Workflow engine configuration
      - WORKFLOW_ENGINE_HEALTH_PORT=${WORKFLOW_ENGINE_HEALTH_PORT:-8088}
      - WORKFLOW_ENGINE_POLL_INTERVAL=${WORKFLOW_ENGINE_POLL_INTERVAL:-5}
      - WORKFLOW_ENGINE_BATCH_SIZE=${WORKFLOW_ENGINE_BATCH_SIZE:-10}
      # Django settings
      - DJANGO_SETTINGS_MODULE=hub.settings
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - OPENTELEMETRY_METRICS_ENABLED=${OPENTELEMETRY_METRICS_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    container_name: hub-workflow-engine
    # Process workflows continuously (polls for DRAFT and RUNNING workflows)
    # Uses services/workflow-engine/main.py which includes health check HTTP server on port 8088
    command: python services/workflow-engine/main.py --poll-interval ${WORKFLOW_ENGINE_POLL_INTERVAL:-5} --batch-size ${WORKFLOW_ENGINE_BATCH_SIZE:-10}
    ports:
      - "${WORKFLOW_ENGINE_HEALTH_PORT:-8088}:8088"  # Health check endpoints (/healthz, /ready, /metrics)
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DataContract CLI Service
  datacontract-service:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-datacontract
    ports:
      - "${DATACONTRACT_PORT:-8082}:8080"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compliance Service
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance
    ports:
      - "${COMPLIANCE_PORT:-8084}:8082"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DQ Service
  dq-service:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-dq
    ports:
      - "${DQ_PORT:-8083}:8083"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prefect Server
  prefect-server:
    build:
      context: .
      dockerfile: services/prefect-server/Dockerfile
    container_name: hub-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect}@prefect-db:5432/prefect
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
    ports:
      - "${PREFECT_SERVER_PORT:-4200}:4200"
      - "${PREFECT_UI_PORT:-4201}:4201"
    volumes:
      - prefect-server-data:/root/.prefect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
      - hub-net

  # Prefect Database (PostgreSQL)
  prefect-db:
    image: postgres:16-alpine
    container_name: hub-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect}
      POSTGRES_DB: prefect
    ports:
      - "${PREFECT_DB_PORT:-5433}:5432"
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub-net

  # Prefect Workers
  prefect-worker:
    image: prefecthq/prefect:2-python3.12
    container_name: hub-prefect-worker
    command: prefect worker start --pool ${PREFECT_WORKER_POOL:-default} --type process
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
    volumes:
      - ./services/prefect-integration:/app:ro
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prefect Integration Service
  prefect-integration-service:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile
    container_name: hub-prefect-integration
    ports:
      - "${PREFECT_INTEGRATION_PORT:-8093}:8084"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Search Service
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: hub-search
    ports:
      - "${SEARCH_PORT:-8085}:8085"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEARCH_INDEX_UPDATE_INTERVAL_SECONDS: ${SEARCH_INDEX_UPDATE_INTERVAL_SECONDS:-60}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Observability Service
  observability-service:
    build:
      context: .
      dockerfile: services/observability-service/Dockerfile
    container_name: hub-observability
    ports:
      - "${OBSERVABILITY_PORT:-8086}:8086"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      PROMETHEUS_URL: http://prometheus:9090
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      METRICS_UPDATE_INTERVAL_SECONDS: ${METRICS_UPDATE_INTERVAL_SECONDS:-60}
      FRESHNESS_CHECK_INTERVAL_SECONDS: ${FRESHNESS_CHECK_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Webhook Service
  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: hub-webhook
    ports:
      - "${WEBHOOK_PORT:-8087}:8087"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WEBHOOK_RETRY_MAX_ATTEMPTS: ${WEBHOOK_RETRY_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF_SECONDS: ${WEBHOOK_RETRY_BACKOFF_SECONDS:-1,5,30,300,1800}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway Service
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: hub-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8088}:8088"
    environment:
      # Database configuration (for Django ORM access)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
      # Redis configuration
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_URL=redis://redis-cache:6379/0
      # Django settings
      - DJANGO_SETTINGS_MODULE=hub.settings
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Service configuration
      - BACKEND_SERVICE_URL=${BACKEND_SERVICE_URL:-http://api-service:8000}
      - PORT=8088
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      api-service:
        condition: service_started
      jaeger:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Event Bus Health Service
  event-bus-health-service:
    build:
      context: .
      dockerfile: services/event-bus/Dockerfile
    container_name: hub-event-bus-health
    ports:
      - "${EVENT_BUS_HEALTH_PORT:-8090}:8090"
    environment:
      # Database configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
      # Redis configuration
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Event bus configuration
      - EVENT_BUS_REDIS_POOL_SIZE=${EVENT_BUS_REDIS_POOL_SIZE:-50}
      - EVENT_BUS_REDIS_MAX_CONNECTIONS=${EVENT_BUS_REDIS_MAX_CONNECTIONS:-100}
      - EVENT_BUS_REDIS_SOCKET_TIMEOUT=${EVENT_BUS_REDIS_SOCKET_TIMEOUT:-5}
      - EVENT_BUS_REDIS_SOCKET_CONNECT_TIMEOUT=${EVENT_BUS_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      - EVENT_BUS_REDIS_RETRY_ON_TIMEOUT=${EVENT_BUS_REDIS_RETRY_ON_TIMEOUT:-true}
      - EVENT_BUS_REDIS_HEALTH_CHECK_INTERVAL=${EVENT_BUS_REDIS_HEALTH_CHECK_INTERVAL:-30}
      - EVENT_BUS_HEALTH_CHECK_INTERVAL=${EVENT_BUS_HEALTH_CHECK_INTERVAL:-30}
      - EVENT_BUS_CHANNEL_PREFIX=${EVENT_BUS_CHANNEL_PREFIX:-events}
      - EVENT_BUS_ENABLE_PERSISTENCE=${EVENT_BUS_ENABLE_PERSISTENCE:-true}
      - EVENT_BUS_MAX_RETRIES=${EVENT_BUS_MAX_RETRIES:-3}
      # Django settings
      - DJANGO_SETTINGS_MODULE=hub.settings
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Service configuration
      - EVENT_BUS_HEALTH_PORT=${EVENT_BUS_HEALTH_PORT:-8090}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Event Schema Registry Service
  event-schema-registry-service:
    build:
      context: .
      dockerfile: services/event-schema-registry/Dockerfile
    container_name: hub-event-schema-registry
    ports:
      - "${EVENT_SCHEMA_REGISTRY_PORT:-8091}:8091"
    environment:
      # Database configuration (for potential future schema persistence)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
      # Django settings
      - DJANGO_SETTINGS_MODULE=hub.settings
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Service configuration
      - EVENT_SCHEMA_REGISTRY_PORT=${EVENT_SCHEMA_REGISTRY_PORT:-8091}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Workflow Registry Service
  workflow-registry-service:
    build:
      context: .
      dockerfile: services/workflow-registry/Dockerfile
    container_name: hub-workflow-registry
    ports:
      - "${WORKFLOW_REGISTRY_PORT:-8089}:8089"
    environment:
      # Database configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
      # Django settings
      - DJANGO_SETTINGS_MODULE=hub.settings
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Service configuration
      - WORKFLOW_REGISTRY_PORT=${WORKFLOW_REGISTRY_PORT:-8089}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hub-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - hub-net
    depends_on:
      - api-service
      - worker-service
      - semantic-service
      - dq-service
      - compliance-service
      - datacontract-service
      - prefect-integration-service
      - search-service
      - webhook-service
      - api-gateway
      - workflow-engine-service
      - workflow-registry-service
      - event-schema-registry-service
      - event-bus-health-service
      - redis-exporter-cache
      - redis-exporter-queue
      - redis-exporter-events
      - redis-exporter-channels
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hub-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger (all-in-one)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # UI
      - "${JAEGER_HTTP_PORT:-14268}:14268"  # HTTP collector
      - "${JAEGER_UDP_PORT:-6831}:6831/udp"  # UDP collector
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: hub-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CKAN Test Instance - Local CKAN server for testing marketplace connectors
  # NOTE: CKAN setup is complex and requires custom Docker image or manual setup
  # For now, we provide the infrastructure (DB, Solr, Redis) but CKAN instance
  # should be set up separately or use external CKAN instance (demo.ckan.org)
  # Uncomment and configure when CKAN Docker image is available
  # ckan-test:
  #   image: <ckan-image>
  #   container_name: hub-ckan-test
  #   environment:
  #     - CKAN_SQLALCHEMY_URL=postgresql://ckan:ckan@ckan-test-db:5432/ckan_test
  #     - CKAN_DATASTORE_WRITE_URL=postgresql://ckan:ckan@ckan-test-db:5432/datastore_test
  #     - CKAN_DATASTORE_READ_URL=postgresql://datastore_ro:datastore_ro@ckan-test-db:5432/datastore_test
  #     - CKAN_SOLR_URL=http://ckan-test-solr:8983/solr/ckan
  #     - CKAN_REDIS_URL=redis://ckan-test-redis:6379/1
  #     - CKAN_SITE_URL=http://localhost:${CKAN_TEST_PORT:-5000}
  #     - CKAN_MAX_UPLOAD_SIZE_MB=500
  #     - CKAN_PLUGINS=stats text_view image_view recline_view datastore datapusher
  #   ports:
  #     - "${CKAN_TEST_PORT:-5000}:5000"
  #   volumes:
  #     - ckan-test-storage:/var/lib/ckan
  #   depends_on:
  #     ckan-test-db:
  #       condition: service_healthy
  #     ckan-test-solr:
  #       condition: service_healthy
  #     ckan-test-redis:
  #       condition: service_healthy
  #   networks:
  #     - hub-net
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5000/api/3/action/status_show"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

  # CKAN Test Database - PostgreSQL for CKAN test instance
  ckan-test-db:
    image: postgres:16-alpine
    container_name: hub-ckan-test-db
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ckan
      POSTGRES_DB: ckan_test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${CKAN_TEST_DB_PORT:-5434}:5432"
    volumes:
      - ckan-test-db-data:/var/lib/postgresql/data
      - ./scripts/init-ckan-db.sh:/docker-entrypoint-initdb.d/init-ckan-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan -d ckan_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub-net

  # CKAN Test Solr - Search engine for CKAN test instance
  ckan-test-solr:
    image: solr:9
    container_name: hub-ckan-test-solr
    command:
      - solr-precreate
      - ckan
    ports:
      - "${CKAN_TEST_SOLR_PORT:-8983}:8983"
    volumes:
      - ckan-test-solr-data:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hub-net

  # CKAN Test Redis - Cache for CKAN test instance
  ckan-test-redis:
    image: redis:7-alpine
    container_name: hub-ckan-test-redis
    command: redis-server --appendonly yes
    ports:
      - "${CKAN_TEST_REDIS_PORT:-6383}:6379"
    volumes:
      - ckan-test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net

  # Mock Server - HTTP mock server for testing marketplace connectors
  # Provides REST API endpoints for testing without external dependencies
  mock-server:
    image: mockserver/mockserver:latest
    container_name: hub-mock-server
    command: -serverPort 8080 -logLevel INFO
    ports:
      - "${MOCK_SERVER_PORT:-8095}:8080"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/mockserver/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ODH Training Operator Service
  odh-training-operator:
    build:
      context: .
      dockerfile: services/odh-training-operator/Dockerfile
    container_name: hub-odh-training-operator
    ports:
      - "${ODH_TRAINING_OPERATOR_PORT:-8096}:8080"
    networks:
      - hub-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ODH Inference Scheduler Service
  odh-inference-scheduler:
    build:
      context: .
      dockerfile: services/odh-inference-scheduler/Dockerfile
    container_name: hub-odh-inference-scheduler
    ports:
      - "${ODH_INFERENCE_SCHEDULER_PORT:-8097}:8080"
    networks:
      - hub-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Traefik API Gateway
  traefik:
    image: traefik:v3.0
    container_name: hub-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=false"
      # Docker provider disabled due to API version incompatibility with Traefik v3.0
      # Use file-based configuration in ./infrastructure/traefik/dynamic/ instead
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hub.example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--metrics.prometheus=true"
    ports:
      - "${TRAEFIK_PORT:-8080}:80"
      - "${TRAEFIK_SECURE_PORT:-8443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - hub-net
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/rawdata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.hub.local`)"
      - "traefik.http.routers.traefik.service=api@internal"

networks:
  hub-net:
    driver: bridge

volumes:
  pgdata:
  redis-cache-data:
  redis-queue-data:
  redis-events-data:
  redis-channels-data:
  minio-data:
  fuseki-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  prefect-server-data:
  prefect-db-data:
  traefik-letsencrypt:
  ckan-test-storage:
  ckan-test-db-data:
  ckan-test-solr-data:
  ckan-test-redis-data:

