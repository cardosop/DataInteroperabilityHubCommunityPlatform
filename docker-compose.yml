services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Allow non-SSL connections so Django and other services can connect; init runs only on first init
      - ./infrastructure/postgres/02-pg-hba-host.sh:/docker-entrypoint-initdb.d/02-pg-hba-host.sh:ro
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c shared_buffers=256MB
      -c maintenance_work_mem=256MB
      -c checkpoint_flush_after=256kB
      -c wal_compression=on
      -c max_connections=200
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - hub-net

  # PostgreSQL Read Replica (Phase 17.5)
  # Streaming-replication slave of the 'postgres' primary via bitnami/postgresql.
  # Django PrimaryReplicaRouter routes reads for assets/contracts/marketplace/
  # search to this replica when DATABASE_REPLICA_URL is set.
  # Opt-in profile: docker compose --profile replica up postgres-replica
  # For production use the AWS RDS Multi-AZ replica endpoint instead.
  postgres-replica:
    image: bitnami/postgresql:16
    container_name: hub-postgres-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - hub-net
    profiles:
      - replica

  # Redis Cache Instance - Response caching, contract caching, lineage caching
  redis-cache:
    image: redis:7-alpine
    container_name: hub-redis-cache
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory ${REDIS_CACHE_MAX_MEMORY:-2gb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6379}:6379"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CACHE_MAX_MEMORY:-2gb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # Redis Queue Instance - Job queues (RQ)
  redis-queue:
    image: redis:7-alpine
    container_name: hub-redis-queue
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-1gb}
      --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "127.0.0.1:${REDIS_QUEUE_PORT:-6380}:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_QUEUE_MAX_MEMORY:-1gb}
      - REDIS_MAXMEMORY_POLICY=noeviction

  # Redis Events Instance - Event bus (Pub/Sub, Streams)
  redis-events:
    image: redis:7-alpine
    container_name: hub-redis-events
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "127.0.0.1:${REDIS_EVENTS_PORT:-6381}:6379"
    volumes:
      - redis-events-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_EVENTS_MAX_MEMORY:-1gb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # Redis Channels Instance - WebSocket channels (Django Channels)
  redis-channels:
    image: redis:7-alpine
    container_name: hub-redis-channels
    command: >
      redis-server
      --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511}
      --timeout ${REDIS_TIMEOUT:-300}
      --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}
    ports:
      - "127.0.0.1:${REDIS_CHANNELS_PORT:-6382}:6379"
    volumes:
      - redis-channels-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - hub-net
    environment:
      - REDIS_MAX_MEMORY=${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      - REDIS_MAXMEMORY_POLICY=allkeys-lru

  # BaaS dedicated Postgres (optional; set BAAS_DATABASE_URL to use)
  postgres-baas:
    image: postgres:16-alpine
    container_name: hub-postgres-baas
    environment:
      POSTGRES_USER: ${BAAS_POSTGRES_USER:-hub_baas}
      POSTGRES_PASSWORD: ${BAAS_POSTGRES_PASSWORD:-hub_baas}
      POSTGRES_DB: ${BAAS_POSTGRES_DB:-baas}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "127.0.0.1:${BAAS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-baas-data:/var/lib/postgresql/data
    command: postgres -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BAAS_POSTGRES_USER:-hub_baas} -d ${BAAS_POSTGRES_DB:-baas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hub-net

  # BaaS dedicated Redis (optional; set BAAS_REDIS_URL to use)
  redis-baas:
    image: redis:7-alpine
    container_name: hub-redis-baas
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${BAAS_REDIS_PORT:-6383}:6379"
    volumes:
      - redis-baas-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net

  # Redis Exporter for Cache Instance
  redis-exporter-cache:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-redis-exporter-cache
    command:
      - '--redis.addr=redis://redis-cache:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CACHE_PORT:-9121}:9121"
    networks:
      - hub-net
    depends_on:
      redis-cache:
        condition: service_healthy
    # No healthcheck: oliver006/redis_exporter:v1.66.0 is scratch (no shell/true), so CMD true fails. Status shows "Up" only.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'

  # Redis Exporter for Queue Instance
  redis-exporter-queue:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-redis-exporter-queue
    command:
      - '--redis.addr=redis://redis-queue:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_QUEUE_PORT:-9122}:9121"
    networks:
      - hub-net
    depends_on:
      redis-queue:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'

  # Redis Exporter for Events Instance
  redis-exporter-events:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-redis-exporter-events
    command:
      - '--redis.addr=redis://redis-events:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_EVENTS_PORT:-9123}:9121"
    networks:
      - hub-net
    depends_on:
      redis-events:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'

  # Redis Exporter for Channels Instance
  redis-exporter-channels:
    image: oliver006/redis_exporter:v1.66.0
    container_name: hub-redis-exporter-channels
    command:
      - '--redis.addr=redis://redis-channels:6379'
      - '--include-system-metrics'
    ports:
      - "${REDIS_EXPORTER_CHANNELS_PORT:-9124}:9121"
    networks:
      - hub-net
    depends_on:
      redis-channels:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hub-net

  # ClamAV daemon (Phase 203 — malware scanning for uploaded files).
  # Needs ~2GB RAM while loading signature DB; persist DB to avoid long cold starts.
  clamav:
    image: clamav/clamav:1.5
    container_name: hub-clamav
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    # Phase 277.B.021 — clamd VERSION probe (D260.4).
    # The TCP socket probe only checks the port is open; VERSION
    # confirms clamd actually responds to commands.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo zVERSION | nc -w 2 127.0.0.1 3310 | grep -q 'ClamAV'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - hub-net

  # Apache Jena Fuseki (Triple Store)
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in .env}
      FUSEKI_ENABLE_UPDATE: "true"
      # Phase 27: increased heap for named-graph index growth + SHACL validation
      JVM_ARGS: "-Xmx2g -Xms512m -XX:+UseG1GC"
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki
      # Phase 27: canonical config from infrastructure/fuseki/
      - ./infrastructure/fuseki/config.ttl:/fuseki/configuration/hub.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping | grep -q '\"status\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hub-net

  # Semantic Service
  semantic-service:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-semantic
    ports:
      - "${SEMANTIC_PORT:-8081}:8081"
    environment:
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in .env}
      HUB_DOMAIN: ${HUB_DOMAIN:-hub.example.com}
    volumes:
      - ./services/semantic-service:/app:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

  # API Service (Django)
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-api
    command: >
      sh -c "python hub/manage.py migrate --noinput &&
             python hub/manage.py seed_default_plans &&
             exec uvicorn hub.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # Brand (default: Meshant)
      - APP_NAME=${APP_NAME:-Meshant}
      # Email Service Configuration (can be overridden in .env.dev)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      # Default to frontend container port mapping for clickable links (password reset, invitations)
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:3000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      # SMTP (if EMAIL_BACKEND=smtp). For local E2E password-reset, use MailHog: SMTP_HOST=mailhog SMTP_PORT=1025 SMTP_USE_TLS=false
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - OPENTELEMETRY_METRICS_ENABLED=${OPENTELEMETRY_METRICS_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Marketplace Connector Configuration (can be overridden in .env.dev)
      # dados.gov.br Swagger API (NOT CKAN) - uses DADOS_GOV_BR_API_KEY
      - DADOS_GOV_BR_API_KEY=${DADOS_GOV_BR_API_KEY:-}
      # CKAN instances (demo.ckan.org, data.gov) - use CKAN_TEST_URL and CKAN_TEST_API_KEY
      # Default to demo.ckan.org if CKAN_TEST_URL not set (local CKAN instance setup is optional)
      # Note: If CKAN_TEST_URL is set to empty string in .env.dev, it will be empty here too
      - CKAN_TEST_URL=${CKAN_TEST_URL:-https://demo.ckan.org}
      - CKAN_TEST_API_KEY=${CKAN_TEST_API_KEY:-}
      # Backward compatibility (deprecated - will be removed in future version)
      - CKAN_DADOS_GOV_BR_API_KEY=${CKAN_DADOS_GOV_BR_API_KEY:-${DADOS_GOV_BR_API_KEY:-}}
      # Snowflake Data Marketplace connector configuration
      # Account identifier in orgname-accountname format (e.g., 'WCGKMGD-XC16102')
      # See: https://docs.snowflake.com/user-guide/gen-conn-config
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:-}
      - SNOWFLAKE_TOKEN=${SNOWFLAKE_TOKEN:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-}
      # Mock server for testing marketplace connectors
      - MOCK_SERVER_URL=${MOCK_SERVER_URL:-http://mock-server:8080}
      # Redis configuration (explicit URLs for Docker service names)
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - REDIS_EVENTS_URL=redis://redis-events:6379/0
      - REDIS_CHANNELS_URL=redis://redis-channels:6379/0
      # Legacy REDIS_URL for backward compatibility
      - REDIS_URL=redis://redis-cache:6379/0
      # ClamAV (Phase 203 — file malware scan; RQ job on worker reads from MinIO and talks to clamd)
      - CLAMAV_ENABLED=${CLAMAV_ENABLED:-true}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      # BaaS dedicated instances (optional; leave unset to use main DB/Redis). See docs/runbooks/BAAS_INFRASTRUCTURE.md
      - BAAS_DATABASE_URL=${BAAS_DATABASE_URL:-}
      - BAAS_REDIS_URL=${BAAS_REDIS_URL:-}
      # Prefect Integration Service URL (for scheduled ingestion/export deployment sync and trigger)
      - PREFECT_INTEGRATION_SERVICE_URL=${PREFECT_INTEGRATION_SERVICE_URL:-http://prefect-integration-service:8084}
      # Compliance Service URL (explicit so api-service can reach compliance-service by Docker network hostname)
      - COMPLIANCE_SERVICE_URL=http://compliance-service:8082
      # Phase 26: Supported spec versions
      - ODCS_VERSIONS_SUPPORTED=2.2.2,3.0.0,3.0.1,3.0.2,3.1.0
      - ODPS_VERSIONS_SUPPORTED=1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0
      - HUBCONTRACT_BACKFILL_BATCH_SIZE=200
      # E2E: set RATE_LIMIT_E2E_RELAX=true when running Playwright E2E against this API
      # so auth rate limit uses 20/min (platform max) instead of 5/min
      - RATE_LIMIT_E2E_RELAX=${RATE_LIMIT_E2E_RELAX:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      # Test marketplace instances (optional - mock-server has no healthcheck)
      mock-server:
        condition: service_started
    networks:
      - hub-net
    healthcheck:
      # Liveness: /health/live/ always 200 if process is up; use /health/ for readiness (DB+Redis)
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512m

  # MailHog (local email capture for dev/test)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hub-mailhog
    ports:
      - "8025:8025" # UI + HTTP API
      - "1025:1025" # SMTP
    networks:
      - hub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Meshant}
        VITE_FEATURE_TOAST_ENABLED: ${VITE_FEATURE_TOAST_ENABLED:-}
        VITE_FEATURE_BREADCRUMBS_ENABLED: ${VITE_FEATURE_BREADCRUMBS_ENABLED:-}
        VITE_FEATURE_RESOURCE_PICKERS_ENABLED: ${VITE_FEATURE_RESOURCE_PICKERS_ENABLED:-}
        VITE_FEATURE_SIDEBAR_ADVANCED: ${VITE_FEATURE_SIDEBAR_ADVANCED:-}
        # Empty by default: app uses relative /api/v1 paths proxied by nginx.
        # Set to an absolute URL only for non-nginx deployments (e.g. CDN-hosted SPA).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_MVP_MODE: ${VITE_MVP_MODE:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_USE_PUBLIC_DNS: ${NPM_USE_PUBLIC_DNS:-0}
    container_name: hub-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_ENV=${ENV:-development}
      # Passed to envsubst in nginx template so the CSP connect-src can include
      # an external API origin when the API is not co-hosted by this nginx.
      # Leave empty (default) for the standard deployment where /api is proxied.
      - API_HOST=${API_HOST:-}
    networks:
      - hub-net
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 and CMD-SHELL so busybox wget works reliably; nginx serves on port 80
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Worker Service
  worker-service:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      # Brand (default: Meshant)
      - APP_NAME=${APP_NAME:-Meshant}
      # Email Service Configuration (inherited from api-service)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:-http://localhost:3000}
      - EMAIL_JOB_NOTIFICATIONS_ENABLED=${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      # SendGrid (if EMAIL_BACKEND=sendgrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      # AWS SES (if EMAIL_BACKEND=ses)
      - AWS_SES_REGION=${AWS_SES_REGION:-}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      # SMTP (if EMAIL_BACKEND=smtp). For local E2E password-reset, use MailHog: SMTP_HOST=mailhog SMTP_PORT=1025 SMTP_USE_TLS=false
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      # Worker-specific configuration
      - WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT:-8080}
      - WORKER_MAX_CONCURRENCY=${WORKER_MAX_CONCURRENCY:-4}
      - WORKER_RESERVED_SLOTS_RATIO=${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      - WORKER_STARVATION_THRESHOLD_SECONDS=${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      # OpenTelemetry configuration
      - OPENTELEMETRY_ENABLED=${OPENTELEMETRY_ENABLED:-true}
      - OPENTELEMETRY_METRICS_ENABLED=${OPENTELEMETRY_METRICS_ENABLED:-true}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST:-jaeger}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT:-6831}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Marketplace Connector Configuration (inherited from api-service)
      # dados.gov.br Swagger API (NOT CKAN) - uses DADOS_GOV_BR_API_KEY
      - DADOS_GOV_BR_API_KEY=${DADOS_GOV_BR_API_KEY:-}
      # CKAN instances (demo.ckan.org, data.gov) - use CKAN_TEST_URL and CKAN_TEST_API_KEY
      # Default to demo.ckan.org if CKAN_TEST_URL not set (local CKAN instance setup is optional)
      # Note: If CKAN_TEST_URL is set to empty string in .env.dev, it will be empty here too
      - CKAN_TEST_URL=${CKAN_TEST_URL:-https://demo.ckan.org}
      - CKAN_TEST_API_KEY=${CKAN_TEST_API_KEY:-}
      # Backward compatibility (deprecated - will be removed in future version)
      - CKAN_DADOS_GOV_BR_API_KEY=${CKAN_DADOS_GOV_BR_API_KEY:-${DADOS_GOV_BR_API_KEY:-}}
      # Snowflake Data Marketplace connector configuration
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:-}
      - SNOWFLAKE_TOKEN=${SNOWFLAKE_TOKEN:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-}
      # Mock server for testing marketplace connectors
      - MOCK_SERVER_URL=${MOCK_SERVER_URL:-http://mock-server:8080}
      # ClamAV (Phase 203 — malware scan jobs on job_default)
      - CLAMAV_ENABLED=${CLAMAV_ENABLED:-true}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      # Compliance Service URL (explicit so worker can reach compliance-service by Docker network hostname)
      - COMPLIANCE_SERVICE_URL=http://compliance-service:8082
      # Phase 26: backfill batch size for renormalize_contracts_v310 task
      - HUBCONTRACT_BACKFILL_BATCH_SIZE=200
    container_name: hub-worker
    # Process all priority queues: job_critical (HIGH) → job_default (NORMAL) → job_low (LOW)
    # Worker polls queues in priority order with reserved slots for HIGH priority
    # Uses services/worker/main.py which includes health check HTTP server on port 8080
    # Include 'default' to drain legacy jobs enqueued before compliance fix (job_critical routing)
    command: python services/worker/main.py job_critical job_default job_low default
    ports:
      - "${WORKER_HEALTH_PORT:-8092}:8080"  # Health check endpoints (/healthz, /ready, /metrics) - Changed from 8080 to avoid conflict with traefik
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      clamav:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
      # Test marketplace instances (optional - mock-server has no healthcheck)
      mock-server:
        condition: service_started
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
  # DataContract CLI Service
  datacontract-service:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-datacontract
    ports:
      - "${DATACONTRACT_PORT:-8080}:8080"
    networks:
      - hub-net
    environment:
      - ODCS_VERSIONS_SUPPORTED=2.2.2,3.0.0,3.0.1,3.0.2,3.1.0
      - ODPS_VERSIONS_SUPPORTED=1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compliance Service
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance
    ports:
      - "${COMPLIANCE_PORT:-8082}:8082"
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      # shared/auth.py calls _load_key_at_startup() at module import time and
      # raises ValueError immediately if this var is absent — the container
      # crashes before accepting connections.  A predictable dev default is
      # acceptable here; staging/production must inject the real secret.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      # Phase 19.14.1 — async scan worker configuration
      # REDIS_QUEUE_URL must point to the same Redis instance that the hub
      # worker reads from (redis-queue:6379/0) so jobs enqueued by the API
      # are picked up by the same broker the compliance-service monitors.
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      # Number of concurrent threads used for in-process PII scans.
      # Mirrors COMPLIANCE_WORKER_THREADS; set to 4 for dev parity with test.
      COMPLIANCE_SCANNER_WORKERS: "4"
    depends_on:
      redis-queue:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # Compliance RQ Worker — Phase 19.14.1
  # Processes async scan jobs from the 'compliance-scan' Redis queue.
  # Jobs are enqueued by compliance-service's POST /scan-file-async endpoint
  # and results are stored in Redis for retrieval via GET /scan-result/{job_id}.
  compliance-rq-worker:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-compliance-rq-worker
    command: ["rq", "worker", "compliance-scan", "--url", "redis://redis-queue:6379/0"]
    networks:
      - hub-net
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      COMPLIANCE_WORKER_THREADS: "4"
    depends_on:
      redis-queue:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # DQ Service
  dq-service:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-dq
    ports:
      - "${DQ_PORT:-8083}:8083"
    environment:
      PYTHONPATH: /app
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 256m

  # Prefect Server
  prefect-server:
    build:
      context: .
      dockerfile: services/prefect-server/Dockerfile
    container_name: hub-prefect-server
    command: sh -c "prefect server database upgrade -y 2>/dev/null || true; exec prefect server start --host 0.0.0.0"
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect}@prefect-db:5432/prefect
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      # Redis messaging (Prefect 3 recommended for scaling)
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis-queue
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    ports:
      - "${PREFECT_SERVER_PORT:-4200}:4200"
      - "${PREFECT_UI_PORT:-4201}:4201"
    volumes:
      - prefect-server-data:/root/.prefect
    healthcheck:
      # Prefect 3 exposes health at /api/health (not /health)
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      prefect-db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hub-net

  # Prefect Database (PostgreSQL)
  prefect-db:
    image: postgres:16-alpine
    container_name: hub-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect}
      POSTGRES_DB: prefect
    ports:
      - "${PREFECT_DB_PORT:-5433}:5432"
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
      - ./infrastructure/prefect-db/01-pgcrypto.sql:/docker-entrypoint-initdb.d/01-pgcrypto.sql:ro
      # Allow non-SSL connections so Prefect (asyncpg) can connect; init runs only on first init
      - ./infrastructure/prefect-db/02-pg-hba-host.sh:/docker-entrypoint-initdb.d/02-pg-hba-host.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    networks:
      - hub-net

  # Prefect Worker — local development (Phase 17.9)
  #
  # Uses the PROCESS work pool type (`--type process`).
  # Flow runs execute as subprocesses inside this container, which means:
  #   - No Docker-in-Docker required (no /var/run/docker.sock mount)
  #   - No Docker SDK dependency
  #   - Works identically whether the host is Linux, macOS, or CI
  #
  # Production distinction:
  #   In production (Kubernetes) the worker uses `--type kubernetes` via the
  #   Helm chart (helm/templates/prefect/worker-deployment.yaml, Phase 17.8).
  #   The kubernetes work pool submits flow runs as K8s Jobs/Pods.
  #   The process work pool is local-dev only.
  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: hub-prefect-worker
    # Create the local-process-pool work pool (idempotent) then start the worker.
    command: >
      sh -c "prefect work-pool create --type process ${PREFECT_WORK_POOL_NAME:-local-process-pool}
      2>/dev/null || true;
      exec prefect worker start
      --pool ${PREFECT_WORK_POOL_NAME:-local-process-pool}
      --type process"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL_NAME: ${PREFECT_WORK_POOL_NAME:-local-process-pool}
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      HUB_BASE_URL: ${HUB_BASE_URL:-http://api-service:8000}
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-}
      # K8s-style resource env vars (no-op for process pool; used by deployment_sync)
      PREFECT_K8S_NAMESPACE: ${PREFECT_K8S_NAMESPACE:-default}
      PREFECT_K8S_CPU_REQUEST: ${PREFECT_K8S_CPU_REQUEST:-100m}
      PREFECT_K8S_CPU_LIMIT: ${PREFECT_K8S_CPU_LIMIT:-1000m}
      PREFECT_K8S_MEMORY_REQUEST: ${PREFECT_K8S_MEMORY_REQUEST:-256Mi}
      PREFECT_K8S_MEMORY_LIMIT: ${PREFECT_K8S_MEMORY_LIMIT:-1Gi}
    volumes:
      - ./services/prefect-integration:/app:ro
    depends_on:
      prefect-server:
        condition: service_healthy
      api-service:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prefect Integration Service (uses Django ORM; needs project root and hub)
  prefect-integration-service:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile
    container_name: hub-prefect-integration
    command: sh -c "cd /app/services/prefect-integration && PYTHONPATH=/app python -m uvicorn main:app --host 0.0.0.0 --port 8084"
    ports:
      - "${PREFECT_INTEGRATION_PORT:-8084}:8084"
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}
      DJANGO_SETTINGS_MODULE: hub.settings
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      REDIS_EVENTS_URL: redis://redis-events:6379/0
      REDIS_CHANNELS_URL: redis://redis-channels:6379/0
      REDIS_URL: redis://redis-cache:6379/0
      # Hub Worker API configuration (for scheduled ingestion/export flows)
      # Note: HUB_BASE_URL should be base URL without /api/v1 (HubClient adds paths)
      HUB_BASE_URL: http://api-service:8000
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-H0QBuCJZpGEohZNSqkW-bHvAASgAwhf60UEDLe6XQtg}
      # Prefect deployment image (required for creating deployments)
      PREFECT_DEPLOYMENT_IMAGE: ${PREFECT_DEPLOYMENT_IMAGE:-hub-dev-prefect-integration:latest}
      # Prefect work pool (use docker-pool for Docker image deployments)
      PREFECT_WORK_POOL_NAME: ${PREFECT_WORK_POOL_NAME:-docker-pool}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hub-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - hub-net
    depends_on:
      - api-service
      - worker-service
      - semantic-service
      - dq-service
      - compliance-service
      - datacontract-service
      - prefect-integration-service
      - redis-exporter-cache
      - redis-exporter-queue
      - redis-exporter-events
      - redis-exporter-channels
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Grafana
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hub-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Jaeger (all-in-one)
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    container_name: hub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # UI
      - "${JAEGER_HTTP_PORT:-14268}:14268"  # HTTP collector
      - "${JAEGER_UDP_PORT:-6831}:6831/udp"  # UDP collector
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hub-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - hub-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # CKAN Test Instance - Local CKAN server for testing marketplace connectors
  # NOTE: CKAN setup is complex and requires custom Docker image or manual setup
  # For now, we provide the infrastructure (DB, Solr, Redis) but CKAN instance
  # should be set up separately or use external CKAN instance (demo.ckan.org)
  # Uncomment and configure when CKAN Docker image is available
  # ckan-test:
  #   image: <ckan-image>
  #   container_name: hub-ckan-test
  #   environment:
  #     - CKAN_SQLALCHEMY_URL=postgresql://ckan:ckan@ckan-test-db:5432/ckan_test
  #     - CKAN_DATASTORE_WRITE_URL=postgresql://ckan:ckan@ckan-test-db:5432/datastore_test
  #     - CKAN_DATASTORE_READ_URL=postgresql://datastore_ro:datastore_ro@ckan-test-db:5432/datastore_test
  #     - CKAN_SOLR_URL=http://ckan-test-solr:8983/solr/ckan
  #     - CKAN_REDIS_URL=redis://ckan-test-redis:6379/1
  #     - CKAN_SITE_URL=http://localhost:${CKAN_TEST_PORT:-5000}
  #     - CKAN_MAX_UPLOAD_SIZE_MB=500
  #     - CKAN_PLUGINS=stats text_view image_view recline_view datastore datapusher
  #   ports:
  #     - "${CKAN_TEST_PORT:-5000}:5000"
  #   volumes:
  #     - ckan-test-storage:/var/lib/ckan
  #   depends_on:
  #     ckan-test-db:
  #       condition: service_healthy
  #     ckan-test-solr:
  #       condition: service_healthy
  #     ckan-test-redis:
  #       condition: service_healthy
  #   networks:
  #     - hub-net
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5000/api/3/action/status_show"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

  # CKAN Test Database - PostgreSQL for CKAN test instance
  ckan-test-db:
    image: postgres:16-alpine
    container_name: hub-ckan-test-db
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ckan
      POSTGRES_DB: ckan_test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${CKAN_TEST_DB_PORT:-5434}:5432"
    volumes:
      - ckan-test-db-data:/var/lib/postgresql/data
      - ./scripts/init-ckan-db.sh:/docker-entrypoint-initdb.d/init-ckan-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan -d ckan_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub-net

  # CKAN Test Solr - Search engine for CKAN test instance
  ckan-test-solr:
    image: solr:9
    container_name: hub-ckan-test-solr
    command:
      - solr-precreate
      - ckan
    ports:
      - "${CKAN_TEST_SOLR_PORT:-8983}:8983"
    volumes:
      - ckan-test-solr-data:/var/solr
    healthcheck:
      # Solr 9: use node health API; /solr/admin/ping is per-core and may be disabled
      test: ["CMD", "curl", "-f", "http://localhost:8983/api/node/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hub-net

  # CKAN Test Redis - Cache for CKAN test instance
  ckan-test-redis:
    image: redis:7-alpine
    container_name: hub-ckan-test-redis
    command: redis-server --appendonly yes
    ports:
      - "${CKAN_TEST_REDIS_PORT:-6383}:6379"
    volumes:
      - ckan-test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hub-net

  # Mock Server - HTTP mock server for testing marketplace connectors
  # Provides REST API endpoints for testing without external dependencies
  # MockServer image is distroless (no shell/curl), so no in-container healthcheck.
  # API and worker use condition: service_started so stack comes up without blocking.
  mock-server:
    image: mockserver/mockserver:5.15.0
    container_name: hub-mock-server
    command: -serverPort 8080 -logLevel INFO
    ports:
      - "${MOCK_SERVER_PORT:-8095}:8080"
    networks:
      - hub-net

  # ODH Training Operator Service
  odh-training-operator:
    build:
      context: .
      dockerfile: services/odh-training-operator/Dockerfile
    container_name: hub-odh-training-operator
    ports:
      - "${ODH_TRAINING_OPERATOR_PORT:-8096}:8080"
    networks:
      - hub-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ODH Inference Scheduler Service
  odh-inference-scheduler:
    build:
      context: .
      dockerfile: services/odh-inference-scheduler/Dockerfile
    container_name: hub-odh-inference-scheduler
    ports:
      - "${ODH_INFERENCE_SCHEDULER_PORT:-8097}:8080"
    networks:
      - hub-net
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Traefik API Gateway
  traefik:
    image: traefik:v3.0
    container_name: hub-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=false"
      # Docker provider disabled due to API version incompatibility with Traefik v3.0
      # Use file-based configuration in ./infrastructure/traefik/dynamic/ instead
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hub.example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--metrics.prometheus=true"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "${TRAEFIK_SECURE_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8099}:8080"  # Dashboard (8099 to avoid conflict with semantic on 8081 when merged with dev)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - hub-net
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/rawdata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.hub.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  hub-net:
    driver: bridge

volumes:
  pgdata:
  postgres-baas-data:
  redis-cache-data:
  redis-queue-data:
  redis-events-data:
  redis-channels-data:
  redis-baas-data:
  minio-data:
  fuseki-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  prefect-server-data:
  prefect-db-data:
  traefik-letsencrypt:
  ckan-test-storage:
  ckan-test-db-data:
  ckan-test-solr-data:
  ckan-test-redis-data:
  clamav-db:

