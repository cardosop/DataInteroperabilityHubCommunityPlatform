# Phase 313.2 — core-only test stack overlay.
#
# Usage (exactly like the private full test stack, minus the paid layer):
#   docker compose -f docker-compose.test.yml -f docker-compose.test.core.yml \
#       --env-file .env.test up -d --build
#   make test-core   # convenience wrapper (Makefile.core)
#
# Design: an OVERLAY, not a copy — paid-layer services get a non-default
# compose profile so `docker compose up` (default profiles) excludes them.
# No service definition is duplicated, so the core stack cannot drift from
# the private one. Services without an entry below remain core.

services:
  # Core services pin their depends_on to core-only targets so the default
  # profile render never references a paid service (compose requires
  # depends_on targets to exist in the rendered model). `!reset` replaces
  # the base map instead of deep-merging it (compose v2.24+).
  # Boot-time DB services MUST also run core-only: migrate-test-db boots
  # full mode otherwise and imports paid apps (billing) that do not exist
  # in the public tree — the migration container crashes, the schema never
  # lands, and the suite fails on missing relations.
  migrate-test-db:
    environment:
      HUB_CORE_ONLY: "1"
  ensure-test-db:
    environment:
      HUB_CORE_ONLY: "1"
  api-service-test:
    # The SERVING process must be core-only, not just the pytest process:
    # gunicorn boots with the full paid schema otherwise, so the OpenAPI
    # drift gate and capability-derived route hiding would test full mode.
    # Map-form environment MERGES with the base file (compose v2.24+).
    environment:
      HUB_CORE_ONLY: "1"
    depends_on: !reset
      migrate-test-db:
        condition: service_completed_successfully
      ensure-test-db:
        condition: service_completed_successfully
      postgres-test:
        condition: service_healthy
      redis-cache-test:
        condition: service_healthy
      redis-queue-test:
        condition: service_healthy
      redis-events-test:
        condition: service_healthy
      redis-channels-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      mailhog-test:
        condition: service_started
  worker-service-test:
    environment:
      HUB_CORE_ONLY: "1"
    depends_on: !reset
      api-service-test:
        condition: service_started
      postgres-test:
        condition: service_healthy
      redis-cache-test:
        condition: service_healthy
      redis-queue-test:
        condition: service_healthy
      redis-events-test:
        condition: service_healthy
      redis-channels-test:
        condition: service_healthy
  postgres-baas-test:
    profiles: ["paid-excluded"]
  redis-baas-test:
    profiles: ["paid-excluded"]
  clamav-test:
    profiles: ["paid-excluded"]
  fuseki-test:
    profiles: ["paid-excluded"]
  datacontract-service-test:
    profiles: ["paid-excluded"]
    build: !reset null
  dq-service-test:
    profiles: ["paid-excluded"]
    build: !reset null
  compliance-service-test:
    profiles: ["paid-excluded"]
    build: !reset null
  compliance-rq-worker-test:
    profiles: ["paid-excluded"]
    build: !reset null
  semantic-service-test:
    profiles: ["paid-excluded"]
    build: !reset null
  prefect-server-test:
    profiles: ["paid-excluded"]
  prefect-db-test:
    profiles: ["paid-excluded"]
  ensure-prefect-work-pool:
    profiles: ["paid-excluded"]
  prefect-worker-test:
    profiles: ["paid-excluded"]
    build: !reset null
  prefect-integration-service-test:
    profiles: ["paid-excluded"]
    build: !reset null
  ckan-test:
    profiles: ["paid-excluded"]
    image: busybox:1.36
    build: !reset null
  ckan-test-db-test:
    profiles: ["paid-excluded"]
  ckan-test-solr-test:
    profiles: ["paid-excluded"]
  ckan-test-redis-test:
    profiles: ["paid-excluded"]
  odh-training-operator-test:
    profiles: ["paid-excluded"]
    build: !reset null
  odh-inference-scheduler-test:
    # Dockerfile lives under services/odh-inference-scheduler (excluded from
    # the public tree) — profile out AND null the build or compose fails to
    # resolve the context on a fresh public clone.
    profiles: ["paid-excluded"]
    build: !reset null
  # Routing layer plays no role in the core test stack (tests hit
  # api-service-test on 8001 directly) and its dashboard port (8099)
  # collides with a concurrently running dev stack on dev machines.
  traefik-test:
    profiles: ["paid-excluded"]
