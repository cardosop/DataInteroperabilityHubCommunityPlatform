[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
    -p no:django
    --asyncio-mode=auto
testpaths = tests
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Python 3.14 deprecated asyncio.AbstractEventLoopPolicy — pytest-asyncio
    # 1.3.0 still imports it.  Suppress the third-party deprecation until
    # upstream ships a fix.  Tracked: pytest-asyncio >= 1.4.0 may resolve this.
    ignore::DeprecationWarning:asyncio
markers =
    unit: Unit tests
    integration: Integration tests (require services to be running)
    e2e: End-to-end tests
    slow: Slow running tests
    requires_services: Tests that require external services to be running
    cli_sdk: CLI/SDK parity tests (Phase 26 et al.)
    mvp: Tests that MUST run under MVP_MODE=true (Phase 216)
    post_mvp: Tests for post-MVP features (skipped when MVP_MODE=true)
    performance: Performance / load tests (Phase 216.4)
    security: Security tests (Phase 216.5)
    timeout: Tests with explicit timeout settings (use pytest-timeout or custom)

