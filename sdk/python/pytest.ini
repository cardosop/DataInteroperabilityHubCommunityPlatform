[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --cov=datahub_interoperability
    --cov-report=html
    --cov-report=term-missing
    -v
markers =
    e2e: End-to-end tests (require real API services)
    integration: Integration tests (require real API services)

