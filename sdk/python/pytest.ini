[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    -v
markers =
    e2e: End-to-end tests (require real API services)
    integration: Integration tests (require real API services)
    mvp: Tests that MUST run under MVP_MODE=true (Phase 216)
    post_mvp: Tests for post-MVP features (skipped when MVP_MODE=true)
    performance: Performance / load tests (Phase 216.4)
    security: Security tests (Phase 216.5)
    cli_sdk: CLI SDK integration tests (Phase 26)

