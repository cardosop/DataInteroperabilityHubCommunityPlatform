# Alertmanager test configuration — minimal config for the test stack.
# The production config (alertmanager.yml) contains receivers with env-var
# placeholders and secret-file references that are not available in CI /
# local test environments.

global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

receivers:
  - name: 'default-receiver'
    # No-op receiver — test stack does not deliver notifications.

inhibit_rules: []
