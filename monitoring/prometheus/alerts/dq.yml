groups:
  - name: dq_alerts
    interval: 30s
    rules:
      # =====================================================================
      # Phase 240.1.B.1 (REQ-DQ-* / 240.1.B Prometheus alert rules)
      # =====================================================================
      # 8 PromQL rules covering the DQ feature's load-bearing signals:
      # run failure rate, run duration regression, dq-service circuit
      # breaker, alert-delivery health, per-engine success rate, run
      # queue depth, audit-write health, and S3 payload growth.
      #
      # Routing convention matches the lineage / mesh / odcs alert files
      # in this directory: ``severity`` ∈ {info, warning, critical} +
      # ``component=data-quality`` for alertmanager grouping. Annotations
      # carry a ``runbook`` field pointing to the matching anchor in
      # ``docs/runbooks/data-quality.md`` (240.1.D will create / extend
      # the runbook; the anchors below are the contract that runbook
      # implementers MUST honour).
      # ---------------------------------------------------------------------

      # ---- 1. Run failure rate ---------------------------------------------
      # Sustained failure rate > 5% over 15m → user-visible regression.
      # The denominator is clamped so a quiet tenant can't divide-by-zero.
      - alert: DQRunFailureRateHigh
        expr: |
          (
            sum(rate(dq_runs_total{status="FAIL"}[15m]))
            /
            clamp_min(sum(rate(dq_runs_total[15m])), 0.0001)
          ) > 0.05
        for: 15m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "DQ run failure rate > 5% over 15m"
          description: |
            Sustained failure rate is {{ $value | humanizePercentage }}
            (budget 5%). Likely causes: dq-service regression, profile
            mis-configuration, or a tenant-side bad data wave.  Pivot
            via ``rate(dq_runs_total{status="FAIL"}[5m]) by (engine,
            tenant_id)``. Runbook:
            docs/runbooks/data-quality.md#dq-run-failure-rate-high.
          runbook_url: "docs/runbooks/data-quality.md#dq-run-failure-rate-high"

      # ---- 2. Run duration p95 regression ----------------------------------
      # p95 latency > 2× the 7d-rolling baseline = engine slowdown OR
      # dataset-shape change. The 7d baseline is computed off the same
      # histogram so seasonal noise gets averaged out.
      - alert: DQRunDurationP95Regression
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le, engine) (rate(dq_run_duration_seconds_bucket[15m]))
            )
            /
            clamp_min(
              histogram_quantile(
                0.95,
                sum by (le, engine) (rate(dq_run_duration_seconds_bucket[7d]))
              ),
              0.001
            )
          ) > 2
        for: 15m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "DQ run p95 duration > 2× 7d-baseline (engine={{ $labels.engine }})"
          description: |
            DQ run p95 duration is {{ $value | humanize }}× the 7d
            baseline for engine {{ $labels.engine }}. Investigate
            row-count growth, profile change, or dq-service node
            saturation.
            Runbook: docs/runbooks/data-quality.md#dq-run-duration-p95-regression.
          runbook_url: "docs/runbooks/data-quality.md#dq-run-duration-p95-regression"

      # ---- 3. dq-service circuit breaker open ------------------------------
      # ``circuit_breaker_state{service="dq-service"}=2`` for 5m means
      # the upstream client side-circuit is open and queries are short-
      # circuiting to the fallback. Critical because run results stop
      # being persisted.
      - alert: DQServiceCircuitOpen
        expr: |
          max by (service) (
            circuit_breaker_state{service="dq-service"}
          ) == 2
        for: 5m
        labels:
          severity: critical
          component: data-quality
        annotations:
          summary: "dq-service circuit breaker OPEN for 5m"
          description: |
            The dq-service client circuit breaker has been OPEN for
            5+ minutes — DQ runs are returning the fallback (status
            UNKNOWN) instead of executing. Check dq-service pod
            health, network egress, and recent deploys.
            Runbook: docs/runbooks/data-quality.md#dq-service-circuit-open.
          runbook_url: "docs/runbooks/data-quality.md#dq-service-circuit-open"

      # ---- 4. Alert delivery error rate ------------------------------------
      # > 10% delivery error rate over 30m means the alert pipeline
      # itself is unreliable — operator awareness is the load-bearing
      # property here, so this is a critical even if no individual
      # alert is firing.
      - alert: DQAlertDeliveryFailing
        expr: |
          (
            sum(rate(dq_alert_deliveries_total{status="FAIL"}[30m]))
            /
            clamp_min(sum(rate(dq_alert_deliveries_total[30m])), 0.0001)
          ) > 0.1
        for: 30m
        labels:
          severity: critical
          component: data-quality
        annotations:
          summary: "DQ alert delivery error rate > 10% over 30m"
          description: |
            DQ alert delivery is failing at {{ $value | humanizePercentage }}
            over the last 30 minutes — operators may not be hearing
            real DQ failures.  Check delivery-channel credentials
            (SES quota, Slack token, PagerDuty service-key) + the
            ``DQ_ALERT_FAILED`` audit-event stream.
            Runbook: docs/runbooks/data-quality.md#dq-alert-delivery-failing.
          runbook_url: "docs/runbooks/data-quality.md#dq-alert-delivery-failing"

      # ---- 5. Engine success rate ------------------------------------------
      # ``dq_success_rate`` is a service-side gauge (0-1). Per-engine
      # value < 0.9 sustained for 1h → that engine adapter has a
      # systemic problem (deps drift, profile bug, OOM).
      - alert: DQEngineSuccessRateDrop
        expr: |
          min by (engine) (dq_success_rate) < 0.9
        for: 1h
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "DQ engine {{ $labels.engine }} success rate < 90% for 1h"
          description: |
            Engine {{ $labels.engine }} has been below the 90% success
            rate floor for an hour. Check the engine adapter's recent
            structured logs for ``adapter_execute_failed`` and the
            most-frequent failing profile via ``rate(dq_runs_total
            {status="FAIL", engine="{{ $labels.engine }}"}[1h]) by
            (profile_key)``.
            Runbook: docs/runbooks/data-quality.md#dq-engine-success-rate-drop.
          runbook_url: "docs/runbooks/data-quality.md#dq-engine-success-rate-drop"

      # ---- 6. Run queue depth ----------------------------------------------
      # > 100 pending runs sustained for 30m → workers can't keep up.
      # ``dq_async_queue_depth`` is updated by the queue inspector
      # endpoint on the worker side.
      - alert: DQRunQueueDepth
        expr: |
          max(dq_async_queue_depth) > 100
        for: 30m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "DQ run queue depth > 100 pending for 30m"
          description: |
            DQ run queue depth is {{ $value | humanize }} pending and
            has stayed there for 30+ minutes. Workers are likely
            under-scaled for current load. Bump the worker HPA min
            replicas OR investigate stuck individual runs via the
            ``recover-stuck-jobs`` CronJob.
            Runbook: docs/runbooks/data-quality.md#dq-run-queue-depth.
          runbook_url: "docs/runbooks/data-quality.md#dq-run-queue-depth"

      # ---- 7. Audit-event write failures -----------------------------------
      # Audit writes are the regulator-grade evidence trail. ANY
      # sustained write-error (>1/min) is a compliance-impacting
      # signal — pages oncall.
      - alert: DQAuditWriteFailing
        expr: |
          sum(rate(dq_audit_write_errors_total[5m])) > 1 / 60
        for: 5m
        labels:
          severity: critical
          component: data-quality
        annotations:
          summary: "DQ audit-event writes failing > 1/min"
          description: |
            DQ audit-event writes are failing at
            {{ $value | humanize }} errors / second. Compliance
            evidence is at risk.  Check the audit-table connection
            pool, recent migrations, and the
            ``audit_event_write_failed`` log entries.
            Runbook: docs/runbooks/data-quality.md#dq-audit-write-failing.
          runbook_url: "docs/runbooks/data-quality.md#dq-audit-write-failing"

      # ---- 8. S3 payload growth anomaly ------------------------------------
      # The collector populates ``dq_s3_payload_bytes_total`` daily.
      # Growth > 2σ above the 7d-rolling baseline = a runaway tenant
      # OR a retention-policy regression. Computed at the per-tenant
      # gauge level (sum across labels would mask single-tenant
      # anomalies).
      - alert: DQS3PayloadGrowthAnomaly
        expr: |
          (
            (
              dq_s3_payload_bytes_total
              -
              avg_over_time(dq_s3_payload_bytes_total[7d])
            )
            /
            clamp_min(stddev_over_time(dq_s3_payload_bytes_total[7d]), 1)
          ) > 2
        for: 1h
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: >-
            DQ S3 payload bytes > 2σ above 7d baseline
            (tenant_id={{ $labels.tenant_id }})
          description: |
            Tenant {{ $labels.tenant_id }} DQ S3 payload bytes are
            {{ $value | humanize }}σ above the 7d baseline. Likely
            causes: a profile that snapshots full datasets, a runaway
            ingestion, or a stuck retention cleanup. Investigate via
            the ``data-quality`` Grafana board's "S3 payload-bucket
            size trend" panel.
            Runbook: docs/runbooks/data-quality.md#dq-s3-payload-growth-anomaly.
          runbook_url: "docs/runbooks/data-quality.md#dq-s3-payload-growth-anomaly"
