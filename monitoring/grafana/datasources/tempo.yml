apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    isDefault: false
    editable: true
    jsonData:
      # Enable TraceQL search (Tempo 2.x)
      tracesToLogsV2:
        # Link traces to Loki logs via trace ID correlation
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        # Match logs from the same service within ±1 minute of the span
        query: '{service="${__span.tags.service.name}"} |= "${__span.traceId}"'
        tags:
          - key: "service.name"
            value: "service"
          - key: "tenant_id"

      tracesToMetrics:
        # Link trace spans to Prometheus metrics via exemplars
        datasourceUid: prometheus
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: "service.name"
            value: "job"
        queries:
          - name: "Request rate"
            query: "sum(rate(http_server_request_duration_seconds_count{$$__tags}[5m]))"
          - name: "Error rate"
            query: >-
              sum(rate(django_http_responses_total{$$__tags,status=~"5.."}[5m]))
              / sum(rate(django_http_responses_total{$$__tags}[5m]))

      # Enable search — shows tag-value autocomplete in Explore
      search:
        hide: false

      # Enable node graph for service topology
      nodeGraph:
        enabled: true

      # Enable TraceQL (Tempo 2.x structured query language)
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "1h"
        spanEndTimeShift: "-1h"

      # ServiceMap: uses the service_graphs metrics generated by Tempo
      # and stored in Prometheus — renders topology in Grafana Explore
      serviceMap:
        datasourceUid: prometheus

      lokiSearch:
        datasourceUid: loki
