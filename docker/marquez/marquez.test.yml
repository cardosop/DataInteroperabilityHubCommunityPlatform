# Marquez test configuration — overrides the default dev config to use
# the test Postgres instance at postgres-test instead of the hardcoded
# "postgres" host in the upstream marquez.yml.

server:
  applicationConnectors:
    - type: http
      port: ${MARQUEZ_PORT:-5000}
  adminConnectors:
    - type: http
      port: ${MARQUEZ_ADMIN_PORT:-5001}

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://postgres-test:5432/marquez?user=hub_test&password=hub_test
