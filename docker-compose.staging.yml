services:
  postgres:
    image: postgres:16-alpine
    container_name: hub-staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_INITDB_ARGS: -E UTF8
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:?PGBOUNCER_ADMIN_PASSWORD is required}
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - pgdata-staging:/var/lib/postgresql/data
    - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    - ./infrastructure/postgres/03-pgbouncer-user.sh:/docker-entrypoint-initdb.d/03-pgbouncer-user.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-hub} || exit 1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
    - hub-net-staging

  # PgBouncer — connection pooler (Staging)
  # No TLS in staging; uses scram-sha-256 auth_query via pgbouncer_lookup().
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: hub-staging-pgbouncer
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        USERLIST=/etc/pgbouncer/userlist.txt
        printf '"pgbouncer" "%s"\n"pgbouncer_admin" "%s"\n' \
          "${PGBOUNCER_AUTH_PASSWORD}" \
          "${PGBOUNCER_ADMIN_PASSWORD}" \
          > "${USERLIST}"
        chmod 600 "${USERLIST}"
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:?PGBOUNCER_ADMIN_PASSWORD is required}
    ports:
      - "${PGBOUNCER_PORT:-5433}:5432"
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.staging.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # nc -z: TCP connect-only probe; edoburu/pgbouncer (Alpine) has no psql.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - hub-net-staging
  # Redis Cache Instance - Response caching, contract caching, lineage caching
  redis-cache:
    image: redis:7-alpine
    container_name: hub-staging-redis-cache
    command: 'redis-server --save 900 1 --save 300 10 --save 60 10000 --maxmemory ${REDIS_CACHE_MAX_MEMORY:-2gb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_CACHE_PORT:-6379}:6379
    volumes:
    - redis-cache-data-staging:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 5
    networks:
    - hub-net-staging
    environment:
      REDIS_MAX_MEMORY: ${REDIS_CACHE_MAX_MEMORY:-2gb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO

  # Redis Queue Instance - Job queues (RQ)
  redis-queue:
    image: redis:7-alpine
    container_name: hub-staging-redis-queue
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_QUEUE_MAX_MEMORY:-1gb} --maxmemory-policy noeviction
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_QUEUE_PORT:-6380}:6379
    volumes:
    - redis-queue-data-staging:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 5
    networks:
    - hub-net-staging
    environment:
      REDIS_MAX_MEMORY: ${REDIS_QUEUE_MAX_MEMORY:-1gb}
      REDIS_MAXMEMORY_POLICY: noeviction
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO

  # Redis Events Instance - Event bus (Pub/Sub, Streams)
  redis-events:
    image: redis:7-alpine
    container_name: hub-staging-redis-events
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_EVENTS_MAX_MEMORY:-1gb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_EVENTS_PORT:-6381}:6379
    volumes:
    - redis-events-data-staging:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 5
    networks:
    - hub-net-staging
    environment:
      REDIS_MAX_MEMORY: ${REDIS_EVENTS_MAX_MEMORY:-1gb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO

  # Redis Channels Instance - WebSocket channels (Django Channels)
  redis-channels:
    image: redis:7-alpine
    container_name: hub-staging-redis-channels
    command: 'redis-server --maxmemory ${REDIS_CHANNELS_MAX_MEMORY:-512mb} --maxmemory-policy allkeys-lru
      --tcp-backlog ${REDIS_TCP_BACKLOG:-511} --timeout ${REDIS_TIMEOUT:-300} --tcp-keepalive ${REDIS_TCP_KEEPALIVE:-300}

      '
    ports:
    - ${REDIS_CHANNELS_PORT:-6382}:6379
    volumes:
    - redis-channels-data-staging:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 5
    networks:
    - hub-net-staging
    environment:
      REDIS_MAX_MEMORY: ${REDIS_CHANNELS_MAX_MEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hub-staging-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    ports:
    - ${MINIO_API_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data-staging:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 20s
      timeout: 20s
      retries: 5
    networks:
    - hub-net-staging
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: hub-staging-fuseki
    environment:
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?FUSEKI_ADMIN_PASSWORD is required}
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
      # Phase 27: increased heap for named-graph index growth + SHACL
      JVM_ARGS: "-Xmx2g -Xms512m -XX:+UseG1GC"
    ports:
    - ${FUSEKI_PORT:-3030}:3030
    volumes:
    - fuseki-data-staging:/fuseki
    - ./infrastructure/fuseki/config.ttl:/fuseki/configuration/hub.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping | grep -q '\"status\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
    - hub-net-staging
  semantic-service:
    build:
      context: .
      dockerfile: services/semantic-service/Dockerfile
    container_name: hub-staging-semantic
    ports:
    - ${SEMANTIC_PORT:-8081}:8081
    environment:
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-hub}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?FUSEKI_ADMIN_PASSWORD is required}
      HUB_DOMAIN: ${HUB_DOMAIN:-staging.hub.example.com}
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    volumes:
    - ./services/semantic-service:/app:ro
    dns:
    - 8.8.8.8
    - 1.1.1.1
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/health
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hub-staging-api
    command: ["gunicorn", "hub.asgi:application", "--config", "gunicorn.conf.py"]
    volumes:
    - .:/app
    ports:
    - ${API_PORT:-8000}:8000
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      APP_NAME: ${APP_NAME:-Meshant}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8000}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      OPENTELEMETRY_ENABLED: ${OPENTELEMETRY_ENABLED:-true}
      OPENTELEMETRY_METRICS_ENABLED: ${OPENTELEMETRY_METRICS_ENABLED:-true}
      JAEGER_AGENT_HOST: ${JAEGER_AGENT_HOST:-jaeger}
      JAEGER_AGENT_PORT: ${JAEGER_AGENT_PORT:-6831}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      PGBOUNCER_ENABLED: 'true'
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: 'False'
      LOG_LEVEL: INFO
      # Compliance Service URL (explicit so api-service can reach compliance-service by Docker network hostname)
      COMPLIANCE_SERVICE_URL: http://compliance-service:8082
      # Phase 26: Supported spec versions
      ODCS_VERSIONS_SUPPORTED: "2.2.2,3.0.0,3.0.1,3.0.2,3.1.0"
      ODPS_VERSIONS_SUPPORTED: "1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0"
      HUBCONTRACT_BACKFILL_BATCH_SIZE: "200"
      # Stripe billing (test keys for staging)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51T412N79Dw5TG33rxbm9F3zSZ1rPxI5En7Tb2n8OL65Cd9wwCdpuiPsIcmi5qQATGzx7pMrGNKKj1pQiwB7w45Hw004ICHrRJe}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MARKETPLACE_WEBHOOK_SECRET: ${STRIPE_MARKETPLACE_WEBHOOK_SECRET:-}
      # Phase 271.2 — Stripe Connect webhook signing secret (optional; falls back to STRIPE_WEBHOOK_SECRET)
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      SEARCH_RATE_LIMIT_PER_MIN: ${SEARCH_RATE_LIMIT_PER_MIN:-60/min}
      SUGGESTIONS_RATE_LIMIT_PER_MIN: ${SUGGESTIONS_RATE_LIMIT_PER_MIN:-120/min}
      SPARQL_RATE_LIMIT_PER_MIN: ${SPARQL_RATE_LIMIT_PER_MIN:-10/min}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  worker-service:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Meshant}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:8000}
      EMAIL_JOB_NOTIFICATIONS_ENABLED: ${EMAIL_JOB_NOTIFICATIONS_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-${APP_NAME:-Meshant}}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-${APP_NAME:-Meshant}}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${APP_NAME:-Meshant}}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_RESERVED_SLOTS_RATIO: ${WORKER_RESERVED_SLOTS_RATIO:-0.5}
      WORKER_STARVATION_THRESHOLD_SECONDS: ${WORKER_STARVATION_THRESHOLD_SECONDS:-300}
      OPENTELEMETRY_ENABLED: ${OPENTELEMETRY_ENABLED:-true}
      OPENTELEMETRY_METRICS_ENABLED: ${OPENTELEMETRY_METRICS_ENABLED:-true}
      JAEGER_AGENT_HOST: ${JAEGER_AGENT_HOST:-jaeger}
      JAEGER_AGENT_PORT: ${JAEGER_AGENT_PORT:-6831}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      PGBOUNCER_ENABLED: 'true'
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: 'False'
      LOG_LEVEL: INFO
      # Compliance Service URL (explicit so worker can reach compliance-service by Docker network hostname)
      COMPLIANCE_SERVICE_URL: http://compliance-service:8082
      # Phase 26: backfill batch size
      HUBCONTRACT_BACKFILL_BATCH_SIZE: "200"
    container_name: hub-staging-worker
    command: python services/worker/main.py job_critical job_default job_low
    ports:
    - ${WORKER_HEALTH_PORT:-8080}:8080
    volumes:
    - .:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      redis-channels:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/healthz
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  datacontract-service:
    build:
      context: .
      dockerfile: services/datacontract-service/Dockerfile
    container_name: hub-staging-datacontract
    ports:
    - ${DATACONTRACT_PORT:-8092}:8080
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 20s
      timeout: 10s
      retries: 5
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
      ODCS_VERSIONS_SUPPORTED: "2.2.2,3.0.0,3.0.1,3.0.2,3.1.0"
      ODPS_VERSIONS_SUPPORTED: "1.x,2.x,3.x,4.0,4.1,4.2,bitol-0.9.0,bitol-1.0.0"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-staging-compliance
    ports:
    - ${COMPLIANCE_PORT:-8082}:8082
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8082/health
      interval: 20s
      timeout: 10s
      retries: 5
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
      # shared/auth.py raises ValueError at startup if this is absent.
      # Must be set in the staging .env or CI secret store.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Phase 19.14.1 — async scan worker configuration
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      COMPLIANCE_SCANNER_WORKERS: "4"
    depends_on:
      redis-queue:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  # Compliance RQ Worker — Phase 19.14.1
  # Processes async scan jobs from the 'compliance-scan' Redis queue.
  compliance-rq-worker:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: hub-staging-compliance-rq-worker
    command: ["rq", "worker", "compliance-scan", "--url", "redis://redis-queue:6379/0"]
    networks:
    - hub-net-staging
    environment:
      ENVIRONMENT: staging
      LOG_LEVEL: INFO
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      COMPLIANCE_WORKER_THREADS: "4"
    depends_on:
      redis-queue:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  dq-service:
    build:
      context: .
      dockerfile: services/dq-service/Dockerfile
    container_name: hub-staging-dq
    ports:
    - ${DQ_PORT:-8083}:8083
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8083/health
      interval: 20s
      timeout: 10s
      retries: 5
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  prefect-server:
    build:
      context: .
      dockerfile: services/prefect-server/Dockerfile
    container_name: hub-staging-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect}@prefect-db:5432/prefect
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    ports:
    - ${PREFECT_SERVER_PORT:-4200}:4200
    - ${PREFECT_UI_PORT:-4201}:4201
    volumes:
    - prefect-server-data-staging:/root/.prefect
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4200/health
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
    - hub-net-staging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  prefect-db:
    image: postgres:16-alpine
    container_name: hub-staging-prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect}
      POSTGRES_DB: prefect
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    ports:
    - ${PREFECT_DB_PORT:-5433}:5432
    volumes:
    - prefect-db-data-staging:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U prefect
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
    - hub-net-staging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: hub-staging-prefect-worker
    command: prefect worker start --pool ${PREFECT_WORKER_POOL:-default} --type process
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      # Hub API configuration for scheduled ingestion worker API
      HUB_BASE_URL: ${HUB_BASE_URL:-http://api-service:8000}
      HUB_WORKER_API_KEY: ${HUB_WORKER_API_KEY:-}
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    volumes:
    - ./services/prefect-integration:/app:ro
    depends_on:
      prefect-server:
        condition: service_healthy
      api-service:
        condition: service_healthy
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  prefect-integration-service:
    build:
      context: .
      dockerfile: services/prefect-integration/Dockerfile
    container_name: hub-staging-prefect-integration
    ports:
    - ${PREFECT_INTEGRATION_PORT:-8084}:8084
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@pgbouncer:5432/${POSTGRES_DB:-hub}
      LOG_LEVEL: INFO
      ENVIRONMENT: staging
      DEBUG: 'False'
    depends_on:
      prefect-server:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8084/health
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hub-staging-prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    ports:
    - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
    - prometheus-data-staging:/prometheus
    networks:
    - hub-net-staging
    depends_on:
    - api-service
    - worker-service
    - semantic-service
    - dq-service
    - compliance-service
    - datacontract-service
    - prefect-integration-service
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 20s
      timeout: 10s
      retries: 5
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hub-staging-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ''
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    ports:
    - ${GRAFANA_PORT:-3001}:3000
    volumes:
    - grafana-data-staging:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
    - hub-net-staging
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    container_name: hub-staging-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    ports:
    - ${JAEGER_UI_PORT:-16686}:16686
    - ${JAEGER_HTTP_PORT:-14268}:14268
    - ${JAEGER_UDP_PORT:-6831}:6831/udp
    networks:
    - hub-net-staging
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:16686/
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hub-staging-alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    ports:
    - ${ALERTMANAGER_PORT:-9093}:9093
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager-data-staging:/alertmanager
    networks:
    - hub-net-staging
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9093/-/healthy
      interval: 20s
      timeout: 10s
      retries: 5
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
  traefik:
    image: traefik:v3.0
    container_name: hub-staging-traefik
    command:
    - --api.dashboard=true
    - --api.insecure=true
    - --providers.docker=true
    - --providers.docker.exposedByDefault=false
    - --providers.docker.network=hub-net-staging
    - --providers.file.directory=/etc/traefik/dynamic
    - --providers.file.watch=true
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    - --certificatesresolvers.letsencrypt.acme.email=admin@hub.example.com
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --log.level=INFO
    - --log.format=json
    - --accesslog=true
    - --accesslog.format=json
    - --metrics.prometheus=true
    ports:
    - ${TRAEFIK_PORT:-8099}:80
    - ${TRAEFIK_SECURE_PORT:-8443}:443
    - ${TRAEFIK_DASHBOARD_PORT:-8098}:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    - traefik-letsencrypt-staging:/letsencrypt
    networks:
    - hub-net-staging
    depends_on:
    - jaeger
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:8080/ping
      interval: 20s
      timeout: 10s
      retries: 5
    labels:
    - traefik.enable=true
    - traefik.http.routers.traefik.rule=Host(`traefik.hub.local`)
    - traefik.http.routers.traefik.service=api@internal
    environment:
      ENVIRONMENT: staging
      DEBUG: 'False'
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
  # ---------------------------------------------------------------------------
  # HashiCorp Vault — REMOVED (Phase 211: Vault → AWS Secrets Manager)
  # Secrets are now stored in AWS Secrets Manager.
  # ---------------------------------------------------------------------------

networks:
  hub-net-staging:
    driver: bridge
volumes:
  pgdata-staging: {}
  redis-cache-data-staging: {}
  redis-queue-data-staging: {}
  redis-events-data-staging: {}
  redis-channels-data-staging: {}
  minio-data-staging: {}
  fuseki-data-staging: {}
  prometheus-data-staging: {}
  grafana-data-staging: {}
  alertmanager-data-staging: {}
  prefect-server-data-staging: {}
  prefect-db-data-staging: {}
  traefik-letsencrypt-staging: {}
