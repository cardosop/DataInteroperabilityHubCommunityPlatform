# Codecov configuration for test coverage reporting

codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 90%
        threshold: 1%
        base: auto
        branches:
          - main
          - develop
    patch:
      default:
        target: 90%
        threshold: 1%
        base: auto

flags:
  unittests:
    paths:
      - tests/unit/
    carryforward: true
  integration:
    paths:
      - tests/integration/
    carryforward: true
  e2e:
    paths:
      - tests/e2e/
    carryforward: true

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "*/migrations/*"
  - "*/tests/*"
  - "*/__pycache__/*"
  - "*/venv/*"
  - "*/node_modules/*"
  - "*/build/*"
  - "*/dist/*"
  - "*/coverage/*"
  - "*/htmlcov/*"
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - ".pytest_cache"
  - ".coverage"
